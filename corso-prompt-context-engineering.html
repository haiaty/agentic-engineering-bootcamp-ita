/* ---------- 3. Metaprompting ---------- */
MODULES.push({
  id:'m3', n:'03', title:'Metaprompting', min:35,
  blocks:[
    {t:'p',html:`<p><strong>Metaprompting</strong> &egrave; usare un modello linguistico come strumento per lavorare <em>sui prompt</em> anzich&eacute; <em>sul compito</em>: generarli, criticarli, riscriverli, comprimerli, generare i casi di test per valutarli e in alcuni casi valutarli. Il modello passa da esecutore a collaboratore nel design del prompt.</p>
      <p>&Egrave; molto efficace per una ragione asimmetrica: <em>riconoscere</em> che cosa manca a un prompt &egrave; pi&ugrave; facile che <em>scriverlo</em> perfetto al primo colpo. Il modello, che ha visto un numero enorme di istruzioni ben scritte, &egrave; un buon critico anche quando non sarebbe un buon autore.</p>`},

    {t:'p',html:`<h3>I cinque pattern che userai davvero</h3>`},
    {t:'cards',cards:[
      {tag:'Pattern 1',h:'Generator',p:'Dalla descrizione del compito a un prompt strutturato completo, con formato, casi limite e vincoli.'},
      {tag:'Pattern 2',h:'Critic',p:'Il modello valuta un prompt esistente contro una rubrica esplicita e propone modifiche puntuali.'},
      {tag:'Pattern 3',h:'Failure-driven',p:'Gli dai il prompt e 5 output sbagliati: deve diagnosticare la causa e correggere solo ciò che serve.'},
      {tag:'Pattern 4',h:'Test-set generator',p:'Genera 15–20 input di prova, inclusi casi limite, per valutare le versioni del prompt.'},
      {tag:'Pattern 5',h:'Judge',p:'Un prompt che valuta output secondo criteri dichiarati. Va calibrato su giudizi umani.'}
    ]},

    {t:'p',html:`<h3>Pattern 1 &middot; Il prompt generator</h3>
      <p>Lo scheletro di un buon meta-prompt generatore &egrave; sempre lo stesso: dichiara che l’output &egrave; <em>un prompt</em> (non la soluzione del compito), fornisci il contesto del compito, imponi una struttura obbligatoria e chiedi di esplicitare le assunzioni fatte.</p>`},
    {t:'code',lang:'text',code:`Sei un esperto di prompt engineering. Il tuo output non e' la soluzione
del compito descritto: e' IL PROMPT che risolvera' quel compito.

<compito>
{{DESCRIZIONE_DEL_COMPITO}}
</compito>
<destinatario_output>{{CHI_LEGGE_E_PERCHE}}</destinatario_output>
<vincoli>{{FORMATO, LUNGHEZZA, TONO, DIVIETI}}</vincoli>
<esempi_reali>{{1-2 INPUT VERI}}</esempi_reali>

Il prompt che produci deve contenere, in questo ordine:
1. Ruolo e conseguenza della decisione.
2. Definizioni operative di ogni termine valutativo usato
   (niente "urgente", "importante", "conciso" senza criterio).
3. Sezione dati delimitata con tag e segnaposto {{...}}.
4. Formato di output mostrato con un esempio compilato.
5. Regole per i casi limite: dato mancante, input ambiguo,
   richiesta fuori perimetro, informazioni contraddittorie.
6. Un vincolo di lunghezza verificabile.

Dopo il prompt, aggiungi due sezioni:
<assunzioni>Cosa hai dovuto assumere e che risposta ti servirebbe.</assunzioni>
<rischi>I 3 modi piu' probabili in cui questo prompt fallira'.</rischi>`},

    {t:'p',html:`<h3>Pattern 2 &middot; Il critic con rubrica</h3>
      <p>&laquo;Migliora questo prompt&raquo; produce riscritture pi&ugrave; lunghe e non necessariamente migliori. La differenza la fa la <strong>rubrica</strong>: criteri numerati, un punteggio per criterio, e l’obbligo di citare il pezzo di testo problematico. Il vincolo &laquo;non allungare&raquo; &egrave; importante perch&eacute; la tendenza naturale del modello &egrave; aggiungere.</p>`},
    {t:'code',lang:'text',code:`Valuta il prompt in <candidato> come farebbe un revisore severo.

Per ognuno di questi criteri assegna 0-2 (0 assente, 1 parziale, 2 solido)
e CITA la porzione di testo che motiva il voto:
C1 compito e destinatario espliciti
C2 termini valutativi definiti operativamente
C3 formato di output non ambiguo
C4 casi limite governati
C5 vincoli positivi e verificabili
C6 assenza di istruzioni in conflitto tra loro o con gli esempi
C7 densita': ogni frase serve

Poi produci:
<diagnosi>I 3 difetti piu' costosi, in ordine di impatto.</diagnosi>
<riscrittura>Il prompt corretto. Vincolo: non piu' lungo dell'originale
piu' 20%. Modifica solo cio' che i difetti richiedono.</riscrittura>
<diff>Elenco puntato di cosa hai cambiato e perche'.</diff>

<candidato>{{PROMPT_DA_VALUTARE}}</candidato>`},

    {t:'p',html:`<h3>Pattern 3 &middot; Il refinement guidato dai fallimenti</h3>
      <p>&Egrave; il pattern con il miglior rendimento reale, perch&eacute; parte da dati e non da opinioni. Raccogli 5&ndash;10 casi in cui il prompt ha sbagliato, e per ciascuno annota <em>che cosa avresti voluto</em>. Poi chiedi al modello di diagnosticare prima di correggere.</p>`},
    {t:'code',lang:'text',code:`Questo prompt e' in produzione e sbaglia su alcuni casi.

<prompt_attuale>{{PROMPT}}</prompt_attuale>
<fallimenti>
CASO 1 — input: ... | output ottenuto: ... | output desiderato: ...
CASO 2 — ...
</fallimenti>

Procedi in tre passi separati:
1. <diagnosi> Per ogni caso, quale specifica carenza del prompt lo spiega?
   Distingui: informazione mancante | istruzione ambigua | esempio
   fuorviante | formato non vincolato | caso limite non previsto |
   compito oltre la portata di un singolo prompt.
2. <pattern> Le diagnosi hanno una causa comune? Quale?
3. <correzione> Modifica minima che risolve la causa comune senza
   rompere i casi che oggi funzionano. Non riscrivere da zero.

Se la causa e' che il prompt fa troppe cose, proponi la scomposizione
in piu' chiamate invece di un prompt piu' lungo.`},

    {t:'callout',kind:'warn',title:'Il limite strutturale del metaprompting',html:`Il modello non ha accesso ai tuoi dati reali, ai tuoi utenti, alle conseguenze dei suoi errori. Producendo prompt <em>plausibili</em> pu&ograve; fabbricare criteri che suonano professionali ma non corrispondono al tuo dominio &mdash; soglie inventate, categorie che nel tuo processo non esistono. <strong>Il metaprompting accelera la scrittura, non sostituisce la validazione.</strong> Senza un set di test, ti d&agrave; solo prompt pi&ugrave; belli.`},

    {t:'p',html:`<h3>Il ciclo eval-driven: dove finisce l’artigianato</h3>
      <p>Questo &egrave; il passaggio che separa chi &laquo;sa scrivere prompt&raquo; da chi li mette in produzione. Nessuna delle tecniche viste finora ha valore se non sai <em>misurare</em> se un cambiamento migliora le cose.</p>
      <ol>
        <li><strong>Raccogli 15&ndash;20 casi reali</strong>, con difficolt&agrave; assortita e almeno un terzo di casi limite. Non inventarli tutti: i casi veri contengono la sporcizia che i casi inventati non hanno.</li>
        <li><strong>Definisci il criterio di correttezza</strong> caso per caso. Pu&ograve; essere esatto (etichetta giusta, JSON valido, campo presente) o un giudizio con rubrica. Se non riesci a dire quando un output &egrave; giusto, non hai ancora capito il compito &mdash; e questo &egrave; il risultato pi&ugrave; utile del passaggio.</li>
        <li><strong>Misura la baseline</strong> del prompt attuale su tutti i casi.</li>
        <li><strong>Cambia una cosa alla volta</strong> e rimisura. Cambiarne cinque insieme ti dice solo che &laquo;qualcosa&raquo; ha funzionato.</li>
        <li><strong>Analizza i fallimenti residui</strong> e alimenta il Pattern 3. Aggiungi al set ogni nuovo caso rotto trovato in produzione: il test set cresce con la tua comprensione del problema.</li>
      </ol>
      <p>Il costo di partenza &egrave; qualche ora. Il ritorno &egrave; che da quel momento ogni discussione sui prompt si chiude con un numero invece che con un’opinione.</p>`},
    {t:'callout',kind:'ok',title:'Metrica minima praticabile',html:`Non serve un’infrastruttura. Un foglio di calcolo con <em>input · output atteso · output v1 · ok? · output v2 · ok?</em> su venti righe &egrave; gi&agrave; un eval, ed &egrave; infinitamente meglio di nessun eval. Aggiungi una colonna &laquo;nota sul fallimento&raquo;: sar&agrave; la materia prima del prossimo miglioramento.`},

    {t:'quiz',id:'q3a',q:'Chiedi al modello di riscrivere un prompt. La versione nuova è più dettagliata, meglio strutturata, e sul caso che stavi guardando funziona. La adotti?',
      opts:[
        {tx:'Sì: è più strutturata e ha funzionato',ok:false,why:'Un solo caso non è evidenza, e la struttura non è qualità. Le riscritture generate tendono ad aggiungere vincoli plausibili ma arbitrari, che possono rompere casi che prima funzionavano — e non te ne accorgi guardando un esempio.'},
        {tx:'No: prima la confronto con la versione attuale su un set di casi',ok:true,why:'Esatto. Il metaprompting genera ipotesi, non conclusioni. Il confronto A/B su 15–20 casi è ciò che trasforma un’ipotesi in una decisione — e spesso rivela regressioni sui casi facili.'},
        {tx:'Sì, ma solo se il modello è più grande di quello che esegue il compito',ok:false,why:'La dimensione del generatore non garantisce l’aderenza al tuo dominio, che è il vero rischio.'},
        {tx:'No: le riscritture automatiche sono sistematicamente peggiori',ok:false,why:'Troppo severo. Sono spesso migliori — semplicemente non lo sai finché non misuri.'}
      ]},
    {t:'quiz',id:'q3b',q:'Nel Pattern 3 (failure-driven) perché si impone al modello di fare la diagnosi in una sezione separata prima della correzione?',
      opts:[
        {tx:'Per rendere l’output più leggibile per il revisore umano',ok:false,why:'È un beneficio collaterale, non la ragione principale.'},
        {tx:'Per obbligarlo a identificare la causa comune invece di rattoppare i sintomi',ok:true,why:'Corretto, e ha due effetti. Primo: senza diagnosi il modello aggiunge una regola per ogni caso rotto, e il prompt diventa un elenco di eccezioni fragile. Secondo: la diagnosi è leggibile e contestabile da te — se la causa individuata è sbagliata, lo vedi prima di adottare la correzione.'},
        {tx:'Perché la diagnosi consuma token e migliora la qualità in sé',ok:false,why:'Lo spazio di ragionamento aiuta, ma qui il punto è il contenuto specifico che gli chiedi di produrre.'},
        {tx:'Perché permette di scartare i casi limite',ok:false,why:'I casi limite sono precisamente quelli da non scartare.'}
      ]},

    {t:'metalab'},

    {t:'exercise',id:'ex3',label:'Esercizio 3.2 — Il tuo mini test set (8 minuti)',
      prompt:'Per il tuo caso d’uso, elenca 6 casi di test: 3 tipici e 3 limite. Per ciascuno scrivi l’input in forma abbreviata e il criterio con cui deciderai se l’output è accettabile. Il criterio deve essere verificabile da una persona diversa da te.',
      placeholder:'T1 input: ... | criterio: ...\nT2 ...\nT3 ...\nL1 (dato mancante) input: ... | criterio: deve rispondere NON_DETERMINABILE e non inventare la data\nL2 (fuori perimetro) ...\nL3 (dati contraddittori) ...',
      solution:`<p>Segnali che il tuo test set &egrave; buono:</p>
        <ul>
          <li><strong>I criteri sono decidibili da un terzo.</strong> &laquo;Il riassunto &egrave; buono&raquo; non lo &egrave;. &laquo;Cita entrambe le scadenze presenti nel testo e nessuna assente&raquo; s&igrave;.</li>
          <li><strong>I casi limite hanno criteri di astensione</strong>, non solo di risposta: la cosa da verificare &egrave; che il modello <em>non</em> inventi.</li>
          <li><strong>Almeno un caso &egrave; oggi fallito</strong> dal tuo prompt attuale. Un set che passa al 100% dal primo giorno &egrave; un set troppo facile: non pu&ograve; distinguere due versioni.</li>
          <li><strong>Sono casi veri</strong>, o almeno derivati da casi veri con i nomi cambiati. La sporcizia dei dati reali &mdash; abbreviazioni, campi vuoti, testo incollato male &mdash; &egrave; met&agrave; della difficolt&agrave;.</li>
        </ul>
        <p>Tieni questo elenco: nel capstone diventer&agrave; la sezione di valutazione del tuo progetto.</p>`}
  ]
});

/* ---------- 4. Context engineering ---------- */
MODULES.push({
  id:'m4', n:'04', title:'Context engineering', min:55,
  blocks:[
    {t:'p',html:`<p><strong>Context engineering</strong> &egrave; la disciplina che decide <em>quali informazioni entrano nella finestra di contesto, in quale momento, in quale forma e con quale priorit&agrave;</em>. Il prompt engineering ne &egrave; un sottoinsieme: si occupa di come formulare le istruzioni: il context engineering si occupa di <strong>tutto il resto che accompagna quelle istruzioni</strong> &mdash; e nei sistemi agentici &egrave; l&igrave; che si vince o si perde.</p>
      <p>Il cambio di prospettiva &egrave; questo: quando passi da una singola risposta a un sistema che gira in loop, chiama strumenti, accumula risultati e prosegue per decine di turni, il prompt non &egrave; pi&ugrave; una cosa che <em>scrivi</em>. &Egrave; una cosa che il tuo sistema <strong>assembla dinamicamente a ogni turno</strong>. Progettare quell’assemblaggio &egrave; il lavoro.</p>`},
    {t:'callout',kind:'',title:'La definizione da tenere a mente',html:`Il contesto &egrave; un <strong>budget</strong>, non un magazzino. L’obiettivo non &egrave; mettere dentro tutto il possibile: &egrave; trovare <em>il pi&ugrave; piccolo insieme di token ad alto segnale</em> che massimizza la probabilit&agrave; del comportamento desiderato.`},

    {t:'p',html:`<h3>Perché &laquo;metti tutto dentro&raquo; non funziona</h3>
      <p>Con finestre da centinaia di migliaia di token la tentazione &egrave; ovvia: carichiamo tutto e non pensiamoci pi&ugrave;. Non funziona, per quattro ragioni distinte che vale la pena separare.</p>
      <ul>
        <li><strong>Degrado con la lunghezza.</strong> L’accuratezza non &egrave; costante lungo la finestra: le informazioni al centro di contesti molto lunghi vengono recuperate peggio di quelle in testa e in coda. Il fenomeno &egrave; noto come <em>lost in the middle</em>, e la sua versione agentica come <em>context rot</em>: pi&ugrave; il contesto cresce, pi&ugrave; il comportamento si sfilaccia.</li>
        <li><strong>Distrazione.</strong> Materiale irrilevante ma superficialmente simile a quello utile &egrave; peggio dell’assenza di materiale: sposta l’attenzione su fatti sbagliati e produce risposte confidenti e false.</li>
        <li><strong>Conflitto.</strong> Pi&ugrave; documenti carichi, pi&ugrave; alta la probabilit&agrave; che due si contraddicano (una policy vecchia e una nuova). Senza una gerarchia dichiarata, il modello sceglie arbitrariamente.</li>
        <li><strong>Costo e latenza.</strong> Il contesto si paga a ogni turno. In un agente che fa 40 passi, 30k token di zavorra iniziale sono 1,2 milioni di token di zavorra totale.</li>
      </ul>`},

    {t:'p',html:`<h3>Le due famiglie: risorse statiche e contesto dinamico</h3>
      <p>La distinzione pi&ugrave; utile in pratica &egrave; per <strong>ciclo di vita</strong>: quello che &egrave; identico a ogni chiamata, e quello che dipende dal turno.</p>`},
    {t:'split2',
      a:{h:'Risorse statiche',items:[
        ['System prompt','Ruolo, dominio, regole non negoziabili, tono, formato di default. Il documento costituzionale dell’agente.'],
        ['File di istruzioni di progetto','AGENTS.md, CLAUDE.md, README interni: convenzioni, comandi, architettura, cosa non toccare. Caricati a ogni sessione.'],
        ['Definizioni degli strumenti','Nome, descrizione, schema di input di ogni tool. Sono prompt a tutti gli effetti e occupano contesto sempre, anche quando non vengono usati.'],
        ['Esempi few-shot canonici','Il repertorio di riferimento del comportamento corretto.'],
        ['Policy, glossari, schemi','Regole aziendali, definizioni di dominio, schema del database, style guide.']
      ]},
      b:{h:'Contesto dinamico',items:[
        ['Messaggio dell’utente','Il compito del turno e i suoi allegati.'],
        ['Risultati di retrieval (RAG)','Frammenti recuperati da una base documentale in funzione della domanda.'],
        ['Output degli strumenti','Righe di database, risposte di API, risultati di ricerca, output di codice eseguito. Il canale della freschezza.'],
        ['Skill caricate su richiesta','Procedure e istruzioni specialistiche il cui corpo entra in contesto solo quando serve.'],
        ['Memoria persistente','Note, decisioni, preferenze salvate su file e rilette selettivamente.'],
        ['Storico e sue compattazioni','I turni precedenti, progressivamente riassunti quando la finestra si riempie.'],
        ['Output di sub-agenti','Il risultato condensato di un’indagine svolta in un contesto separato.']
      ]}},
    {t:'callout',kind:'warn',title:'Le tool definition sono il costo nascosto',html:`Trenta strumenti con descrizioni generose sono facilmente 15&ndash;20k token <em>in ogni singola chiamata</em>, pi&ugrave; una scelta pi&ugrave; difficile per il modello: strumenti dai perimetri sovrapposti producono selezioni sbagliate. Regola pratica: <strong>pochi strumenti, ben separati, con descrizioni che dicono anche quando NON usarli</strong>. Se due tool possono essere confusi da un neoassunto, saranno confusi dal modello.`},

    {t:'p',html:`<h3>Contesto dinamico 1 &middot; RAG (retrieval-augmented generation)</h3>
      <p>Idea: invece di mettere l’intera base documentale nel prompt, la indicizzi; a ogni domanda recuperi i pochi frammenti pertinenti e <em>quelli</em> entrano in contesto. Serve quando il corpus &egrave; troppo grande per la finestra, cambia spesso, o richiede citazioni verificabili.</p>
      <p>Nella pratica il retrieval fallisce quasi sempre per ragioni che non riguardano il modello:</p>
      <ul>
        <li><strong>Chunking sbagliato.</strong> Frammenti troppo piccoli perdono il contesto necessario a capirli; troppo grandi diluiscono il segnale. Spezzare a met&agrave; di una tabella o di una clausola produce frammenti letteralmente non interpretabili.</li>
        <li><strong>Metadati assenti.</strong> Un frammento senza titolo del documento, data e versione &egrave; inutilizzabile per decidere se &egrave; ancora valido: il modello non pu&ograve; sapere che sta citando la policy del 2019.</li>
        <li><strong>top_k troppo alto.</strong> Recuperare 40 frammenti &laquo;per sicurezza&raquo; riempie il contesto di rumore. Meglio 5 buoni: se il primo non &egrave; pertinente, il problema &egrave; l’indice, non la quantit&agrave;.</li>
        <li><strong>Assenza di istruzione di ancoraggio.</strong> Senza un vincolo esplicito &mdash; <em>&laquo;rispondi solo con i fatti presenti in <code>&lt;fonti&gt;</code>, cita l’identificativo, se non c’&egrave; scrivi NON_TROVATO&raquo;</em> &mdash; il modello integra allegramente con la sua conoscenza pregressa, e tu non riesci pi&ugrave; a distinguere le due cose.</li>
      </ul>`},
    {t:'callout',kind:'ok',title:'Retrieval just-in-time',html:`Nei sistemi agentici l’alternativa al pre-caricamento &egrave; dare al modello <strong>gli strumenti per cercare da s&eacute;</strong> (grep, query, lettura file) e lasciarlo recuperare progressivamente ci&ograve; che gli serve, mantenendo in contesto solo identificativi e percorsi. &Egrave; come lavora una persona: non memorizza l’archivio, sa dov’&egrave; e ci va quando serve. Costa qualche turno in pi&ugrave;, ma tiene il contesto pulito e sempre aggiornato.`},

    {t:'p',html:`<h3>Contesto dinamico 2 &middot; Skill e progressive disclosure</h3>
      <p>Una <strong>skill</strong> &egrave; una competenza pacchettizzata: una cartella con istruzioni, procedure, esempi ed eventuali script per un compito specifico (&laquo;come si compila il modulo di rendicontazione&raquo;, &laquo;come si scrive un report secondo il nostro standard&raquo;).</p>
      <p>Il meccanismo interessante &egrave; la <strong>progressive disclosure</strong>, ed &egrave; la tecnica di context engineering pi&ugrave; elegante che c’&egrave;: in contesto stanno sempre solo <em>nome e descrizione</em> di ogni skill &mdash; poche decine di token, quanto basta al modello per sapere che quella competenza esiste e quando serve. Il <em>corpo</em> viene caricato solo quando il modello decide di usarla. Cos&igrave; puoi avere cinquanta procedure disponibili pagando in contesto quasi soltanto quella che serve adesso.</p>
      <p>&Egrave; lo stesso principio dietro un buon manuale: l’indice sta sempre in testa, i capitoli si aprono su richiesta. Nota il corollario progettuale: <strong>la descrizione della skill &egrave; il pezzo pi&ugrave; importante</strong>, perch&eacute; &egrave; l’unica cosa su cui il modello decide. Una descrizione vaga rende la skill invisibile.</p>`},

    {t:'p',html:`<h3>Contesto dinamico 3 &middot; Compattazione, memoria, sub-agenti</h3>
      <p>Tre tecniche per lavorare oltre i limiti della finestra:</p>
      <ul>
        <li><strong>Compaction.</strong> Quando la conversazione si avvicina al limite, si riassume lo storico e si riparte da quel riassunto pi&ugrave; gli ultimi turni integrali. La qualit&agrave; dipende interamente da <em>cosa scegli di conservare</em>: decisioni prese, vincoli emersi, stato corrente e passi ancora aperti vanno tenuti; le esplorazioni fallite e gli output di tool gi&agrave; consumati si buttano. Una compattazione fatta male &egrave; il modo pi&ugrave; comune di perdere un agente a met&agrave; lavoro.</li>
        <li><strong>Memoria esterna su file.</strong> L’agente scrive fuori dal contesto ci&ograve; che deve sopravvivere &mdash; note, decisioni, avanzamento &mdash; e rilegge solo la parte pertinente. La finestra torna a essere spazio di lavoro invece che archivio.</li>
        <li><strong>Sub-agenti con contesto isolato.</strong> Un compito esplorativo (&laquo;trova dove &egrave; gestita questa regola nel codice&raquo;) brucia molti token in tentativi. Delegandolo a un contesto separato, nel contesto principale rientra solo la <em>conclusione</em>. &Egrave; parallelismo, ma soprattutto &egrave; contenimento del rumore.</li>
      </ul>`},

    {t:'tablewrap',head:['Decisione','Domanda da porsi','Errore tipico'],rows:[
      ['Statico o dinamico?','Serve <em>a ogni</em> chiamata o solo in alcune?','Mettere nel system prompt procedure usate nel 5% dei casi'],
      ['Pre-caricare o recuperare?','Il corpus sta in finestra? cambia spesso?','Incollare 40 file &laquo;per sicurezza&raquo;'],
      ['Quanti frammenti?','Il primo risultato è pertinente?','Alzare top_k invece di sistemare l’indice'],
      ['Quanti strumenti?','Un neoassunto li distinguerebbe?','Trenta tool con perimetri sovrapposti'],
      ['Cosa conservare compattando?','Ricostruirei il lavoro da questo riassunto?','Riassumere la cronaca invece delle decisioni'],
      ['Delegare a un sub-agente?','L’esplorazione produce molto rumore?','Esplorare tutto nel contesto principale']
    ]},

    {t:'sorter'},
    {t:'budget'},

    {t:'quiz',id:'q4a',q:'Un agente per il supporto ha 40 procedure interne, ognuna 1.500 token. Solo una serve per conversazione, ma non sai quale in anticipo. Progetto migliore?',
      opts:[
        {tx:'Tutte e 40 nel system prompt: così sono sempre disponibili',ok:false,why:'60k token in ogni singola chiamata, di cui il 97% rumore. Paghi costo e latenza a ogni turno e peggiori il segnale: è il caso di scuola del context rot.'},
        {tx:'Nome e descrizione delle 40, corpo caricato su richiesta',ok:true,why:'Esatto: progressive disclosure. L’indice costa ~1–2k token e basta al modello per sapere che la procedura esiste e quando serve; il corpo entra solo quando la scelta è fatta. Il punto critico diventa la qualità delle descrizioni.'},
        {tx:'Chiedere all’utente quale procedura serve e caricare solo quella',ok:false,why:'Sposta il lavoro cognitivo sull’utente, che spesso non conosce le procedure interne. È proprio ciò che dovrebbe fare l’assistente.'},
        {tx:'Un unico documento con tutte e 40 riassunte a un terzo',ok:false,why:'Perdi i dettagli operativi — numeri, soglie, passaggi — che sono esattamente il motivo per cui la procedura esiste. Comprimere non è selezionare.'}
      ]},
    {t:'quiz',id:'q4b',q:'Un sistema RAG restituisce frammenti pertinenti, ma l’assistente talvolta afferma cose non presenti nelle fonti. Prima correzione da provare?',
      opts:[
        {tx:'Alzare top_k da 5 a 30 per dargli più materiale',ok:false,why:'Aumenta il rumore e la probabilità di frammenti contraddittori. Il problema non è la quantità di fonti ma l’assenza di un vincolo su come usarle.'},
        {tx:'Vincolare esplicitamente la risposta alle fonti, con citazione e uscita NON_TROVATO',ok:true,why:'Corretto. Senza istruzione di ancoraggio il modello integra la conoscenza pregressa con le fonti, e l’output diventa indistinguibile: fatti recuperati e fatti ricordati si mescolano. Obbligare la citazione dell’identificativo rende il problema visibile e verificabile; l’uscita esplicita dà un’alternativa legittima all’invenzione.'},
        {tx:'Abbassare la temperature a 0',ok:false,why:'Rende le affermazioni non fondate più stabili, non più corrette.'},
        {tx:'Passare a un modello più grande',ok:false,why:'Può aiutare al margine, ma non risolve un difetto di progetto del contesto — e ti costa di più per sempre.'}
      ]},

    {t:'exercise',id:'ex4',label:'Esercizio 4.3 — Diagnosi di un agente che degrada (7 minuti)',
      prompt:'Un agente che analizza pratiche funziona bene nei primi 5 turni, poi inizia a ripetersi, a ignorare vincoli dichiarati all’inizio e a rileggere documenti già letti. Elenca tre cause probabili legate al contesto e, per ognuna, l’intervento corrispondente.',
      placeholder:'Causa 1: ...\nIntervento: ...\n\nCausa 2: ...\nIntervento: ...\n\nCausa 3: ...\nIntervento: ...',
      solution:`<p>Le cause pi&ugrave; frequenti, in ordine di probabilit&agrave;:</p>
        <ul>
          <li><strong>Il contesto si &egrave; gonfiato di output di tool gi&agrave; consumati.</strong> Venti letture integrali di documenti restano nello storico anche se servivano solo per una riga. I vincoli iniziali finiscono &laquo;in mezzo&raquo; e perdono salienza. &rarr; Compattare gli output dei tool subito dopo l’uso, conservando solo ci&ograve; che &egrave; stato estratto; ripetere i vincoli non negoziabili nel messaggio corrente, non solo nel system prompt.</li>
          <li><strong>Non esiste uno stato esterno.</strong> L’agente non ha modo di sapere che cosa ha gi&agrave; fatto, quindi rilegge e ripete. &rarr; Memoria su file: un elenco di documenti processati e conclusioni raggiunte, riletto a ogni turno. Poche centinaia di token che sostituiscono decine di migliaia di storico.</li>
          <li><strong>La compattazione butta le decisioni e tiene la cronaca.</strong> Un riassunto tipo &laquo;abbiamo discusso vari documenti&raquo; &egrave; inutile: il vincolo emerso al turno 3 &egrave; sparito. &rarr; Compattazione guidata da schema fisso: <em>obiettivo, vincoli attivi, decisioni prese con motivazione, stato, prossimi passi</em>.</li>
          <li><strong>Bonus &mdash; l’esplorazione avviene nel contesto principale.</strong> &rarr; Delegare le ricerche a sub-agenti e reimmettere solo la conclusione.</li>
        </ul>`}
  ]
});

/* ---------- 5. Capstone ---------- */
MODULES.push({
  id:'m5', n:'05', title:'Capstone — progetta il contesto di un agente', min:30,
  blocks:[
    {t:'p',html:`<p>Ultimo esercizio, il pi&ugrave; importante: applica tutto al caso d’uso che hai scritto nel warm-up. Lavora da solo o in coppia. Alla fine avrai una scheda di progetto esportabile &mdash; il documento da cui parte l’implementazione vera.</p>
      <p><strong>Ordine consigliato:</strong> compila prima la sezione 6 (valutazione). Sembra controintuitivo, ma definire come misurerai il successo <em>prima</em> di progettare la soluzione &egrave; ci&ograve; che impedisce di costruire qualcosa di elegante e inutile. Se non riesci a scrivere i criteri, il compito non &egrave; ancora abbastanza definito &mdash; e quello &egrave; il vero risultato del capstone.</p>`},
    {t:'capstone'},

const mounts = [];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBlock(b, mid, i){
  const id = mid+'_'+i;
  switch(b.t){
    case 'p': return '<div class="prose">'+b.html+'</div>';
    case 'code': return '<pre><code>'+esc(b.code)+'</code></pre>';
    case 'callout':
      return '<div class="callout '+(b.kind||'')+'"><span class="ct">'+b.title+'</span><div>'+b.html+'</div></div>';
    case 'cards':
      return '<div class="grid c3">'+b.cards.map(c=>
        '<div class="card"><div class="tag">'+c.tag+'</div><h5>'+c.h+'</h5><p>'+c.p+'</p></div>').join('')+'</div>';
    case 'table':
      return '<div class="tablewrap"><table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+
        '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    case 'tablewrap':
      return '<div class="tablewrap"><table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+
        '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    case 'compare':
      return '<h3>'+b.title+'</h3><div class="split">'+
        '<div class="pane bad"><div class="pane-h">'+b.bad.h+'</div><pre><code>'+esc(b.bad.code)+'</code></pre></div>'+
        '<div class="pane ok"><div class="pane-h">'+b.good.h+'</div><pre><code>'+esc(b.good.code)+'</code></pre></div></div>';
    case 'split2':
      return '<div class="split">'+[b.a,b.b].map(col=>
        '<div class="widget" style="margin:0"><div class="widget-t">'+col.h+'</div><div style="margin-top:10px">'+
        col.items.map(it=>'<div style="padding:8px 0;border-top:1px solid var(--line)"><strong style="font-size:13.5px">'+it[0]+
        '</strong><div style="font-size:13px;color:var(--muted)">'+it[1]+'</div></div>').join('')+'</div></div>').join('')+'</div>';
    case 'quiz':
      mounts.push(()=>mountQuiz(id,b)); return '<div id="'+id+'"></div>';
    case 'exercise':
      mounts.push(()=>mountExercise(id,b)); return '<div id="'+id+'"></div>';
    case 'checklist':
      mounts.push(()=>mountChecklist(id,b)); return '<div id="'+id+'"></div>';
    case 'tokenizer':
      mounts.push(()=>mountTokenizer(id)); return '<div id="'+id+'"></div>';
    case 'apisim':
      mounts.push(()=>mountApiSim(id)); return '<div id="'+id+'"></div>';
    case 'promptlab':
      mounts.push(()=>mountPromptLab(id)); return '<div id="'+id+'"></div>';
    case 'metalab':
      mounts.push(()=>mountMetaLab(id)); return '<div id="'+id+'"></div>';
    case 'sorter':
      mounts.push(()=>mountSorter(id)); return '<div id="'+id+'"></div>';
    case 'budget':
      mounts.push(()=>mountBudget(id)); return '<div id="'+id+'"></div>';
    case 'capstone':
      mounts.push(()=>mountCapstone(id)); return '<div id="'+id+'"></div>';
    default: return '';
  }
}

function widgetShell(kind,title,sub,body){
  return '<div class="widget"><div class="widget-h"><span class="widget-k">'+kind+'</span><span class="widget-t">'+title+'</span></div>'+
    (sub?'<div class="widget-s">'+sub+'</div>':'')+body+'</div>';
}

/* ---------- quiz ---------- */
function mountQuiz(id, b){
  const el = document.getElementById(id);
  const marks = ['A','B','C','D','E'];
  const body = '<div id="'+id+'_opts">'+b.opts.map((o,k)=>
    '<button class="opt" data-k="'+k+'"><span class="mk">'+marks[k]+'</span>'+o.tx+
    '<div class="why">'+o.why+'</div></button>').join('')+'</div>'+
    '<div class="hint" id="'+id+'_fb" style="margin-top:8px"></div>';
  el.innerHTML = widgetShell('Quiz', b.q, '', body);
  const opts = el.querySelectorAll('.opt');
  const fb = document.getElementById(id+'_fb');
  function apply(k){
    opts.forEach((btn,j)=>{
      btn.disabled = true; btn.classList.add('shown');
      if(j===k) btn.classList.add(b.opts[j].ok?'sel-ok':'sel-bad');
      else if(b.opts[j].ok) btn.classList.add('reveal-ok');
    });
    fb.textContent = b.opts[k].ok ? '✓ Risposta corretta.' : '✗ Non corretta — la risposta giusta è evidenziata in verde.';
    fb.style.color = b.opts[k].ok ? 'var(--ok)' : 'var(--bad)';
  }
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    const k = +btn.dataset.k; quizState[b.id]=k; saveAll(); apply(k); refreshStats();
  }));
  if(quizState[b.id]!==undefined) apply(quizState[b.id]);
}

/* ---------- exercise ---------- */
function mountExercise(id, b){
  const el = document.getElementById(id);
  const body = '<textarea id="'+id+'_ta" rows="9" placeholder="'+esc(b.placeholder||'')+'"></textarea>'+
    '<div class="btnrow"><span class="saved" id="'+id+'_sv">salvato</span><span class="spacer" style="flex:1"></span>'+
    (b.solution?'<button class="btn" id="'+id+'_sol">Mostra soluzione di riferimento</button>':'')+'</div>'+
    (b.solution?'<div id="'+id+'_solbox" class="callout ok" style="display:none"><span class="ct">Soluzione di riferimento</span><div class="prose" style="font-size:14px">'+b.solution+'</div></div>':'');
  el.innerHTML = widgetShell('Esercizio', b.label, b.prompt, body);
  const ta = document.getElementById(id+'_ta');
  const sv = document.getElementById(id+'_sv');
  ta.value = answers[b.id] || '';
  let t;
  ta.addEventListener('input',()=>{
    answers[b.id]=ta.value; clearTimeout(t);
    t=setTimeout(()=>{ saveAll(); sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'),1200); refreshStats(); },400);
  });
  if(b.solution){
    const btn=document.getElementById(id+'_sol'), box=document.getElementById(id+'_solbox');
    btn.addEventListener('click',()=>{
      const open = box.style.display!=='none';
      box.style.display = open?'none':'block';
      btn.textContent = open?'Mostra soluzione di riferimento':'Nascondi soluzione';
    });
  }
}

/* ---------- checklist ---------- */
function mountChecklist(id, b){
  const el = document.getElementById(id);
  const saved = store.get('ck.'+b.id, []);
  const body = b.items.map((it,k)=>
    '<label class="chk'+(saved[k]?' on':'')+'" data-k="'+k+'"><input type="checkbox" '+(saved[k]?'checked':'')+
    '><span class="lb" style="font-weight:500">'+it+'</span></label>').join('')+
    '<div class="scoreline" style="margin-top:8px"><span id="'+id+'_c"></span><span></span></div>';
  el.innerHTML = widgetShell('Checklist', b.title, 'Le spunte si salvano nel browser e finiscono nell’export.', body);
  const rows = el.querySelectorAll('.chk');
  const cnt = document.getElementById(id+'_c');
  function upd(){
    let n=0; rows.forEach((r,k)=>{ const c=r.querySelector('input').checked; saved[k]=c; if(c)n++; r.classList.toggle('on',c); });
    cnt.textContent = n+'/'+b.items.length+' completati';
    store.set('ck.'+b.id, saved); refreshStats();
  }
  rows.forEach(r=>r.querySelector('input').addEventListener('change',upd));
  upd();
}

/* ---------- simulatore di chiamata API ---------- */
const AS_TOOL = {
  name:'cerca_contratto',
  description:'Cerca un contratto per numero e restituisce stato, data di fine e referente.',
  schema:{type:'object',properties:{id:{type:'integer',description:'Numero del contratto'}},required:['id']}
};
const AS_DEF_SYS = "Sei l’assistente interno dell’ufficio contratti di ACME.\nRispondi solo con dati verificati dai tool: se un dato non risulta, dillo.\nFormato: massimo 3 righe, nessun preambolo.";
const AS_STUB = [
  '[risposta del modello — qui finirebbe il testo generato]',
  '[risposta del modello — nota: questo turno è ora storico, e ripartirà con la prossima chiamata]',
  '[risposta del modello — lo storico cresce, e con lui il costo di ogni turno]'
];
const AS_DIFFS = [
  ['Il <code>system</code>',
   'campo di primo livello, fuori da <code>messages</code>',
   'primo messaggio dell’array, con <code>role: "system"</code> (o <code>"developer"</code>)'],
  ['Lo schema dei tool',
   '<code>{ name, description, input_schema }</code>',
   '<code>{ type:"function", function:{ name, description, parameters } }</code>'],
  ['La chiamata al tool',
   'blocco <code>tool_use</code> dentro il <code>content</code> dell’assistente',
   'array <code>tool_calls</code> accanto al <code>content</code>, con <code>arguments</code> come <em>stringa</em> JSON'],
  ['Il risultato del tool',
   'blocco <code>tool_result</code> dentro un messaggio <code>role: "user"</code>',
   'messaggio dedicato <code>role: "tool"</code> con <code>tool_call_id</code>'],
  ['Il tetto di output',
   '<code>max_tokens</code> obbligatorio',
   '<code>max_completion_tokens</code> facoltativo']
];

function mountApiSim(id){
  const el = document.getElementById(id);
  const st = store.get('apisim', null) || {sys:AS_DEF_SYS, tools:true, fmt:'anthropic', ev:[]};
  if(!Array.isArray(st.ev)) st.ev = [];
  if(st.fmt!=='openai') st.fmt='anthropic';

  const body =
    '<div class="split"><div>'+
      '<label class="fl">Campo <code>system</code> — le regole stabili</label>'+
      '<textarea id="'+id+'_sys" rows="4"></textarea>'+
      '<label class="chk" style="margin-top:8px"><input type="checkbox" id="'+id+'_tl"><span>'+
        '<span class="lb">Includi la definizione dei tool</span>'+
        '<span class="ds">Un solo tool, cerca_contratto. Guarda quanti token costa — e che li paghi a ogni turno.</span></span></label>'+
      '<div class="chatlog" id="'+id+'_log"></div>'+
      '<input type="text" id="'+id+'_in" placeholder="Scrivi il messaggio dell’utente…">'+
      '<div class="btnrow">'+
        '<button class="btn primary" id="'+id+'_send">Invia turno</button>'+
        '<button class="btn" id="'+id+'_tool">Turno con chiamata a tool</button>'+
        '<button class="btn" id="'+id+'_undo">Annulla ultimo</button>'+
        '<button class="btn" id="'+id+'_rs">Azzera</button>'+
      '</div>'+
      '<div class="hint" style="margin-top:8px">Le risposte dell’assistente sono segnaposto: qui non gira nessun modello. Quello che conta è il pacchetto che parte.</div>'+
    '</div><div>'+
      '<div class="tabs">'+
        '<button class="tab" data-f="anthropic">Anthropic · POST /v1/messages</button>'+
        '<button class="tab" data-f="openai">OpenAI · POST /v1/chat/completions</button>'+
      '</div>'+
      '<div class="preview" id="'+id+'_pv"></div>'+
      '<div class="scoreline" style="margin-top:8px"><span id="'+id+'_ms"></span><span id="'+id+'_tk"></span></div>'+
      '<div class="btnrow"><button class="btn" id="'+id+'_cp">Copia JSON</button>'+
        '<span class="saved" id="'+id+'_sv">copiato</span></div>'+
      '<div class="diag" id="'+id+'_dg"></div>'+
    '</div></div>';

  el.innerHTML = widgetShell('Lab 1.1','Simulatore di chiamata API',
    'Costruisci una conversazione a sinistra e guarda a destra il JSON che partirebbe davvero verso il provider, nei due dialetti più diffusi. È la stessa conversazione: cambia solo dove finiscono system, tool e risultati.', body);

  const sys = document.getElementById(id+'_sys'), tl = document.getElementById(id+'_tl'),
        log = document.getElementById(id+'_log'), inp = document.getElementById(id+'_in'),
        pv  = document.getElementById(id+'_pv'),  dg = document.getElementById(id+'_dg'),
        sv  = document.getElementById(id+'_sv');
  sys.value = st.sys; tl.checked = !!st.tools;

  function uid(pfx){ return pfx+Math.random().toString(36).slice(2,10); }

  function addTurn(withTool){
    const t = inp.value.trim() || 'Il contratto 4471 è ancora attivo?';
    inp.value = '';
    st.ev.push({k:'user', t:t});
    if(withTool){
      const n = (t.match(/\d{3,6}/)||['4471'])[0];
      st.ev.push({k:'tool', aid:uid('toolu_'), oid:uid('call_'), name:AS_TOOL.name,
                  input:{id:parseInt(n,10)},
                  result:'{"id": '+n+', "stato": "scaduto", "fine": "2025-03-31", "referente": "M. Rossi"}'});
      st.ev.push({k:'assistant', t:'[risposta del modello, ora informata dal tool_result]'});
      if(!st.tools){ st.tools = true; tl.checked = true; }
    } else {
      st.ev.push({k:'assistant', t:AS_STUB[st.ev.filter(e=>e.k==='assistant').length % AS_STUB.length]});
    }
    upd();
  }

  function renderLog(){
    if(!st.ev.length){
      log.innerHTML = '<div class="bub empty">Nessun turno. La chiamata conterrebbe solo <code>system</code> e <code>tools</code>: è già un prompt completo.</div>';
      return;
    }
    log.innerHTML = st.ev.map(e=>{
      if(e.k==='user')      return '<div class="bub u"><span class="who">user</span>'+esc(e.t)+'</div>';
      if(e.k==='assistant') return '<div class="bub a"><span class="who">assistant · segnaposto</span>'+esc(e.t)+'</div>';
      return '<div class="bub t"><span class="who">tool_use → tool_result</span>'+
             esc(e.name+'('+JSON.stringify(e.input)+')\n→ '+e.result)+'</div>';
    }).join('');
    log.scrollTop = log.scrollHeight;
  }

  function buildAnthropic(){
    const o = {model:'claude-opus-5', max_tokens:1024, temperature:0.2, system:st.sys};
    if(st.tools) o.tools = [{name:AS_TOOL.name, description:AS_TOOL.description, input_schema:AS_TOOL.schema}];
    o.messages = [];
    st.ev.forEach(e=>{
      if(e.k==='user')      o.messages.push({role:'user', content:e.t});
      else if(e.k==='assistant') o.messages.push({role:'assistant', content:e.t});
      else {
        o.messages.push({role:'assistant', content:[{type:'tool_use', id:e.aid, name:e.name, input:e.input}]});
        o.messages.push({role:'user',      content:[{type:'tool_result', tool_use_id:e.aid, content:e.result}]});
      }
    });
    return o;
  }

  function buildOpenAI(){
    const msgs = [{role:'system', content:st.sys}];
    st.ev.forEach(e=>{
      if(e.k==='user')      msgs.push({role:'user', content:e.t});
      else if(e.k==='assistant') msgs.push({role:'assistant', content:e.t});
      else {
        msgs.push({role:'assistant', content:null, tool_calls:[
          {id:e.oid, type:'function', function:{name:e.name, arguments:JSON.stringify(e.input)}}]});
        msgs.push({role:'tool', tool_call_id:e.oid, content:e.result});
      }
    });
    const o = {model:'gpt-4.1', messages:msgs, temperature:0.2, max_completion_tokens:1024};
    if(st.tools) o.tools = [{type:'function', function:{name:AS_TOOL.name, description:AS_TOOL.description, parameters:AS_TOOL.schema}}];
    return o;
  }

  function renderDiffs(){
    const isA = st.fmt==='anthropic';
    dg.innerHTML = AS_DIFFS.map(d=>{
      const a = '<span style="'+(isA?'':'opacity:.45')+'"><strong style="font-family:var(--mono);font-size:11.5px">ANTHROPIC</strong> '+d[1]+'</span>';
      const b = '<span style="'+(isA?'opacity:.45':'')+'"><strong style="font-family:var(--mono);font-size:11.5px">OPENAI</strong> '+d[2]+'</span>';
      return '<div><strong>'+d[0]+'</strong><div style="color:var(--muted);font-size:13px;margin-top:3px">'+a+'<br>'+b+'</div></div>';
    }).join('');
  }

  let last = '';
  function upd(){
    st.sys = sys.value; st.tools = tl.checked; store.set('apisim', st);
    renderLog();
    const o = st.fmt==='anthropic' ? buildAnthropic() : buildOpenAI();
    last = JSON.stringify(o, null, 2);
    pv.textContent = last;
    const nMsg = o.messages.length;
    const nCall = st.ev.filter(e=>e.k==='user').length + 1;
    document.getElementById(id+'_ms').textContent = 'chiamata n. '+nCall+' · '+nMsg+' messaggi';
    document.getElementById(id+'_tk').textContent = '≈ '+Math.round(last.length/3.4).toLocaleString('it-IT')+' token di input';
    el.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.f===st.fmt));
    renderDiffs();
  }

  el.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ st.fmt = t.dataset.f; upd(); }));
  sys.addEventListener('input', upd);
  tl.addEventListener('change', upd);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTurn(false); } });
  document.getElementById(id+'_send').addEventListener('click', ()=>addTurn(false));
  document.getElementById(id+'_tool').addEventListener('click', ()=>addTurn(true));
  document.getElementById(id+'_undo').addEventListener('click', ()=>{
    while(st.ev.length){ const e = st.ev.pop(); if(e.k==='user') break; }
    upd();
  });
  document.getElementById(id+'_rs').addEventListener('click', ()=>{ st.ev = []; upd(); });
  document.getElementById(id+'_cp').addEventListener('click', ()=>{
    navigator.clipboard && navigator.clipboard.writeText(last);
    sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'), 1400);
  });
  upd();
}

/* ---------- tokenizer stimatore ---------- */
function mountTokenizer(id){
  const el = document.getElementById(id);
  const body = '<textarea id="'+id+'_ta" rows="4" placeholder="Incolla qui un testo per stimare i token…"></textarea>'+
    '<div class="grid c3" style="margin-top:12px">'+
    ['ch','wd','tk','ctx'].map(k=>'<div class="card"><div class="tag" id="'+id+'_'+k+'l"></div><h5 id="'+id+'_'+k+'" style="font-family:var(--mono);font-size:19px">0</h5></div>').join('')+
    '</div><div class="hint" id="'+id+'_h" style="margin-top:8px"></div>';
  el.innerHTML = widgetShell('Lab 1.2','Stimatore di token','Stima approssimata (~3 caratteri per token in italiano). Serve a farsi l’occhio sugli ordini di grandezza, non a contare con precisione.',body);
  const ta=document.getElementById(id+'_ta');
  const lbl={ch:'Caratteri',wd:'Parole',tk:'Token stimati',ctx:'% di 200k'};
  Object.keys(lbl).forEach(k=>document.getElementById(id+'_'+k+'l').textContent=lbl[k]);
  function upd(){
    const s=ta.value, ch=s.length, wd=s.trim()?s.trim().split(/\s+/).length:0;
    const tk=Math.round(ch/3.1);
    document.getElementById(id+'_ch').textContent=ch.toLocaleString('it-IT');
    document.getElementById(id+'_wd').textContent=wd.toLocaleString('it-IT');
    document.getElementById(id+'_tk').textContent=tk.toLocaleString('it-IT');
    document.getElementById(id+'_ctx').textContent=(tk/200000*100).toFixed(2)+'%';
    const h=document.getElementById(id+'_h');
    if(!ch) h.textContent='Prova con il tuo system prompt attuale, o con un documento che carichi di solito.';
    else if(tk<300) h.textContent='Ordine di grandezza: un prompt breve. In un agente da 40 turni, ripetuto, resta trascurabile.';
    else if(tk<3000) h.textContent='Ordine di grandezza: un system prompt ricco o un documento breve. Sostenibile come risorsa statica.';
    else if(tk<20000) h.textContent='Ordine di grandezza: attenzione. Se questo materiale è statico, lo paghi a ogni turno: chiediti quale parte serve davvero sempre.';
    else h.textContent='Ordine di grandezza: da non pre-caricare. Questo è materiale da indicizzare e recuperare su richiesta, non da tenere in contesto.';
  }
  ta.addEventListener('input',upd); upd();
}

  const el=document.getElementById(id);

    '<div class="split"><div>'+
    PL_COMPONENTS.map(c=>'<label class="chk'+(saved[c.k]?' on':'')+'" data-k="'+c.k+'"><input type="checkbox" '+(saved[c.k]?'checked':'')+
      '><span><span class="lb">'+c.lb+'</span><span class="ds">'+c.ds+'</span></span></label>').join('')+
    '<div class="btnrow"><button class="btn" id="'+id+'_all">Seleziona tutto</button><button class="btn" id="'+id+'_none">Azzera</button>'+
    '<button class="btn" id="'+id+'_copy">Copia prompt</button></div>'+
    '</div><div><div class="preview" id="'+id+'_pv"></div>'+
    '<div class="meter"><i id="'+id+'_bar"></i></div><div class="scoreline"><span id="'+id+'_sc"></span><span id="'+id+'_tk"></span></div>'+
    '<div class="diag" id="'+id+'_dg"></div></div></div>';
  el.innerHTML = widgetShell('Lab 2.1','Costruttore di prompt',
    'Attiva i componenti e osserva il prompt assemblarsi a destra. Il punteggio pesa i componenti per impatto reale sul comportamento del modello: i più pesanti sono le definizioni operative e i casi limite, non il ruolo.',body);
  const boxes=el.querySelectorAll('.chk');
  function upd(){
    let score=0; const parts=[];
    PL_COMPONENTS.forEach(c=>{
      const on=el.querySelector('.chk[data-k="'+c.k+'"] input').checked;
      saved[c.k]=on; el.querySelector('.chk[data-k="'+c.k+'"]').classList.toggle('on',on);
      if(on){ score+=c.w; parts.push(c.txt); }
      else parts.push('<span class="ghosted">[ '+c.lb+' — mancante ]</span>');
    });
    store.set('pl',saved);
    const pv=document.getElementById(id+'_pv');
    pv.innerHTML = parts.map(p=>p.indexOf('<span class="ghosted">')===0?p:esc(p)).join('\n\n');
    const tk=Math.round(parts.filter((p,i)=>saved[PL_COMPONENTS[i].k]).join('\n\n').length/3.1);
    document.getElementById(id+'_bar').style.width=score+'%';
    document.getElementById(id+'_sc').textContent='Robustezza '+score+'/100';
    document.getElementById(id+'_tk').textContent='~'+tk+' token';
    const miss=PL_COMPONENTS.filter(c=>!saved[c.k]);
    const dg=document.getElementById(id+'_dg');
    let msg='';
    if(!saved.defs) msg+='<div><strong>Manca il più importante.</strong> Senza definizioni operative, «urgente» significa quello che il modello immagina: la classificazione sarà plausibile e non allineata al tuo processo.</div>';
    if(!saved.edge) msg+='<div><strong>Nessuna uscita per l’incertezza.</strong> Il modello è addestrato a essere utile: se non gli dai un modo legittimo di dire «non lo so», riempirà il vuoto.</div>';
    if(!saved.fmt) msg+='<div><strong>Formato non mostrato.</strong> Descriverlo non basta: se l’output va a un programma, servirà parsing difensivo su un formato che cambia.</div>';
    if(saved.fmt&&saved.few&&!saved.cot) msg+='<div><strong>Nota.</strong> Hai formato ed esempi ma nessuno spazio di ragionamento: bene per compiti facili, rischioso per classificazioni sfumate.</div>';
    if(!miss.length) msg='<div><strong>Prompt completo.</strong> Ora la domanda non è più «cosa aggiungo» ma «cosa posso togliere senza perdere qualità»: misuralo su un test set e prova a comprimerlo.</div>';
    dg.innerHTML=msg;
  }
  boxes.forEach(b=>b.querySelector('input').addEventListener('change',upd));
  document.getElementById(id+'_all').addEventListener('click',()=>{boxes.forEach(b=>b.querySelector('input').checked=true);upd();});
  document.getElementById(id+'_none').addEventListener('click',()=>{boxes.forEach(b=>b.querySelector('input').checked=false);upd();});
  document.getElementById(id+'_copy').addEventListener('click',(e)=>{
    const txt=PL_COMPONENTS.filter(c=>saved[c.k]).map(c=>c.txt).join('\n\n');
    navigator.clipboard&&navigator.clipboard.writeText(txt);
    e.target.textContent='Copiato ✓'; setTimeout(()=>e.target.textContent='Copia prompt',1400);
  });
  upd();
}

        '<diagnosi>I 3 difetti piu\' costosi, in ordine di impatto.</diagnosi>\n'+
        '<riscrittura>Il prompt corretto, non piu\' lungo dell\'originale +20%.\nModifica solo cio\' che i difetti richiedono.</riscrittura>\n'+
        '<diff>Cosa hai cambiato e perche\'.</diff>\n\n'+

        '   fuorviante | formato non vincolato | caso limite non previsto |\n'+
        '   compito oltre la portata di un singolo prompt.\n'+

        'Se la causa e\' che il prompt fa troppe cose, proponi la scomposizione\nin piu\' chiamate invece di un prompt piu\' lungo.\n\n'+
        'Vincolo di output finale: '+out;
    } else {
      s='Genera un set di test per valutare prompt che svolgono questo compito:\n"'+task+'".\nL\'output e\' letto da: '+aud+'. Vincoli: '+out+'.\n\n'+
        'Produci 18 casi in tabella con colonne:\n'+

        '- Non generare due casi che testano la stessa cosa.';
    }
    document.getElementById(id+'_pv').textContent=s;
    return s;
  }
  document.getElementById(id+'_gen').addEventListener('click',build);

  });
  if(saved.task) build();
}

function mountSorter(id){
  const el=document.getElementById(id);
  const saved=store.get('sorter',{});
  const B=[['s','Statico'],['d','Dinamico'],['x','Fuori dal contesto']];
  const body='<div id="'+id+'_rows">'+SORT_ITEMS.map((it,k)=>
    '<div class="sorter-row" data-k="'+k+'"><div class="it">'+it.tx+'</div><div class="bs">'+
    B.map(b=>'<button class="bbtn'+(saved[k]===b[0]?' on':'')+'" data-b="'+b[0]+'">'+b[1]+'</button>').join('')+
    '</div><div class="fb">'+it.why+'</div></div>').join('')+'</div>'+
    '<div class="btnrow"><button class="btn primary" id="'+id+'_ck">Verifica</button><button class="btn" id="'+id+'_rs">Ricomincia</button>'+
    '<span class="hint" id="'+id+'_sc"></span></div>';
  el.innerHTML=widgetShell('Lab 4.1','Statico, dinamico o fuori?',
    'Per ogni elemento scegli dove va nel contesto di un agente di supporto clienti. «Fuori dal contesto» non significa inutile: significa che non deve stare nella finestra in quella forma.',body);
  const rows=el.querySelectorAll('.sorter-row');
  rows.forEach(r=>{
    const k=+r.dataset.k;
    r.querySelectorAll('.bbtn').forEach(b=>b.addEventListener('click',()=>{
      saved[k]=b.dataset.b; store.set('sorter',saved);
      r.querySelectorAll('.bbtn').forEach(x=>x.classList.toggle('on',x.dataset.b===saved[k]));
      r.classList.remove('done','ok','bad');
    }));
  });
  function check(){
    let n=0,tot=0;
    rows.forEach(r=>{
      const k=+r.dataset.k; if(saved[k]===undefined) return;
      tot++; const ok=saved[k]===SORT_ITEMS[k].a; if(ok)n++;
      r.classList.add('done'); r.classList.toggle('ok',ok); r.classList.toggle('bad',!ok);
    });
    document.getElementById(id+'_sc').textContent = tot? n+' su '+tot+' corretti'+(tot<SORT_ITEMS.length?' ('+(SORT_ITEMS.length-tot)+' senza risposta)':'') : 'Assegna almeno un elemento.';
    refreshStats();
  }
  document.getElementById(id+'_ck').addEventListener('click',check);
  document.getElementById(id+'_rs').addEventListener('click',()=>{
    Object.keys(saved).forEach(k=>delete saved[k]); store.set('sorter',{});
    rows.forEach(r=>{r.classList.remove('done','ok','bad'); r.querySelectorAll('.bbtn').forEach(x=>x.classList.remove('on'));});
    document.getElementById(id+'_sc').textContent='';
  });
  if(Object.keys(saved).length) check();
}

    let tot=0;
    BUD.forEach(b=>{
      const s=el.querySelector('input[data-k="'+b.k+'"]'); const v=+s.value; saved[b.k]=v; tot+=v;
      document.getElementById(id+'_v_'+b.k).textContent=v+'k';
    });
    store.set('budget',saved);
    const stack=document.getElementById(id+'_stack');
    stack.innerHTML=BUD.map(b=>'<i style="width:'+(saved[b.k]/200*100)+'%;background:'+b.col+'" title="'+b.lb+'"></i>').join('')+
      (tot<200?'<i style="flex:1"></i>':'');
    document.getElementById(id+'_tot').textContent='Totale '+tot+'k / 200k';
    const pct=Math.round(tot/200*100);
    const pe=document.getElementById(id+'_pct'); pe.textContent=pct+'% della finestra';
    pe.style.color = tot>200?'var(--bad)': tot>140?'var(--warn)':'var(--muted)';
    const d=[];
    if(tot>200) d.push(['bad','Sfori la finestra: la chiamata verrà rifiutata o troncata in modo imprevedibile. Il troncamento colpisce di solito ciò che ti serve di più.']);
    else if(tot>140) d.push(['warn','Oltre il 70% della finestra. Su conversazioni lunghe qui compare il context rot: vincoli iniziali ignorati, ripetizioni, incoerenze. Se è il tuo punto di partenza, non hai margine per crescere.']);
    if(saved.out<8) d.push(['bad','Riserva di output insufficiente ('+saved.out+'k). L’input mangia lo spazio della risposta e le generazioni lunghe si troncano a metà.']);
    if(saved.tools>15) d.push(['warn','Definizioni degli strumenti a '+saved.tools+'k: probabilmente troppi tool o descrizioni troppo verbose. È un costo fisso a ogni turno e rende la selezione più difficile. Riduci il numero e separa meglio i perimetri.']);
    if(saved.rag>50) d.push(['warn','RAG a '+saved.rag+'k: stai recuperando troppo. Se il primo frammento non è pertinente, il problema è l’indice, non la quantità. Abbassa top_k e migliora chunking e metadati.']);
    if(saved.docs>15) d.push(['warn','File di progetto a '+saved.docs+'k su ogni chiamata: verifica quale parte serve davvero sempre. Il resto è materiale da caricare su richiesta.']);
    if(saved.hist>60) d.push(['warn','Storico a '+saved.hist+'k senza compattazione aggressiva: qui si perdono i vincoli dichiarati all’inizio. Serve una compattazione a schema fisso (obiettivo, vincoli, decisioni, stato).']);
    if(saved.sys<1) d.push(['bad','System prompt quasi assente: nessun ruolo, nessuna regola, nessun formato. Tutto il comportamento sarà improvvisato a ogni turno.']);
    if(saved.few===0&&saved.sys<6) d.push(['warn','Né esempi né un system prompt sostanzioso: il formato di output sarà instabile.']);
    if(!d.length) d.push(['ok','Allocazione difendibile: margine di crescita sulla finestra, riserva di output adeguata, nessuna categoria ipertrofica. La domanda successiva è empirica: su conversazioni reali, quale categoria cresce più in fretta?']);
    document.getElementById(id+'_dg').innerHTML=d.map(x=>'<div style="color:'+(x[0]==='bad'?'var(--bad)':x[0]==='warn'?'var(--warn)':'var(--ok)')+'">'+
      (x[0]==='bad'?'✗ ':x[0]==='warn'?'⚠ ':'✓ ')+x[1]+'</div>').join('');
    refreshStats();
  }
  sliders.forEach(s=>s.addEventListener('input',upd));
  document.getElementById(id+'_rs').addEventListener('click',()=>{
    BUD.forEach(b=>{ el.querySelector('input[data-k="'+b.k+'"]').value=b.def; }); upd();
  });
  upd();
}

/* ---------- capstone ---------- */
const CAP = [
  {k:'task', lb:'1 · Il compito, in una frase verificabile', ph:'Es. «Dalla segnalazione grezza produce una scheda di triage con livello, motivazione e dato mancante.» Se contiene una «e», probabilmente sono due compiti.', rows:2},
  {k:'sys', lb:'2 · System prompt (ruolo, criteri operativi, casi limite, formato)', ph:'Scrivilo per intero. Ogni termine valutativo che usi deve avere qui la sua definizione.', rows:9},
  {k:'static', lb:'3 · Risorse statiche — e perché servono a OGNI chiamata', ph:'Es. glossario dei codici pratica (~800 token) — serve sempre perché ogni input li contiene.\nEs. 3 esempi canonici (~600 token) — definiscono il formato.', rows:5},
  {k:'dyn', lb:'4 · Contesto dinamico — cosa entra, quando, come lo recuperi', ph:'Es. anagrafica cliente: query per ID, solo 5 campi.\nEs. procedura pertinente: 40 descrizioni sempre in contesto, corpo su richiesta.\nEs. storico: compattato ogni 15 turni con schema fisso.', rows:5},
  {k:'tools', lb:'5 · Strumenti (max 5) — nome, cosa fa, quando NON usarlo', ph:'cerca_pratica — recupera per ID. NON usare per ricerche testuali libere: usa cerca_testo.', rows:4},
  {k:'eval', lb:'6 · Valutazione — 6 casi di test con criterio verificabile (compila per primo)', ph:'T1 input: ... | criterio: ...\nL1 (dato mancante) input: ... | criterio: risponde NON_DETERMINABILE, non inventa la data', rows:6},
  {k:'fail', lb:'7 · Il fallimento più costoso, e come lo intercetti prima dell’utente', ph:'Es. classificare BASSA una segnalazione critica. Intercettazione: ogni output CRITICA/BASSA su parole-chiave di reparto passa in revisione umana la prima settimana.', rows:3}
];
function mountCapstone(id){
  const el=document.getElementById(id);
  const body=CAP.map(f=>'<label class="fl">'+f.lb+'</label><textarea data-k="'+f.k+'" rows="'+f.rows+'" placeholder="'+esc(f.ph)+'"></textarea>').join('')+
    '<div class="btnrow"><button class="btn primary" id="'+id+'_ex">Esporta scheda di progetto</button><span class="saved" id="'+id+'_sv">salvato</span></div>';
  el.innerHTML=widgetShell('Capstone','Scheda di progetto',
    'Sette sezioni. Compila la 6 per prima: se non riesci a definire i criteri di successo, il compito non è ancora abbastanza definito.',body);
  const sv=document.getElementById(id+'_sv');
  el.querySelectorAll('textarea').forEach(ta=>{
    const k='cap.'+ta.dataset.k;
    ta.value=answers[k]||'';
    let t; ta.addEventListener('input',()=>{ answers[k]=ta.value; clearTimeout(t);
      t=setTimeout(()=>{saveAll(); sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'),1200); refreshStats();},400); });
  });
  document.getElementById(id+'_ex').addEventListener('click',()=>doExport(true));
}

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=MODULES.map((m,i)=>
    '<button class="navitem'+(i===current?' active':'')+'" data-i="'+i+'">'+
    '<span class="idx">'+m.n+'</span><span><span class="nt">'+m.title+'</span><span class="nm">'+m.min+' minuti</span></span>'+
    (done[m.id]?'<span class="tick">●</span>':'')+'</button>').join('');
  nav.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
}

function renderModule(){
  const m=MODULES[current];
  mounts.length=0;
  const main=document.getElementById('main');
  const isBreak = m.id==='brk';
  let html='';
  if(!isBreak){
    html+='<div class="eyebrow">Modulo '+m.n+' · '+m.min+' minuti</div><h1>'+m.title+'</h1>';
    html+='<div class="mod-meta"><span class="badge">'+(current+1)+' di '+MODULES.length+'</span>'+
      '<span class="badge" id="modTimer">⏱ --:--</span>'+
      '<label class="chk" style="margin:0;padding:6px 11px"><input type="checkbox" id="modDone" '+(done[m.id]?'checked':'')+'><span class="lb" style="font-weight:600;font-size:13px">Modulo completato</span></label></div>';
  }
  html+=m.blocks.map((b,i)=>renderBlock(b,m.id,i)).join('');
  html+='<div class="footnav">'+
    (current>0?'<button class="btn" id="prevBtn">← '+MODULES[current-1].title+'</button>':'<span></span>')+
    (current<MODULES.length-1?'<button class="btn primary" id="nextBtn">'+MODULES[current+1].title+' →</button>':'<span></span>')+
    '</div>';
  main.innerHTML=html;
  mounts.forEach(f=>f());
  const pb=document.getElementById('prevBtn'); if(pb) pb.addEventListener('click',()=>go(current-1));
  const nb=document.getElementById('nextBtn'); if(nb) nb.addEventListener('click',()=>go(current+1));
  const md=document.getElementById('modDone');
  if(md) md.addEventListener('change',()=>{ if(md.checked) done[m.id]=true; else delete done[m.id]; saveAll(); renderNav(); refreshStats(); });
  window.scrollTo({top:0,behavior:'instant'});
  updModTimer();
}

function go(i){
  if(i<0||i>=MODULES.length) return;
  current=i; store.set('current',i); renderNav(); renderModule(); refreshStats();
}

/* ============================================================
   TIMER
   ============================================================ */
const TOTAL=4*3600;
let elapsed=store.get('elapsed',0), running=false, tick=null;
let modStart=null;
function fmt(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,'0')+':':'00:')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function paintClock(){
  const c=document.getElementById('clock');
  c.textContent=fmt(elapsed)+' / 4:00:00';
  c.style.color = elapsed>TOTAL?'var(--bad)': elapsed>TOTAL*0.9?'var(--warn)':'';
}
function updModTimer(){
  const e=document.getElementById('modTimer'); if(!e) return;
  const m=MODULES[current];
  const spent = modStart!==null? Math.floor((elapsed-modStart)) : 0;
  e.textContent='⏱ '+Math.floor(spent/60)+' / '+m.min+' min';
  e.style.color = spent/60>m.min?'var(--warn)':'';
}
function toggleTimer(){
  running=!running;
  const b=document.getElementById('timerBtn');
  b.textContent = running?'⏸ Pausa timer':'▶ Avvia timer';
  if(running){ if(modStart===null) modStart=elapsed;
    tick=setInterval(()=>{ elapsed++; store.set('elapsed',elapsed); paintClock(); updModTimer(); },1000); }
  else clearInterval(tick);
}

/* ============================================================
   STATS / EXPORT / TEMA
   ============================================================ */
function refreshStats(){
  const nQ=MODULES.reduce((a,m)=>a+m.blocks.filter(b=>b.t==='quiz').length,0);
  const aQ=Object.keys(quizState).length;
  const okQ=MODULES.flatMap(m=>m.blocks.filter(b=>b.t==='quiz'))
    .filter(b=>quizState[b.id]!==undefined && b.opts[quizState[b.id]].ok).length;
  const exIds=MODULES.flatMap(m=>m.blocks.filter(b=>b.t==='exercise').map(b=>b.id));
  const aE=exIds.filter(k=>(answers[k]||'').trim().length>20).length;
  const capN=CAP.filter(f=>(answers['cap.'+f.k]||'').trim().length>20).length;
  const dM=Object.keys(done).length;
  const nM=MODULES.filter(m=>m.id!=='brk').length;
  document.getElementById('statsBox').innerHTML=
    'Moduli completati <strong>'+dM+'/'+nM+'</strong><br>'+
    'Quiz risposti <strong>'+aQ+'/'+nQ+'</strong>'+(aQ?' · corretti <strong>'+okQ+'</strong>':'')+'<br>'+
    'Esercizi svolti <strong>'+aE+'/'+exIds.length+'</strong><br>'+
    'Capstone <strong>'+capN+'/'+CAP.length+'</strong> sezioni';
  const tot=nM+nQ+exIds.length+CAP.length;
  document.getElementById('pbar').style.width=((dM+aQ+aE+capN)/tot*100)+'%';
}

function doExport(capOnly){
  const L=[];
  const d=new Date();
  const stamp=d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  L.push('# Prompt · Metaprompting · Context Engineering');
  L.push('');
  L.push('Esportato il '+stamp+'  ·  tempo d’aula registrato: '+fmt(elapsed));
  L.push('');
  if(!capOnly){
    L.push('## Risposte agli esercizi');
    MODULES.forEach(m=>{
      const ex=m.blocks.filter(b=>b.t==='exercise');
      ex.forEach(b=>{
        const v=(answers[b.id]||'').trim();
        L.push(''); L.push('### '+m.n+' — '+b.label);
        L.push(''); L.push('> '+b.prompt);
        L.push(''); L.push(v||'_(non compilato)_');
      });
    });
    L.push(''); L.push('## Quiz');
    MODULES.forEach(m=>m.blocks.filter(b=>b.t==='quiz').forEach(b=>{
      const k=quizState[b.id];
      L.push('- **'+b.q+'**');
      L.push('  - Risposta data: '+(k===undefined?'_nessuna_':b.opts[k].tx+(b.opts[k].ok?' ✅':' ❌')));
      if(k!==undefined&&!b.opts[k].ok) L.push('  - Corretta: '+b.opts.find(o=>o.ok).tx);
    }));
    L.push(''); L.push('## Checklist');
    MODULES.forEach(m=>m.blocks.filter(b=>b.t==='checklist').forEach(b=>{
      const s=store.get('ck.'+b.id,[]);
      L.push(''); L.push('### '+b.title);
      b.items.forEach((it,i)=>L.push('- ['+(s[i]?'x':' ')+'] '+it));
    }));
    const bd=store.get('budget',null);
    if(bd){ L.push(''); L.push('## Budget di contesto allocato');
      let t=0; BUD.forEach(b=>{ t+=bd[b.k]||0; L.push('- '+b.lb+': '+(bd[b.k]||0)+'k'); });
      L.push('- **Totale: '+t+'k / 200k**'); }
  }
  L.push(''); L.push('## Scheda di progetto (capstone)');
  CAP.forEach(f=>{ L.push(''); L.push('### '+f.lb); L.push(''); L.push((answers['cap.'+f.k]||'').trim()||'_(non compilato)_'); });
  const ck5=store.get('ck.ck5',[]);
  const m5=MODULES.find(m=>m.id==='m5').blocks.find(b=>b.t==='checklist');
  if(m5){ L.push(''); L.push('### Verifica finale'); m5.items.forEach((it,i)=>L.push('- ['+(ck5[i]?'x':' ')+'] '+it)); }
  const blob=new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(capOnly?'scheda-progetto-agente':'corso-prompt-context-engineering')+'.md';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ============================================================
   BOOT
   ============================================================ */
document.getElementById('timerBtn').addEventListener('click',toggleTimer);
document.getElementById('exportBtn').addEventListener('click',()=>doExport(false));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t); store.set('theme',t);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Azzerare tutte le risposte, le checklist e il timer? L’operazione non è reversibile.')) return;
  store.clearAll(); location.reload();
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});
if(!store.get('theme',null) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');
else document.documentElement.setAttribute('data-theme', store.get('theme','light'));

renderNav(); renderModule(); paintClock(); refreshStats();
</script>
