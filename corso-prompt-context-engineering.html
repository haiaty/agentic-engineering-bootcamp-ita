function mountMetaLab(id){
  const el=document.getElementById(id);
  const saved=store.get('meta',{task:'',aud:'',out:'',hard:'',mode:'gen'});
  const body=
    '<label class="fl">Pattern</label><select id="'+id+'_mode">'+
      '<option value="gen">1 · Generator — crea un prompt da zero</option>'+
      '<option value="crit">2 · Critic — valuta un prompt esistente</option>'+
      '<option value="fail">3 · Failure-driven — correggi partendo dagli errori</option>'+
      '<option value="test">4 · Test-set — genera i casi di prova</option>'+
    '</select>'+
    '<label class="fl">Compito da automatizzare</label><input type="text" id="'+id+'_task" placeholder="Es. classificare le segnalazioni del gestionale per priorità">'+
    '<label class="fl">Chi legge l’output e con che scopo</label><input type="text" id="'+id+'_aud" placeholder="Es. il capoturno, per smistare la coda in 15 minuti">'+
    '<label class="fl">Formato e vincoli richiesti</label><input type="text" id="'+id+'_out" placeholder="Es. una riga per segnalazione: ID | LIVELLO | motivazione max 12 parole">'+
    '<label class="fl">Il caso difficile su cui sbaglia oggi</label><input type="text" id="'+id+'_hard" placeholder="Es. segnalazioni scritte in tono allarmato ma di impatto basso">'+
    '<div class="btnrow"><button class="btn primary" id="'+id+'_gen">Genera meta-prompt</button><button class="btn" id="'+id+'_cp">Copia</button>'+
    '<span class="hint">Incollalo in un assistente e usa l’output come <em>bozza</em>, non come verità.</span></div>'+
    '<div class="preview" id="'+id+'_pv" style="margin-top:12px">Compila i campi e premi «Genera meta-prompt».</div>';
  el.innerHTML=widgetShell('Lab 3.1','Generatore di meta-prompt',
    'Compila i quattro campi: il laboratorio compone il meta-prompt secondo il pattern scelto. Il valore dell’esercizio sta nei campi — se non sai riempirli, il problema non è il prompt.',body);
  const F={mode:'_mode',task:'_task',aud:'_aud',out:'_out',hard:'_hard'};
  Object.keys(F).forEach(k=>{ const e=document.getElementById(id+F[k]); e.value=saved[k]||''; e.addEventListener('input',()=>{saved[k]=e.value;store.set('meta',saved);}); });
  function build(){
    const v=k=>document.getElementById(id+F[k]).value.trim();
    const task=v('task')||'{{DESCRIVI_IL_COMPITO}}', aud=v('aud')||'{{CHI_LEGGE_E_PERCHE}}',
          out=v('out')||'{{FORMATO_E_VINCOLI}}', hard=v('hard')||'{{IL_CASO_DIFFICILE}}', mode=v('mode');
    let s='';
    if(mode==='gen'){
      s='Sei un esperto di prompt engineering. Il tuo output NON e\' la soluzione\ndel compito: e\' IL PROMPT che risolvera\' quel compito.\n\n'+
        '<compito>'+task+'</compito>\n<destinatario_output>'+aud+'</destinatario_output>\n'+
        '<vincoli_output>'+out+'</vincoli_output>\n<caso_difficile>'+hard+'</caso_difficile>\n\n'+
        'Il prompt che produci deve contenere, in questo ordine:\n'+
        '1. Ruolo e conseguenza concreta della decisione.\n'+
        '2. Definizione operativa di OGNI termine valutativo che usi.\n   Nessun "urgente", "rilevante", "conciso" senza criterio misurabile.\n'+
        '3. Sezione dati delimitata con tag e segnaposto {{...}}.\n'+
        '4. Formato di output mostrato con un esempio compilato.\n'+
        '5. Regole per i casi limite: dato mancante, input ambiguo,\n   richiesta fuori perimetro, informazioni contraddittorie.\n'+
        '6. Un vincolo di lunghezza verificabile.\n'+
        '7. Un trattamento esplicito del <caso_difficile>.\n\n'+
        'Dopo il prompt aggiungi:\n<assunzioni>Cosa hai assunto e quale risposta ti servirebbe da me.</assunzioni>\n'+
        '<rischi>I 3 modi piu\' probabili in cui questo prompt fallira\'.</rischi>';
    } else if(mode==='crit'){
      s='Valuta il prompt in <candidato> come un revisore severo.\nContesto: serve a "'+task+'". Lo legge: '+aud+'.\nVincoli attesi: '+out+'.\n\n'+
        'Per ogni criterio assegna 0-2 e CITA il testo che motiva il voto:\n'+
        'C1 compito e destinatario espliciti\nC2 termini valutativi definiti operativamente\n'+
        'C3 formato di output non ambiguo\nC4 casi limite governati\n'+
        'C5 vincoli positivi e verificabili\nC6 nessuna istruzione in conflitto (anche tra istruzioni ed esempi)\n'+
        'C7 densita\': ogni frase serve\n\nPoi:\n'+
        '<diagnosi>I 3 difetti piu\' costosi, in ordine di impatto.</diagnosi>\n'+
        '<riscrittura>Il prompt corretto, non piu\' lungo dell\'originale +20%.\nModifica solo cio\' che i difetti richiedono.</riscrittura>\n'+
        '<diff>Cosa hai cambiato e perche\'.</diff>\n\n'+
        'Verifica in particolare il comportamento su: '+hard+'\n\n<candidato>\n{{INCOLLA_QUI_IL_PROMPT}}\n</candidato>';
    } else if(mode==='fail'){
      s='Questo prompt e\' in uso per "'+task+'" e sbaglia su alcuni casi.\n\n'+
        '<prompt_attuale>\n{{INCOLLA_QUI_IL_PROMPT}}\n</prompt_attuale>\n\n'+
        '<fallimenti>\nCASO 1 — input: '+hard+'\n         output ottenuto: {{COSA_HA_FATTO}}\n         output desiderato: {{COSA_VOLEVO}}\nCASO 2 — ...\n</fallimenti>\n\n'+
        'Procedi in tre passi separati.\n\n'+
        '1. <diagnosi> Per ogni caso, quale carenza specifica del prompt lo spiega?\n'+
        '   Classifica: informazione mancante | istruzione ambigua | esempio\n'+
        '   fuorviante | formato non vincolato | caso limite non previsto |\n'+
        '   compito oltre la portata di un singolo prompt.\n'+
        '2. <pattern> Le diagnosi hanno una causa comune? Quale?\n'+
        '3. <correzione> Modifica minima che risolve la causa comune senza\n   rompere i casi che oggi funzionano. Non riscrivere da zero.\n\n'+
        'Se la causa e\' che il prompt fa troppe cose, proponi la scomposizione\nin piu\' chiamate invece di un prompt piu\' lungo.\n\n'+
        'Vincolo di output finale: '+out;
    } else {
      s='Genera un set di test per valutare prompt che svolgono questo compito:\n"'+task+'".\nL\'output e\' letto da: '+aud+'. Vincoli: '+out+'.\n\n'+
        'Produci 18 casi in tabella con colonne:\n'+
        'ID | input (realistico, con la sporcizia dei dati veri) | output_atteso |\n'+
        'criterio_di_accettazione (verificabile da una persona diversa da me) |\n'+
        'categoria\n\nDistribuzione richiesta:\n'+
        '- 6 casi tipici\n- 4 casi al confine tra due categorie\n'+
        '- 3 casi con informazione mancante (l\'atteso e\' un\'astensione esplicita)\n'+
        '- 3 casi fuori perimetro\n- 2 casi con informazioni contraddittorie\n\n'+
        'Almeno 3 casi devono riguardare: '+hard+'\n\n'+
        'Vincoli:\n- Nessun criterio soggettivo ("buono", "chiaro"): solo verificabili.\n'+
        '- Per i casi di astensione, il criterio deve verificare che il modello\n  NON inventi il dato mancante.\n'+
        '- Non generare due casi che testano la stessa cosa.';
    }
    document.getElementById(id+'_pv').textContent=s;
    return s;
  }
  document.getElementById(id+'_gen').addEventListener('click',build);
  document.getElementById(id+'_cp').addEventListener('click',(e)=>{
    const s=build(); navigator.clipboard&&navigator.clipboard.writeText(s);
    e.target.textContent='Copiato ✓'; setTimeout(()=>e.target.textContent='Copia',1400);
  });
  if(saved.task) build();
}

function mountSorter(id){
  const el=document.getElementById(id);
  const saved=store.get('sorter',{});
  const B=[['s','Statico'],['d','Dinamico'],['x','Fuori dal contesto']];
  const body='<div id="'+id+'_rows">'+SORT_ITEMS.map((it,k)=>
    '<div class="sorter-row" data-k="'+k+'"><div class="it">'+it.tx+'</div><div class="bs">'+
    B.map(b=>'<button class="bbtn'+(saved[k]===b[0]?' on':'')+'" data-b="'+b[0]+'">'+b[1]+'</button>').join('')+
    '</div><div class="fb">'+it.why+'</div></div>').join('')+'</div>'+
    '<div class="btnrow"><button class="btn primary" id="'+id+'_ck">Verifica</button><button class="btn" id="'+id+'_rs">Ricomincia</button>'+
    '<span class="hint" id="'+id+'_sc"></span></div>';
  el.innerHTML=widgetShell('Lab 4.1','Statico, dinamico o fuori?',
    'Per ogni elemento scegli dove va nel contesto di un agente di supporto clienti. «Fuori dal contesto» non significa inutile: significa che non deve stare nella finestra in quella forma.',body);
  const rows=el.querySelectorAll('.sorter-row');
  rows.forEach(r=>{
    const k=+r.dataset.k;
    r.querySelectorAll('.bbtn').forEach(b=>b.addEventListener('click',()=>{
      saved[k]=b.dataset.b; store.set('sorter',saved);
      r.querySelectorAll('.bbtn').forEach(x=>x.classList.toggle('on',x.dataset.b===saved[k]));
      r.classList.remove('done','ok','bad');
    }));
  });
  function check(){
    let n=0,tot=0;
    rows.forEach(r=>{
      const k=+r.dataset.k; if(saved[k]===undefined) return;
      tot++; const ok=saved[k]===SORT_ITEMS[k].a; if(ok)n++;
      r.classList.add('done'); r.classList.toggle('ok',ok); r.classList.toggle('bad',!ok);
    });
    document.getElementById(id+'_sc').textContent = tot? n+' su '+tot+' corretti'+(tot<SORT_ITEMS.length?' ('+(SORT_ITEMS.length-tot)+' senza risposta)':'') : 'Assegna almeno un elemento.';
    refreshStats();
  }
  document.getElementById(id+'_ck').addEventListener('click',check);
  document.getElementById(id+'_rs').addEventListener('click',()=>{
    Object.keys(saved).forEach(k=>delete saved[k]); store.set('sorter',{});
    rows.forEach(r=>{r.classList.remove('done','ok','bad'); r.querySelectorAll('.bbtn').forEach(x=>x.classList.remove('on'));});
    document.getElementById(id+'_sc').textContent='';
  });
  if(Object.keys(saved).length) check();
}

const BUD = [
  {k:'sys', lb:'System prompt e policy', max:20, def:3, col:'#c2451f'},
  {k:'tools', lb:'Definizioni degli strumenti', max:40, def:6, col:'#d98324'},
  {k:'docs', lb:'File di progetto (AGENTS.md, glossari)', max:40, def:5, col:'#c9a227'},
  {k:'few', lb:'Esempi few-shot', max:20, def:2, col:'#5b8c3a'},
  {k:'rag', lb:'Frammenti recuperati (RAG)', max:120, def:12, col:'#2f7d78'},
  {k:'tres', lb:'Output degli strumenti nel turno', max:120, def:15, col:'#3a6ea5'},
  {k:'hist', lb:'Storico della conversazione', max:120, def:20, col:'#6a5acd'},
  {k:'out', lb:'Riserva per l’output', max:40, def:8, col:'#8e5b9f'}
];
function mountBudget(id){
  const el=document.getElementById(id);
  const saved=store.get('budget',null) || BUD.reduce((o,b)=>(o[b.k]=b.def,o),{});
  const body=
    BUD.map(b=>'<div class="slider-row"><div>'+b.lb+'</div>'+
      '<input type="range" min="0" max="'+b.max+'" step="1" data-k="'+b.k+'" value="'+(saved[b.k]||0)+'">'+
      '<div class="val" id="'+id+'_v_'+b.k+'"></div></div>').join('')+
    '<div class="stack" id="'+id+'_stack"></div>'+
    '<div class="legend">'+BUD.map(b=>'<span><b style="background:'+b.col+'"></b>'+b.lb.split(' (')[0]+'</span>').join('')+'</div>'+
    '<div class="scoreline" style="margin-top:12px"><span id="'+id+'_tot"></span><span id="'+id+'_pct"></span></div>'+
    '<div class="diag" id="'+id+'_dg"></div>'+
    '<div class="btnrow"><button class="btn" id="'+id+'_rs">Ripristina valori tipici</button></div>';
  el.innerHTML=widgetShell('Lab 4.2','Budget di contesto',
    'Finestra da 200k token, agente di supporto con conversazioni lunghe. Alloca i token (in migliaia) e leggi la diagnosi. Non esiste una risposta unica: esistono allocazioni difendibili e allocazioni che si romperanno.',body);
  const sliders=el.querySelectorAll('input[type=range]');
  function upd(){
    let tot=0;
    BUD.forEach(b=>{
      const s=el.querySelector('input[data-k="'+b.k+'"]'); const v=+s.value; saved[b.k]=v; tot+=v;
      document.getElementById(id+'_v_'+b.k).textContent=v+'k';
    });
    store.set('budget',saved);
    const stack=document.getElementById(id+'_stack');
    stack.innerHTML=BUD.map(b=>'<i style="width:'+(saved[b.k]/200*100)+'%;background:'+b.col+'" title="'+b.lb+'"></i>').join('')+
      (tot<200?'<i style="flex:1"></i>':'');
    document.getElementById(id+'_tot').textContent='Totale '+tot+'k / 200k';
    const pct=Math.round(tot/200*100);
    const pe=document.getElementById(id+'_pct'); pe.textContent=pct+'% della finestra';
    pe.style.color = tot>200?'var(--bad)': tot>140?'var(--warn)':'var(--muted)';
    const d=[];
    if(tot>200) d.push(['bad','Sfori la finestra: la chiamata verrà rifiutata o troncata in modo imprevedibile. Il troncamento colpisce di solito ciò che ti serve di più.']);
    else if(tot>140) d.push(['warn','Oltre il 70% della finestra. Su conversazioni lunghe qui compare il context rot: vincoli iniziali ignorati, ripetizioni, incoerenze. Se è il tuo punto di partenza, non hai margine per crescere.']);
    if(saved.out<8) d.push(['bad','Riserva di output insufficiente ('+saved.out+'k). L’input mangia lo spazio della risposta e le generazioni lunghe si troncano a metà.']);
    if(saved.tools>15) d.push(['warn','Definizioni degli strumenti a '+saved.tools+'k: probabilmente troppi tool o descrizioni troppo verbose. È un costo fisso a ogni turno e rende la selezione più difficile. Riduci il numero e separa meglio i perimetri.']);
    if(saved.rag>50) d.push(['warn','RAG a '+saved.rag+'k: stai recuperando troppo. Se il primo frammento non è pertinente, il problema è l’indice, non la quantità. Abbassa top_k e migliora chunking e metadati.']);
    if(saved.docs>15) d.push(['warn','File di progetto a '+saved.docs+'k su ogni chiamata: verifica quale parte serve davvero sempre. Il resto è materiale da caricare su richiesta.']);
    if(saved.hist>60) d.push(['warn','Storico a '+saved.hist+'k senza compattazione aggressiva: qui si perdono i vincoli dichiarati all’inizio. Serve una compattazione a schema fisso (obiettivo, vincoli, decisioni, stato).']);
    if(saved.sys<1) d.push(['bad','System prompt quasi assente: nessun ruolo, nessuna regola, nessun formato. Tutto il comportamento sarà improvvisato a ogni turno.']);
    if(saved.few===0&&saved.sys<6) d.push(['warn','Né esempi né un system prompt sostanzioso: il formato di output sarà instabile.']);
    if(!d.length) d.push(['ok','Allocazione difendibile: margine di crescita sulla finestra, riserva di output adeguata, nessuna categoria ipertrofica. La domanda successiva è empirica: su conversazioni reali, quale categoria cresce più in fretta?']);
    document.getElementById(id+'_dg').innerHTML=d.map(x=>'<div style="color:'+(x[0]==='bad'?'var(--bad)':x[0]==='warn'?'var(--warn)':'var(--ok)')+'">'+
      (x[0]==='bad'?'✗ ':x[0]==='warn'?'⚠ ':'✓ ')+x[1]+'</div>').join('');
    refreshStats();
  }
  sliders.forEach(s=>s.addEventListener('input',upd));
  document.getElementById(id+'_rs').addEventListener('click',()=>{
    BUD.forEach(b=>{ el.querySelector('input[data-k="'+b.k+'"]').value=b.def; }); upd();
  });
  upd();
}

      '<label class="chk" style="margin:0;padding:6px 11px"><input type="checkbox" id="modDone" '+(done[m.id]?'checked':'')+'><span class="lb" style="font-weight:600;font-size:13px">Modulo completato</span></label></div>';
  }
  html+=m.blocks.map((b,i)=>renderBlock(b,m.id,i)).join('');
  html+='<div class="footnav">'+
    (current>0?'<button class="btn" id="prevBtn">← '+MODULES[current-1].title+'</button>':'<span></span>')+
    (current<MODULES.length-1?'<button class="btn primary" id="nextBtn">'+MODULES[current+1].title+' →</button>':'<span></span>')+
    '</div>';
  main.innerHTML=html;
  mounts.forEach(f=>f());
  const pb=document.getElementById('prevBtn'); if(pb) pb.addEventListener('click',()=>go(current-1));
  const nb=document.getElementById('nextBtn'); if(nb) nb.addEventListener('click',()=>go(current+1));
  const md=document.getElementById('modDone');
  if(md) md.addEventListener('change',()=>{ if(md.checked) done[m.id]=true; else delete done[m.id]; saveAll(); renderNav(); refreshStats(); });
  window.scrollTo({top:0,behavior:'instant'});
  updModTimer();
}

function go(i){
  if(i<0||i>=MODULES.length) return;
  current=i; store.set('current',i); renderNav(); renderModule(); refreshStats();
}

/* ============================================================
   TIMER
   ============================================================ */
const TOTAL=4*3600;
let elapsed=store.get('elapsed',0), running=false, tick=null;
let modStart=null;
function fmt(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,'0')+':':'00:')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function paintClock(){
  const c=document.getElementById('clock');
  c.textContent=fmt(elapsed)+' / 4:00:00';
  c.style.color = elapsed>TOTAL?'var(--bad)': elapsed>TOTAL*0.9?'var(--warn)':'';
}
function updModTimer(){
  const e=document.getElementById('modTimer'); if(!e) return;
  const m=MODULES[current];
  const spent = modStart!==null? Math.floor((elapsed-modStart)) : 0;
  e.textContent='⏱ '+Math.floor(spent/60)+' / '+m.min+' min';
  e.style.color = spent/60>m.min?'var(--warn)':'';
}
function toggleTimer(){
  running=!running;
  const b=document.getElementById('timerBtn');
  b.textContent = running?'⏸ Pausa timer':'▶ Avvia timer';
  if(running){ if(modStart===null) modStart=elapsed;
    tick=setInterval(()=>{ elapsed++; store.set('elapsed',elapsed); paintClock(); updModTimer(); },1000); }
  else clearInterval(tick);
}

/* ============================================================
   STATS / EXPORT / TEMA
   ============================================================ */
function refreshStats(){
  const nQ=MODULES.reduce((a,m)=>a+m.blocks.filter(b=>b.t==='quiz').length,0);
  const aQ=Object.keys(quizState).length;
  const okQ=MODULES.flatMap(m=>m.blocks.filter(b=>b.t==='quiz'))
    .filter(b=>quizState[b.id]!==undefined && b.opts[quizState[b.id]].ok).length;
  const exIds=MODULES.flatMap(m=>m.blocks.filter(b=>b.t==='exercise').map(b=>b.id));
  const aE=exIds.filter(k=>(answers[k]||'').trim().length>20).length;
  const capN=CAP.filter(f=>(answers['cap.'+f.k]||'').trim().length>20).length;
  const dM=Object.keys(done).length;
  const nM=MODULES.filter(m=>m.id!=='brk').length;
  document.getElementById('statsBox').innerHTML=
    'Moduli completati <strong>'+dM+'/'+nM+'</strong><br>'+
    'Quiz risposti <strong>'+aQ+'/'+nQ+'</strong>'+(aQ?' · corretti <strong>'+okQ+'</strong>':'')+'<br>'+
    'Esercizi svolti <strong>'+aE+'/'+exIds.length+'</strong><br>'+
    'Capstone <strong>'+capN+'/'+CAP.length+'</strong> sezioni';
  const tot=nM+nQ+exIds.length+CAP.length;
  document.getElementById('pbar').style.width=((dM+aQ+aE+capN)/tot*100)+'%';
}

function doExport(capOnly){
  const L=[];
  const d=new Date();
  const stamp=d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  L.push('# Prompt · Metaprompting · Context Engineering');
  L.push('');
  L.push('Esportato il '+stamp+'  ·  tempo d’aula registrato: '+fmt(elapsed));
  L.push('');
  if(!capOnly){
    L.push('## Risposte agli esercizi');
    MODULES.forEach(m=>{
      const ex=m.blocks.filter(b=>b.t==='exercise');
      ex.forEach(b=>{
        const v=(answers[b.id]||'').trim();
        L.push(''); L.push('### '+m.n+' — '+b.label);
        L.push(''); L.push('> '+b.prompt);
        L.push(''); L.push(v||'_(non compilato)_');
      });
    });
    L.push(''); L.push('## Quiz');
    MODULES.forEach(m=>m.blocks.filter(b=>b.t==='quiz').forEach(b=>{
      const k=quizState[b.id];
      L.push('- **'+b.q+'**');
      L.push('  - Risposta data: '+(k===undefined?'_nessuna_':b.opts[k].tx+(b.opts[k].ok?' ✅':' ❌')));
      if(k!==undefined&&!b.opts[k].ok) L.push('  - Corretta: '+b.opts.find(o=>o.ok).tx);
    }));
    L.push(''); L.push('## Checklist');
    MODULES.forEach(m=>m.blocks.filter(b=>b.t==='checklist').forEach(b=>{
      const s=store.get('ck.'+b.id,[]);
      L.push(''); L.push('### '+b.title);
      b.items.forEach((it,i)=>L.push('- ['+(s[i]?'x':' ')+'] '+it));
    }));
    const bd=store.get('budget',null);
    if(bd){ L.push(''); L.push('## Budget di contesto allocato');
      let t=0; BUD.forEach(b=>{ t+=bd[b.k]||0; L.push('- '+b.lb+': '+(bd[b.k]||0)+'k'); });
      L.push('- **Totale: '+t+'k / 200k**'); }
  }
  L.push(''); L.push('## Scheda di progetto (capstone)');
  CAP.forEach(f=>{ L.push(''); L.push('### '+f.lb); L.push(''); L.push((answers['cap.'+f.k]||'').trim()||'_(non compilato)_'); });
  const ck5=store.get('ck.ck5',[]);
  const m5=MODULES.find(m=>m.id==='m5').blocks.find(b=>b.t==='checklist');
  if(m5){ L.push(''); L.push('### Verifica finale'); m5.items.forEach((it,i)=>L.push('- ['+(ck5[i]?'x':' ')+'] '+it)); }
  const blob=new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(capOnly?'scheda-progetto-agente':'corso-prompt-context-engineering')+'.md';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ============================================================
   BOOT
   ============================================================ */
document.getElementById('timerBtn').addEventListener('click',toggleTimer);
document.getElementById('exportBtn').addEventListener('click',()=>doExport(false));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t); store.set('theme',t);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Azzerare tutte le risposte, le checklist e il timer? L’operazione non è reversibile.')) return;
  store.clearAll(); location.reload();
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});
if(!store.get('theme',null) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');
else document.documentElement.setAttribute('data-theme', store.get('theme','light'));

renderNav(); renderModule(); paintClock(); refreshStats();
</script>
</body>
</html>
