<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt · Metaprompting · Context Engineering — Programma 4 ore</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel-2:#f1f1ee; --text:#1c1c1a; --muted:#6b6b63;
  --line:#e2e2dc; --accent:#c2451f; --accent-soft:#fdefe9; --ok:#1f7a4d; --ok-soft:#e8f5ee;
  --warn:#8a5a00; --warn-soft:#fdf3e0; --bad:#a52020; --bad-soft:#fbeaea;
  --code-bg:#1e1e1c; --code-text:#f0efe9; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141413; --panel:#1e1e1c; --panel-2:#26261f; --text:#f0efe9; --muted:#a3a39a;
  --line:#33332c; --accent:#e8825c; --accent-soft:#2e211c; --ok:#5ec48d; --ok-soft:#17281f;
  --warn:#e0b45f; --warn-soft:#2a2318; --bad:#e88b8b; --bad-soft:#2b1a1a;
  --code-bg:#0f0f0e; --code-text:#e8e7e1; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 18px;
}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}
.pill{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.pill.ghost{background:transparent}
.pill:hover{border-color:var(--accent)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress-wrap{width:100%;height:3px;background:var(--panel-2)}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

.shell{display:grid;grid-template-columns:274px minmax(0,1fr);gap:0;align-items:start}
nav.side{
  position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg);
}
nav.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 8px 8px}
.navitem{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;
  color:var(--text);padding:8px 10px;border-radius:9px;margin-bottom:2px;line-height:1.35;
}
.navitem:hover{background:var(--panel-2)}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none;padding-top:2px}
.navitem.active .idx{color:var(--accent)}
.navitem .nt{font-size:13.5px}
.navitem .nm{font-size:11px;color:var(--muted);display:block}
.navitem .tick{margin-left:auto;color:var(--ok);font-size:12px;flex:none}

main{padding:30px 34px 90px;max-width:920px;margin:0 auto;width:100%}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:31px;line-height:1.18;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:21px;letter-spacing:-.01em;margin:38px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:24px 0 8px}
.lede{color:var(--muted);font-size:15px;margin:0 0 4px}
.prose{font-size:15px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:12px 0;padding-left:22px}
.prose li{margin:6px 0}
.prose strong{font-weight:650}
code{font-family:var(--mono);font-size:.875em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
pre{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:var(--radius);overflow-x:auto;font-size:12.5px;line-height:1.55;margin:14px 0}
pre code{background:none;border:0;padding:0;color:inherit;font-size:12.5px}

.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:13px 16px;margin:16px 0;font-size:14px;box-shadow:var(--shadow)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout .ct{display:block;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.grid{display:grid;gap:12px;margin:16px 0}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card h5{margin:0 0 5px;font-size:13.5px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tablewrap table{margin:0}

/* ---------- widgets ---------- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:20px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.widget-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;flex:none}
.widget-t{font-weight:650;font-size:15px}
.widget-s{color:var(--muted);font-size:13.5px;margin:2px 0 14px}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:10px 13px;margin-bottom:7px;font-size:14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-ok{border-color:var(--ok)}
.opt .mk{font-family:var(--mono);font-weight:700;margin-right:8px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin-top:6px;padding-left:2px;display:none}
.opt.shown .why{display:block}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:6px;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;flex:none;accent-color:var(--accent);width:15px;height:15px}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .lb{font-weight:600}
.chk .ds{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-h{padding:7px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pane.bad .pane-h{background:var(--bad-soft);color:var(--bad)}
.pane.ok .pane-h{background:var(--ok-soft);color:var(--ok)}
.pane pre{margin:0;border-radius:0;max-height:340px}

.preview{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:400px;overflow-y:auto;min-height:80px}
.preview .ghosted{opacity:.32}
.meter{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scoreline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-family:var(--mono)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--mono)}
.tab:hover{border-color:var(--accent)}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.chatlog{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px;max-height:280px;overflow-y:auto;margin:10px 0}
.bub{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:13px;white-space:pre-wrap}
.bub:last-child{margin-bottom:0}
.bub .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.bub.u{border-color:var(--accent)}
.bub.a{color:var(--muted);font-style:italic}
.bub.t{background:var(--accent-soft);font-family:var(--mono);font-size:12px}
.bub.empty{border-style:dashed;color:var(--muted);font-size:12.5px}

textarea,input[type="text"],select{
  width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fl{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:.3s}
.saved.on{opacity:1}

.sorter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:7px}
.sorter-row .it{flex:1 1 240px;font-size:13.5px}
.sorter-row .bs{display:flex;gap:5px;flex:none}
.bbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:650}
.bbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sorter-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.sorter-row.bad{border-color:var(--bad);background:var(--bad-soft)}
.sorter-row .fb{flex:1 1 100%;font-size:12.5px;color:var(--muted);display:none}
.sorter-row.done .fb{display:block}

.slider-row{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(120px,2fr) 74px;gap:10px;align-items:center;margin-bottom:9px;font-size:13.5px}
.slider-row input[type=range]{width:100%;accent-color:var(--accent)}
.slider-row .val{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--muted)}
.stack{height:24px;display:flex;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin:14px 0 8px;background:var(--panel-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.diag{margin-top:12px;font-size:13.5px}
.diag div{padding:6px 0;border-top:1px dashed var(--line)}

.footnav{display:flex;justify-content:space-between;gap:10px;margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}
.timerbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 24px}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:290px}
  main{padding:22px 16px 70px}
  h1{font-size:25px}
  .slider-row{grid-template-columns:1fr;gap:4px}
}
@media print{
  nav.side,header.top,.footnav,.btnrow{display:none}
  main{max-width:none;padding:0}
  .widget,.card,.callout{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span><span>Prompt · Metaprompting · Context Engineering<small>Programma formativo — 4 ore, teoria + laboratorio</small></span></div>
  <div class="spacer"></div>
  <div class="timerbox">
    <button class="pill ghost" id="timerBtn">▶ Avvia timer</button>
    <span class="pill clock" id="clock">00:00:00 / 4:00:00</span>
  </div>
  <button class="pill ghost" id="exportBtn" title="Scarica risposte e note in Markdown">⬇ Esporta</button>
  <button class="pill ghost" id="themeBtn" title="Tema chiaro/scuro">◐</button>
</header>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

<div class="shell">
  <nav class="side">
    <h4>Programma</h4>
    <div id="nav"></div>
    <h4 style="margin-top:18px">Avanzamento</h4>
    <div style="padding:0 10px;font-size:12.5px;color:var(--muted)" id="statsBox"></div>
    <div style="padding:10px">
      <button class="btn" id="resetBtn" style="width:100%;font-size:12px">Azzera avanzamento</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   STATO + PERSISTENZA
   ============================================================ */
const NS = 'pce4h.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} },
  clearAll(){ try{ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};
let current = store.get('current', 0);
let done = store.get('done', {});      // moduleId -> true
let answers = store.get('answers', {}); // exerciseId -> string
let quizState = store.get('quiz', {});  // quizId -> chosen index

function saveAll(){ store.set('done', done); store.set('answers', answers); store.set('quiz', quizState); }

/* ============================================================
   CONTENUTI
   ============================================================ */
const MODULES = [];

/* ---------- 0. Apertura ---------- */
MODULES.push({
  id:'m0', n:'00', title:'Apertura', min:5,
  blocks:[
    {t:'p',html:`<p>Quattro ore per passare da <em>&laquo;scrivo un prompt e spero&raquo;</em> a <em>&laquo;progetto il contesto e misuro il risultato&raquo;</em>. Il filo conduttore &egrave; uno: <strong>un modello linguistico non sa nulla del tuo mondo se non ci&ograve; che gli metti davanti in questa singola chiamata</strong>. Tutto il resto &mdash; prompt, metaprompting, context engineering &mdash; sono tecniche per decidere <em>cosa</em> mettergli davanti.</p>`},
    {t:'cards',cards:[
      {tag:'Ora 1',h:'Il prompt',p:'Anatomia, tokenizzazione, ruoli, parametri.'},
      {tag:'Ora 2',h:'Best practices',p:'12 tecniche che spostano davvero l’ago, con laboratorio di riscrittura e scoring.'},
      {tag:'Ora 3',h:'Metaprompting',p:'Usare il modello per scrivere, criticare e testare i prompt. Il ciclo eval-driven.'},
      {tag:'Ora 4',h:'Context engineering',p:'Risorse statiche vs contesto dinamico, RAG, skill, compattazione, budget di token.'}
    ]},
    {t:'table',head:['Blocco'],rows:[
      ['00 · Apertura'],
      ['01 · Che cos’è un prompt'],
      ['02 · Prompt best practices'],
      ['— Pausa'],
      ['03 · Metaprompting'],
      ['04 · Context engineering'],
      ['05 · Capstone: progetta un agente'],
      ['06 · Chiusura']
    ]},
    {t:'callout',kind:'ok',title:'Come si usa questo materiale',html:`Naviga con la barra laterale o con i pulsanti in fondo a ogni modulo. Ogni esercizio si salva automaticamente nel browser (nessun dato lascia il tuo computer): puoi chiudere e riprendere. Con <strong>&#8681; Esporta</strong> scarichi tutte le tue risposte in un file Markdown. Il timer in alto serve al docente per tenere il ritmo.`},
    {t:'p',html:`<h3>Obiettivi di apprendimento</h3><p>Alla fine delle 4 ore ogni partecipante deve essere in grado di:</p>
      <ol>
        <li>Descrivere che cosa entra concretamente in una chiamata a un LLM.</li>
        <li>Riscrivere un prompt vago in un prompt operativo efficace.</li>
        <li>Costruire un meta-prompt che generi o critichi altri prompt, e un mini set di test per valutarli.</li>
        <li>Distinguere risorse statiche e contesto dinamico, e allocare un budget di token motivandolo.</li>
        <li>Progettare il contesto di un assistente reale del proprio ufficio, con criteri di valutazione.</li>
      </ol>`},
    {t:'exercise',id:'ex0',label:'Warm-up (3 minuti)',
      prompt:'Scrivi il caso d’uso reale su cui vuoi lavorare oggi: un compito ripetitivo del tuo lavoro che vorresti delegare a un assistente. Una o due frasi. Lo riprenderemo nel capstone finale.',
      placeholder:'Es. «Ogni settimana riassumo 20 segnalazioni da un gestionale e le classifico per priorità; vorrei che un assistente producesse la bozza del report.»'}
  ]
});

/* ---------- 1. Che cos'è un prompt ---------- */
MODULES.push({
  id:'m1', n:'01', title:'Capire cos\'è un prompt', min:50,
  blocks:[
    {t:'p',html:`<h3>Cosa viene inviato ai provider di AI (chatgpt, Antrophic, LMstudio, oMLX) quando invio nella chat/Cli? </h3>
      <p>Partiamo da ci&ograve; che scrivi tu. Apri la chat, batti tre parole e premi invio:</p>`},
    {t:'code',lang:'text',code:`ciao, come stai?`},
    {t:'p',html:`<p>Sembra ovvio che al provider arrivi &laquo;ciao, come stai?&raquo;. E invece no: <strong>non viene inviato solo quel testo</strong>. Parte una richiesta strutturata, in cui la tua frase &egrave; un campo fra gli altri &mdash; qualcosa di simile a questo:</p>`},
    {t:'code',lang:'json',code:`{
  "model": "claude-...",
  "system": "Sei un assistente utile e conciso. Oggi e' il 15 settembre 2026.
             Rispondi in italiano. Non inventare fatti: se non sai, dillo.",
  "messages": [
    { "role": "user", "content": "ciao, come stai?" }
  ],
  "temperature": 1.0,
  "max_tokens": 1024
}`},
    {t:'p',html:`<p>Guarda che cosa c’&egrave; l&igrave; dentro che <em>tu non hai scritto</em>: un ruolo, una lingua, la data di oggi, una regola sul non inventare, un tetto alla lunghezza della risposta. Nelle chat commerciali quel campo <code>system</code> contiene centinaia di righe che non vedrai mai;</p>
      <p>Questo &egrave; il caso pi&ugrave; semplice possibile: un turno, nessuno strumento, nessun passato. Appena la conversazione ha una storia e l’assistente pu&ograve; consultare dei dati, il pacchetto diventa cos&igrave;:</p>`},
    {t:'code',lang:'json',code:`{
  "model": "claude-...",
  "system": "Sei l'assistente interno dell'ufficio contratti di ACME. ...",
  "tools":  [ { "name": "cerca_contratto", "description": "...", "input_schema": {...} } ],
  "messages": [
    { "role": "user",      "content": "Il contratto 4471 e' ancora attivo?" },
    { "role": "assistant", "content": [ { "type": "tool_use", "name": "cerca_contratto", "input": {"id": 4471} } ] },
    { "role": "user",      "content": [ { "type": "tool_result", "content": "{ stato: 'scaduto', fine: '2025-03-31' }" } ] }
  ],
  "temperature": 0.2,
  "max_tokens": 1024
}`},
    {t:'p',html:`<p>Tutti questi pezzi sono <strong>prompt</strong></p>`},
    {t:'cards',cards:[
      {tag:'system',h:'Chi sei, cosa vale sempre',p:'Ruolo, dominio, regole non negoziabili, formato, tono. Stabile tra le richieste.'},
      {tag:'user',h:'La richiesta del turno',p:'Il compito/il testo specifico per questo turno.'},
      {tag:'assistant',h:'La risposta del modello',p:'il contenuto generato dal modello'},
      {tag:'tools',h:'Capacità disponibili',p:'Nome, descrizione, inputs e outputs con i tipi '},
      {tag:'tool_result',h:'Dati dal mondo',p:'Righe di database, ricerche, output di codice. Il canale della freschezza.'},
      {tag:'parametri',h:'Come campionare',p:'temperature, max_tokens, stop sequences. Non sono prompt ma cambiano l’esito.'}
    ]},
    {t:'p',html:`<p>Il modo pi&ugrave; rapido per convincersene &egrave; costruirne uno. Nel lab qui sotto scrivi una conversazione come la scriveresti in chat, e a destra vedi comparire il pacchetto che partirebbe davvero verso il provider &mdash; nei due dialetti che incontrerai nel 95% dei casi.</p>`},
    {t:'apisim'},
    {t:'p',html:`<p>Tre cose da notare mentre giochi con il simulatore. La prima: <strong>a ogni turno riparte tutto</strong> &mdash; system, tool e storico completo &mdash; perch&eacute; il modello non ricorda nulla fra una chiamata e l&rsquo;altra. La seconda: il contatore dei token cresce a ogni turno, e quella crescita &egrave; il costo reale di una conversazione lunga. La terza: la &laquo;chat&raquo; &egrave; un&rsquo;illusione dell&rsquo;interfaccia. Esiste solo un array di messaggi che qualcuno ricompone e rispedisce ogni volta.</p>`},

    {t:'p',html:`<p>Questo JSON &egrave; il punto di partenza di tutto il corso. Da qui in avanti lo <strong>smontiamo</strong>: prima scendiamo fino all’unit&agrave; minima di cui &egrave; fatto ogni campo &mdash; il token &mdash; poi risaliamo per capire che cosa succede quando tutti questi pezzi vengono messi in fila davanti al modello.</p>`},

    {t:'p',html:`<h3>Che cosa, di quel JSON, arriva davvero al modello</h3>
      <p>Il JSON non &egrave; il prompt: &egrave; la <strong>busta</strong>. Arriva al server del provider, che la apre e smista il contenuto verso due destinazioni molto diverse.</p>
      <ul>
        <li><strong>Una parte diventa testo, e poi token.</strong> Il <code>system</code>, le definizioni dei <code>tools</code>, il contenuto di ogni messaggio, le chiamate ai tool e i loro risultati: tutto questo viene serializzato in <em>una sola</em> sequenza e dato in pasto al modello. Questo &egrave; il prompt vero.</li>
        <li><strong>Una parte non diventa niente.</strong> <code>model</code>, <code>temperature</code>, <code>max_tokens</code>, <code>top_p</code>, <code>stream</code>: sono istruzioni per la <em>macchina che campiona</em>, non per il modello. Non entrano nella sequenza, non costano token, e il modello non pu&ograve; leggerli.</li>
      </ul>
      <p>La seconda riga ha una conseguenza che in aula sorprende sempre: <strong>scrivere <code>&quot;temperature&quot;: 0.2</code> non dice al modello di essere preciso</strong>. Il modello non sa a che temperatura verr&agrave; campionato, come tu non sai a che velocit&agrave; qualcuno sta leggendo quello che scrivi. Se vuoi prudenza, devi chiederla nel <code>system</code> &mdash; cio&egrave; in token.</p>`},

    {t:'table',
      head:['Campo del JSON','Diventa token?','Dove finisce'],
      rows:[
        ['<code>model</code>','No','Sceglie quale rete risponde &mdash; e quale tokenizzatore viene usato'],
        ['<code>tools</code>','<strong>S&igrave;</strong>','Serializzato come testo in testa alla sequenza: nome, descrizione e schema di ogni tool'],
        ['<code>system</code>','<strong>S&igrave;</strong>','Subito dopo i tool, prima di qualsiasi messaggio'],
        ['<code>messages[].content</code>','<strong>S&igrave;</strong>','In ordine, ciascuno racchiuso fra i marcatori del proprio turno'],
        ['<code>tool_use</code> / <code>tool_result</code>','<strong>S&igrave;</strong>','Sono contenuto di messaggi: il JSON degli argomenti e del risultato viene letto come testo'],
        ['<code>temperature</code>, <code>top_p</code>','No','Agiscono sul campionamento, dopo che il modello ha prodotto le probabilit&agrave;'],
        ['<code>max_tokens</code>','No','&Egrave; solo il punto in cui la generazione viene interrotta'],
        ['<code>stream</code>','No','Riguarda come la risposta torna indietro, non come la domanda arriva']
      ]},

    {t:'p',html:`<h3>L&rsquo;appiattimento: da albero a riga</h3>
      <p>Il JSON &egrave; annidato, con campi paralleli; il modello invece legge <strong>una sequenza lineare</strong>, una sola, dall&rsquo;inizio alla fine. Il passaggio fra i due mondi si chiama <em>template di chat</em>: il server ricompone i pezzi in un ordine fisso e separa i turni con <strong>marcatori speciali</strong> &mdash; token che non corrispondono a nessuna parola e che il modello ha imparato a riconoscere durante l&rsquo;addestramento. Nell&rsquo;API di Anthropic l&rsquo;ordine di composizione documentato &egrave; <code>tools</code> &rarr; <code>system</code> &rarr; <code>messages</code>.</p>
      <p>La conversazione del simulatore, appiattita, ha grosso modo questa forma:</p>`},
    {t:'code',lang:'text',code:`<|start|>system
[ definizione dei tool, serializzata come testo:
  cerca_contratto - "Cerca un contratto per numero e restituisce stato..."
  schema: { id: integer } ]

Sei l'assistente interno dell'ufficio contratti di ACME.
Rispondi solo con dati verificati dai tool: se un dato non risulta, dillo.
<|end|>
<|start|>user
Il contratto 4471 e' ancora attivo?
<|end|>
<|start|>assistant
[chiamata] cerca_contratto {"id": 4471}
<|end|>
<|start|>user
[risultato] {"stato": "scaduto", "fine": "2025-03-31", "referente": "M. Rossi"}
<|end|>
<|start|>assistant
█   <- la sequenza finisce qui: il compito del modello e' continuarla`},
    {t:'p',html:`<p>I marcatori qui sopra sono <strong>schematici</strong>: la forma esatta cambia da provider a provider e da generazione a generazione, e per i modelli chiusi non &egrave; pubblica (per quelli a pesi aperti la trovi scritta nel <code>chat_template</code> del tokenizzatore). Ma la struttura &egrave; sempre questa, e spiega tre cose che altrimenti sembrano magia:</p>
      <ul>
        <li><strong>Perch&eacute; i ruoli funzionano.</strong> <code>system</code>, <code>user</code> e <code>assistant</code> non sono categorie che il modello &laquo;capisce&raquo;: sono marcatori che ha visto milioni di volte in addestramento, sempre usati nello stesso modo. Il ruolo &egrave; una convenzione imparata, non un permesso.</li>
        <li><strong>Perch&eacute; l&rsquo;ordine conta.</strong> Non esistono campi &laquo;paralleli&raquo;: dentro la sequenza qualcosa viene per forza prima e qualcosa dopo. Un&rsquo;istruzione nel <code>system</code> sta a decine di migliaia di token di distanza dall&rsquo;ultima domanda, e quella distanza si sente.</li>
        <li><strong>Perch&eacute; la generazione &laquo;parte gi&agrave; avviata&raquo;.</strong> L&rsquo;ultima cosa nella sequenza &egrave; il marcatore di apertura del turno dell&rsquo;assistente. Il modello non riceve la domanda &laquo;cosa rispondi?&raquo;: riceve un testo che si interrompe e il compito di proseguirlo.
      </ul>`},

    {t:'p',html:`<h3>Da testo a token: come avviene il taglio</h3>
      <p>Quella sequenza &egrave; ancora testo. L&rsquo;ultimo passaggio prima del modello &egrave; il <strong>tokenizzatore</strong>: un vocabolario fisso di frammenti &mdash; dell&rsquo;ordine di 100.000&ndash;200.000 pezzi &mdash; costruito una volta per tutte fondendo via via le coppie di caratteri pi&ugrave; frequenti nei dati di addestramento (&egrave; la famiglia di algoritmi <em>BPE</em>). Il taglio &egrave; puramente statistico e deterministico: nessuna grammatica, nessun significato, nessuna comprensione. Poi ogni frammento viene sostituito dal suo numero, e <em>quella</em> lista di numeri &egrave; ci&ograve; che entra nella rete.</p>
      <p>Una segmentazione plausibile, con &laquo;&middot;&raquo; a marcare lo spazio iniziale:</p>`},
    {t:'code',lang:'text',code:`"Il contratto 4471 e' scaduto"
   |Il|·contratto|·44|71|·e|'|·sc|aduto|        -> 8 token

'{"stato": "scaduto", "fine": "2025-03-31"}'
   |{|"|stato|":|·"|scaduto|",|·"|fine|":|·"|2025|-|03|-|31|"|}|  -> 18 token`},
    {t:'p',html:`<p>Da qui discendono quattro fatti che in produzione si pagano davvero:</p>
      <ul>
        <li><strong>Lo spazio fa parte del token.</strong> <code>&middot;contratto</code> e <code>contratto</code> sono due token diversi. &Egrave; il motivo per cui la formattazione &mdash; a capo, indentazioni, spaziature &mdash; non &egrave; gratis.</li>
        <li><strong>Codici, ID e date costano sproporzionatamente.</strong> Una parola comune &egrave; un token solo; un numero di contratto o un UUID si frantuma in molti pezzi. Un <code>tool_result</code> pieno di identificativi pu&ograve; costare pi&ugrave; di un paragrafo di prosa lungo il doppio.</li>
        <li><strong>La punteggiatura del JSON si paga.</strong> Nell&rsquo;esempio qui sopra met&agrave; dei token sono virgolette, parentesi e due punti. Restituire un risultato in forma compatta invece che in JSON verboso &egrave; un risparmio reale, a ogni turno.</li>
        <li><strong>L&rsquo;italiano costa pi&ugrave; dell&rsquo;inglese.</strong> I vocabolari sono costruiti in gran parte su testo inglese: le nostre parole si spezzano pi&ugrave; spesso, e lo stesso contenuto ci costa in media il 20&ndash;30% di token in pi&ugrave;.</li>
      </ul>
      <p>Un&rsquo;ultima avvertenza pratica, per quando dovrai misurare invece che stimare. Il tokenizzatore &egrave; <strong>specifico del modello</strong>: lo stesso testo, su due modelli diversi, d&agrave; due conteggi diversi. Per i modelli OpenAI il tokenizzatore &egrave; pubblico (<code>tiktoken</code>); per Claude non lo &egrave;, e il conteggio esatto &mdash; comprensivo di <code>system</code>, <code>tools</code> e storico &mdash; si ottiene chiamando l&rsquo;endpoint <code>POST /v1/messages/count_tokens</code> con lo stesso <code>model</code> che userai davvero. Usare <code>tiktoken</code> per stimare i token di Claude &egrave; un errore comune: sottostima di circa il 15&ndash;20% sul testo ordinario, molto di pi&ugrave; su codice e lingue non inglesi.</p>`},
    {t:'callout',kind:'warn',title:'La regola operativa',html:`Se un&rsquo;informazione non &egrave; stata trasformata in token, per il modello non esiste &mdash; per quanto &laquo;ovvia&raquo; ti sembri dalla struttura della richiesta. Il nome di un campo, l&rsquo;ordine delle chiavi, il fatto che una cosa sia un tool e non un messaggio: il modello lo sa solo se il template lo ha scritto nella sequenza. E i parametri di campionamento non sono token.`},
    {t:'p',html:`<p>Resta l&rsquo;ultima domanda: quanto pesa tutto questo? Quanto costa, e quanto spazio occupa nella finestra. &Egrave; il prossimo passo.</p>`},

    {t:'p',html:`<h3>Token, non parole</h3>
      <p>Il modello non legge caratteri n&eacute; parole: legge <strong>token</strong>, frammenti ricorrenti di testo. In inglese un token vale in media ~4 caratteri; in italiano di meno (~3) Regola spannometrica utile in aula: <strong>1.000 token &asymp; 700 parole inglesi &asymp; 550 parole italiane</strong>.</p>
      <p>Perch&eacute; ti interessa? Per tre ragioni molto pratiche: i token si <strong>pagano</strong>, occupano una finestra di contesto <strong>finita</strong>, e ogni token in pi&ugrave; &egrave; anche un’occasione in pi&ugrave; di distrarre il modello.</p>`},
    {t:'tokenizer'},

    {t:'p',html:`<h3>Il contesto &egrave; quella sequenza. La finestra &egrave; la sua lunghezza massima.</h3>
      <p>Ricapitoliamo il percorso fatto finora, perch&eacute; adesso si chiude. Hai scritto una frase in chat; l&rsquo;applicazione l&rsquo;ha messa dentro un JSON insieme a <code>system</code>, <code>tools</code> e storico; il server ha appiattito quel JSON in un testo unico con i marcatori di turno; il tokenizzatore ha tagliato quel testo in frammenti e li ha sostituiti con dei numeri. Il risultato finale &egrave; <strong>una lista di interi</strong>, lunga qualche migliaio di elementi.</p>
      <p>Quella lista ha un nome: &egrave; il <strong>contesto</strong>. E la sua lunghezza massima consentita &mdash; quanti elementi ci stanno &mdash; &egrave; la <strong>finestra di contesto</strong>. Non c&rsquo;&egrave; nient&rsquo;altro: il contesto non &egrave; un database, non &egrave; una cache, non &egrave; una sessione. &Egrave; solo quella lista, ricostruita da zero a ogni chiamata.</p>`},
    {t:'code',lang:'text',code:`// Nessuna sessione lato server, nessuno stato tenuto da parte fra
// una chiamata e l'altra.

contesto = [ tools, system, turno_1, turno_2, ..., turno_n ]   // lo costruisci tu
risposta = POST /v1/messages { contesto }                      // una chiamata
// ...e il server dimentica tutto.

// Il turno dopo non "aggiunge" niente da nessuna parte:
// ricostruisce l'intero array e lo rispedisce daccapo.
contesto = [ tools, system, turno_1, ..., turno_n, turno_n+1 ]`},
    {t:'p',html:`<p>Lo stato non vive dalla parte del modello: vive nel client &mdash; la chat, il tuo codice, l&rsquo;agente &mdash; ed &egrave; il client a doverlo riallegare per intero a ogni richiesta. Se ti serve un&rsquo;immagine: un consulente bravissimo che a ogni chiamata entra in una stanza vuota. Sa tutto del mondo, niente di te, e pu&ograve; leggere solo il fascicolo che gli hai messo sul tavolo.</p>
      <p>Da questa unica premessa discendono tre conseguenze che in aula ne spiegano il 90%.</p>`},
    {t:'p',html:`<p><strong>1. Il modello non ha accesso a niente.</strong> Non al tuo database, non al repository, non al file aperto nell&rsquo;editor, non alla conversazione di ieri, e nemmeno a quello che ha scritto lui stesso dieci minuti fa. Non esiste una connessione da qualche parte: esiste solo l&rsquo;array. Se un dato non &egrave; stato serializzato l&igrave; dentro &mdash; a mano, da un <code>tool_result</code>, da un documento allegato &mdash; per il modello <em>non esiste</em>. &Egrave; la causa numero uno dei &laquo;ma perch&eacute; non lo sa?&raquo;, e il primo posto dove guardare quando succede non &egrave; il modello: &egrave; il pacchetto che gli hai spedito.</p>
      <p><strong>2. La memoria &egrave; un&rsquo;illusione del client.</strong> Quando in ChatGPT scrivi &laquo;e il contratto 5580?&raquo; e l&rsquo;assistente capisce che stai ancora parlando di contratti, non sta ricordando: la chat ha rispedito tutti i turni precedenti insieme alla tua frase. La continuit&agrave; &egrave; ricostruita da fuori, a ogni giro. Toglile lo storico e l&rsquo;assistente non ha la minima idea di cosa tu stia parlando &mdash; ed &egrave; esattamente ci&ograve; che accade quando la finestra si riempie e qualcuno comincia a tagliare.</p>
      <p><strong>3. Rispedire tutto costa, e il costo cresce in fretta.</strong> Non paghi quello che scrivi: paghi quello che <em>viene rispedito</em>, a ogni turno. Ipotizza un <code>system</code> con i <code>tools</code> da 1.000 token, domande tue da 50 token e risposte da 150:</p>`},
    {t:'table',
      head:['Turno','Token inviati in quella chiamata','Token di input pagati in totale'],
      rows:[
        ['1','1.050','1.050'],
        ['5','1.850','7.250'],
        ['10','2.850','19.500'],
        ['20','4.850','<strong>59.000</strong>']
      ]},
    {t:'p',html:`<p>Venti turni: hai battuto sulla tastiera un totale di mille token, e ne hai pagati <strong>cinquantanovemila</strong> di input. La crescita &egrave; quadratica, non lineare, e vale per ogni agente che gira in loop. &Egrave; il motivo per cui esistono la compattazione dello storico (modulo 04) e il <em>prompt caching</em>, che sconta il prefisso stabile finch&eacute; non lo tocchi &mdash; e, prima ancora, per cui conviene non riempire il contesto di roba che non serve.</p>`},
    {t:'p',html:`<p>Restano due propriet&agrave; della finestra da fissare, perch&eacute; governano tutte le decisioni del modulo 04.</p>
      <ul>
        <li><strong>&Egrave; finita, ed &egrave; un buffer, non un disco.</strong> La dimensione &egrave; fissata quando il modello viene addestrato &mdash; da alcune decine di migliaia a oltre un milione di token &mdash; ed &egrave; <em>condivisa</em> fra quello che mandi e quello che il modello genera: la risposta occupa spazio nella stessa finestra. Non c&rsquo;&egrave; swap e non c&rsquo;&egrave; sfratto automatico: se sfori, la chiamata viene rifiutata con un errore. Le chat che &laquo;continuano all&rsquo;infinito&raquo; non hanno una finestra pi&ugrave; grande: hanno qualcuno che, dietro le quinte, taglia o riassume i turni vecchi.</li>
        <li><strong>&Egrave; ordinata: &egrave; un array, non un insieme.</strong> Ogni token ha una posizione, e la posizione pesa. Un&rsquo;istruzione in cima e la stessa istruzione sepolta a met&agrave; di ottantamila token di documenti non producono lo stesso comportamento &mdash; e non &egrave; un bug, &egrave; come funziona l&rsquo;attenzione. Dove metti una cosa &egrave; una decisione di progetto quanto il deciderne il contenuto.</li>
      </ul>
      <p>Messe insieme, queste due propriet&agrave; sono tutto il <em>context engineering</em>: decidere che cosa entra nel fascicolo, in che ordine, in che forma e quando buttarlo via. &Egrave; il mestiere del modulo 04 &mdash; ma, come vedi, lo stai gi&agrave; facendo da mezz&rsquo;ora.</p>`},

    {t:'quiz',id:'q1ctx',q:'Che cos&rsquo;&egrave; la <strong>finestra di contesto</strong> (context window) di un modello?',
      opts:[
        {tx:'Il numero massimo di token che il modello pu&ograve; avere davanti in una singola chiamata, storico e risposta compresi',ok:true,why:'Esatto. È una capienza, misurata in token, ed è condivisa: system, definizioni dei tool, storico, documenti allegati e anche i token che il modello sta generando stanno tutti lì dentro. Quando non ci sta più nulla, qualcosa deve uscire — e ciò che esce, per il modello, smette di esistere.'},
        {tx:'La memoria del modello: tutto quello che ha imparato durante l&rsquo;addestramento',ok:false,why:'Sono due cose diverse. Ciò che il modello ha imparato sta nei pesi ed è fisso: è la biblioteca. La finestra di contesto è la scrivania — vuota a ogni chiamata, e la riempi tu.'},
        {tx:'Il limite di caratteri del messaggio che posso scrivere nella chat',ok:false,why:'Due errori in una riga. Non si misura in caratteri ma in token, e non riguarda solo il tuo messaggio: il tuo testo è spesso la parte più piccola di ciò che occupa la finestra.'},
        {tx:'Uno spazio che si libera da solo quando &egrave; pieno, conservando le informazioni importanti',ok:false,why:'Niente si libera da solo, e soprattutto niente decide che cosa è importante. Quando lo spazio finisce è l&rsquo;applicazione che deve tagliare, riassumere o scegliere: è una decisione di progetto, ed è esattamente il mestiere del context engineering.'}
      ]},

    {t:'p',html:`<h3>Il Prompt</h3>Un prompt &egrave; <em>l’intera sequenza di token che il modello riceve prima di produrre il primo token di risposta</em>. Non &egrave; solo &laquo;la domanda che scrivo in chat&raquo;: &egrave; tutto ci&ograve; che finisce nella finestra di contesto, in ordine, in quel preciso momento.</p>
      <p>Questa definizione chiarisce subito tre cose:</p>
      <ul>
        <li>Il modello &egrave; <strong>stateless</strong>: fra due chiamate non ricorda niente. La &laquo;memoria&raquo; di una conversazione &egrave; una finzione ricostruita rimandando ogni volta lo storico.</li>
        <li>Quello che tu <em>non scrivi</em> semplicemente non esiste. Nessun contesto implicito, nessun &laquo;si capisce dal ruolo&raquo;.</li>
        <li>Se il modello sbaglia, la prima ipotesi non &egrave; &laquo;&egrave; stupido&raquo; ma <strong>&laquo;non aveva l’informazione, o l’aveva in una forma sbagliata&raquo;</strong>.</li>
      </ul>`},
    {t:'callout',kind:'',title:'La frase da portare a casa',html:`Il prompt non è solo «la domanda che scrivo in chat»: è tutto ciò che finisce nella finestra di contesto`},
    {t:'quiz',id:'q1def',q:'In base a quanto visto finora, che cos&rsquo;&egrave; un <strong>prompt</strong>?',
      opts:[
        {tx:'L&rsquo;intera sequenza di token che il modello riceve prima di generare il primo token della risposta',ok:true,why:'Esatto. Non una frase, ma tutto il pacchetto appiattito in sequenza: definizioni dei tool, system, storico dei turni, risultati dei tool e infine la tua richiesta. Se è in quella sequenza è prompt, chiunque l&rsquo;abbia scritto.'},
        {tx:'Il testo che scrivo nella casella della chat e invio al modello',ok:false,why:'È la parte visibile, e quasi sempre la più piccola. Nel simulatore qui sopra la tua frase erano poche decine di token su diverse centinaia: tutto il resto lo aveva messo l&rsquo;applicazione.'},
        {tx:'Le istruzioni permanenti che l&rsquo;assistente ricorda da una conversazione all&rsquo;altra',ok:false,why:'Non esiste niente di permanente: il modello è stateless. Ciò che sembra memoria è testo che qualcuno rimette nel pacchetto a ogni chiamata — e che paghi a ogni chiamata.'},
        {tx:'La configurazione della richiesta: modello, temperature, max_tokens',ok:false,why:'Quelli sono parametri, non prompt: non diventano token e il modello non li legge. Governano il campionamento, non il contenuto.'}
      ]},

    {t:'p',html:`<h3>Che cosa fa davvero il modello</h3>
      <p>Un LLM stima la distribuzione di probabilit&agrave; del token successivo dato tutto ci&ograve; che precede, e poi ne campiona uno; ripete, e cos&igrave; costruisce la risposta. Ne derivano conseguenze controintuitive ma sfruttabili:</p>
      <ul>
        <li><strong>Il prompt non ordina, condiziona.</strong> Scrivere &laquo;sei un revisore legale meticoloso&raquo; sposta la distribuzione verso il linguaggio dei revisori legali. Non installa competenze: rende pi&ugrave; probabile un certo registro e un certo tipo di attenzione.</li>
        <li><strong>Il ragionamento occupa token.</strong> Se chiedi la risposta secca, il modello ha pochi passi di calcolo. Se lo lasci ragionare prima, la qualit&agrave; sui compiti multi-passo sale in modo netto: il testo intermedio &egrave; letteralmente lo spazio dove il ragionamento avviene.</li>
        <li><strong>L’inizio condiziona il seguito.</strong> Una volta imboccata una strada (formato, tono, struttura), il modello tende a restarci. Da qui l’efficacia degli esempi e del prefill.</li>
        <li><strong>La posizione conta.</strong> Istruzioni all’inizio e alla fine di un contesto lungo pesano pi&ugrave; di quelle sepolte al centro.</li>
      </ul>`},
    {t:'callout',kind:'warn',title:'Attenzione: determinismo',html:`Con <code>temperature</code> maggiore di 0 la stessa richiesta d&agrave; risposte diverse. Anche a 0 non hai garanzia bit-per-bit. Corollario metodologico: <strong>non giudicare mai un prompt da una singola esecuzione</strong>. Se cambi un prompt e l’output migliora una volta, non hai imparato nulla. Serve un insieme di casi &mdash; ci arriviamo al modulo 03.`},

    {t:'quiz',id:'q1a',q:'Un assistente risponde &laquo;non ho informazioni sul contratto 4471&raquo;, ma il contratto esiste nel gestionale aziendale. Qual è la prima ipotesi corretta?',
      opts:[
        {tx:'Il modello è troppo piccolo per il compito',ok:false,why:'Possibile ma è l’ultima ipotesi da fare. Prima si verifica che l’informazione fosse effettivamente nel contesto.'},
        {tx:'Il dato non era nel contesto della chiamata',ok:true,why:'Esatto. Il modello è stateless e non ha accesso ai tuoi sistemi: se nessun tool_result o documento ha portato quel dato dentro la finestra, per il modello non esiste. Prima si guarda il prompt effettivo, poi si dubita del modello.'},
        {tx:'Va alzata la temperature per renderlo più creativo',ok:false,why:'La temperature governa la variabilità del campionamento, non l’accesso ai dati. Alzarla qui produrrebbe soltanto invenzioni più fluide.'},
        {tx:'Bisogna insistere ripetendo la domanda',ok:false,why:'Ripetere non aggiunge informazione. Se il dato manca, manca anche al secondo tentativo: cambia solo la probabilità che il modello lo inventi.'}
      ]},
    {t:'quiz',id:'q1b',q:'Perché chiedere al modello di &laquo;ragionare passo per passo&raquo; migliora i compiti complessi?',
      opts:[
        {tx:'Perché il modello si concentra meglio quando gliene si fa richiesta',ok:false,why:'Metafora suggestiva ma fuorviante: non esiste uno &laquo;sforzo&raquo; attivabile a comando. Il meccanismo è più concreto.'},
        {tx:'Perché i token generati sono lo spazio in cui il calcolo si distribuisce',ok:true,why:'Corretto. Generando passaggi intermedi il modello spalma il calcolo su più passi e può condizionarsi sui propri risultati parziali. Senza quel testo, deve arrivare alla conclusione in un colpo solo.'},
        {tx:'Perché attiva un modulo di ragionamento simbolico interno',ok:false,why:'Non esiste un modulo simbolico separato. Resta predizione del token successivo: cambia solo quanto spazio ha per svolgersi.'},
        {tx:'Perché riduce il numero di token consumati',ok:false,why:'È il contrario: consuma più token in output. È un compromesso costo/qualità consapevole.'}
      ]},

    {t:'exercise',id:'ex1',label:'Esercizio 1.1 — Da vago a operativo (8 minuti)',
      prompt:'Prendi questo prompt reale e riscrivilo. Prompt di partenza: «Riassumi questa email e dimmi cosa fare.» Elenca prima le informazioni che mancano al modello per fare bene il lavoro, poi scrivi la tua versione.',
      placeholder:'Informazioni mancanti:\n1. Chi leggerà il riassunto e con quale scopo\n2. ...\n\nPrompt riscritto:\n...',
      solution:`<p><strong>Cosa manca al modello</strong> (le domande che un collega umano ti farebbe prima di iniziare):</p>
        <ul><li>Chi legge il riassunto, con che livello di dettaglio e quanto tempo ha.</li>
        <li>Che decisione deve supportare: rispondere? inoltrare? aprire una pratica?</li>
        <li>Che cosa conta come &laquo;cosa fare&raquo;: azioni per me, per il mittente, scadenze?</li>
        <li>Lunghezza e formato attesi.</li>
        <li>Come comportarsi se l’email &egrave; ambigua o incompleta.</li></ul>
        <p><strong>Una riscrittura possibile:</strong></p>
        <pre><code>Sei l'assistente di un responsabile del servizio clienti che smaltisce
la posta la mattina in 15 minuti.

Analizza l'email delimitata da &lt;email&gt; e produci:

1. CONTESTO — 1 frase: chi scrive e perche'.
2. RICHIESTA — cosa vuole esattamente, in massimo 2 frasi.
3. SCADENZE — date o termini citati; se assenti scrivi "nessuna".
4. AZIONI — massimo 3 voci, ognuna nella forma
   "[verbo all'infinito] ... — responsabile: [io | mittente | altro ufficio]".
5. RISCHIO — alto/medio/basso, con mezza riga di motivazione.

Regole:
- Usa solo informazioni presenti nell'email. Non inferire dati mancanti.
- Se un punto non e' determinabile, scrivi "non determinabile dall'email".
- Massimo 150 parole in totale. Nessun preambolo.

&lt;email&gt;
{{TESTO_EMAIL}}
&lt;/email&gt;</code></pre>
        <p>Nota che la versione riscritta &egrave; molto pi&ugrave; lunga dell’originale, ma <strong>pu&ograve; essere riusata mille volte</strong>: il costo di scrittura si ammortizza, e soprattutto l’output diventa <em>prevedibile</em> &mdash; quindi verificabile.</p>`}
  ]
});

/* ---------- 2. Best practices ---------- */
MODULES.push({
  id:'m2', n:'02', title:'Prompt best practices', min:50,
  blocks:[
    {t:'p',html:`<p>Le tecniche che seguono sono ordinate per <strong>rapporto tra beneficio e sforzo</strong>. Le prime cinque risolvono la grande maggioranza dei problemi reali; le ultime servono quando stai spremendo l’ultimo 10% di qualit&agrave;. Applicarle tutte a un prompt banale &egrave; uno spreco: il criterio &egrave; sempre &laquo;quale fallimento sto cercando di prevenire?&raquo;.</p>`},

    {t:'p',html:`<h3>1 &middot; Sii esplicito su compito, destinatario e scopo</h3>
      <p>Il difetto pi&ugrave; comune non &egrave; la lunghezza: &egrave; la <strong>reticenza</strong>. Chiediti che cosa sa un tuo collega esperto che il modello non pu&ograve; sapere: chi legger&agrave;, a che scopo, che cosa &egrave; ovvio nel tuo settore, che cosa &egrave; vietato. Tutto quel materiale &egrave; contesto mancante. Un buon test: se dessi solo questo testo a un neoassunto competente ma nuovo, riuscirebbe a fare il lavoro? Se no, il prompt &egrave; incompleto.</p>

      <h3>2 &middot; Struttura il prompt con delimitatori</h3>
      <p>Separa <em>istruzioni</em>, <em>dati</em>, <em>esempi</em> e <em>formato</em>. I tag in stile XML funzionano particolarmente bene &mdash; <code>&lt;documento&gt;</code>, <code>&lt;esempi&gt;</code>, <code>&lt;regole&gt;</code> &mdash; perch&eacute; delimitano senza ambiguit&agrave; e ti permettono poi di <em>riferirti</em> alle sezioni (&laquo;usa solo i fatti in <code>&lt;documento&gt;</code>&raquo;). Il beneficio collaterale &egrave; per te: un prompt strutturato &egrave; un prompt manutenibile.</p>

      <h3>3 &middot; Metti i dati lunghi prima, l’istruzione dopo</h3>
      <p>Con contesti lunghi (un contratto, venti pagine di verbali) l’ordine conta: <strong>prima il materiale, poi la domanda</strong>. Questo evita che l’istruzione resti sepolta a met&agrave; e sfrutta la maggiore salienza della parte finale del contesto. Nei casi difficili &egrave; utile ripetere il vincolo pi&ugrave; importante anche in chiusura.</p>

      <h3>4 &middot; Specifica il formato di output mostrandolo</h3>
      <p>&laquo;Rispondi in modo strutturato&raquo; non &egrave; una specifica. Uno schema esplicito &mdash; o meglio un esempio compilato &mdash; s&igrave;. Se l’output deve essere consumato da un programma, definisci il formato con precisione e dichiara il comportamento nei casi limite (campo assente, valore ignoto). Se ti serve JSON pulito, chiedi esplicitamente nessun testo prima e dopo.</p>

      <h3>5 &middot; Dai esempi (few-shot) che coprano i casi limite</h3>
      <p>Gli esempi sono il modo pi&ugrave; efficiente di comunicare un giudizio difficile da verbalizzare (&laquo;questo tono s&igrave;, questo no&raquo;). Tre regole: da 2 a 5 esempi bastano quasi sempre; devono essere <strong>diversi</strong> tra loro e includere i casi scomodi (input vuoto, ambiguo, fuori perimetro); devono essere <strong>coerenti</strong> col formato richiesto, perch&eacute; il modello imita gli esempi pi&ugrave; delle istruzioni. Un esempio sbagliato fa pi&ugrave; danni di dieci righe di regole.</p>`},
    {t:'callout',kind:'bad',title:'Il conflitto silenzioso',html:`Se le tue istruzioni dicono &laquo;massimo 50 parole&raquo; e i tuoi esempi ne hanno 200, vincono gli esempi. Ogni volta che modifichi le istruzioni, rileggi gli esempi.`},
    {t:'p',html:`<h3>6 &middot; Lascia spazio al ragionamento, poi separa la risposta</h3>
      <p>Per compiti multi-passo (calcoli, confronti, classificazioni sfumate) chiedi al modello di ragionare <em>prima</em>, in una sezione dedicata, e di dare la risposta finale in una sezione separata e facilmente estraibile. Cos&igrave; ottieni la qualit&agrave; del ragionamento senza sporcare l’output. Attenzione al rovescio: se il formato non lascia spazio di ragionamento (&laquo;rispondi solo con SI o NO&raquo;), stai chiedendo un giudizio istantaneo &mdash; accettabile per compiti facili, rischioso per quelli difficili.</p>

      <h3>7 &middot; Di’ cosa fare, non cosa non fare</h3>
      <p>&laquo;Non essere prolisso&raquo; &egrave; un vincolo negativo: definisce un vastissimo spazio di cose sbagliate senza indicare la direzione. &laquo;Massimo 3 frasi, indicativo presente, nessun preambolo&raquo; &egrave; un vincolo positivo e verificabile. Le liste di divieti hanno anche un effetto collaterale: attirano attenzione sul tema che vorresti evitare.</p>

      <h3>8 &middot; Governa i casi limite in modo esplicito</h3>
      <p>&Egrave; qui che si distingue un prompt da laboratorio da uno di produzione. Che deve fare il modello se l’informazione non c’&egrave;? Se la domanda &egrave; fuori perimetro? Se i dati si contraddicono? Definisci un’uscita esplicita &mdash; <code>NON_DETERMINABILE</code>, &laquo;chiedi chiarimenti&raquo;, &laquo;escala all’operatore&raquo; &mdash; altrimenti il modello, che &egrave; addestrato a essere utile, riempir&agrave; il vuoto con qualcosa di plausibile.</p>

      <h3>9 &middot; Assegna un ruolo quando serve un registro</h3>
      <p>Il role prompting funziona quando cambia davvero il modo di guardare il problema (&laquo;revisore che cerca clausole svantaggiose per il cliente&raquo;) e serve a poco quando &egrave; decorativo (&laquo;sei un assistente utilissimo&raquo;). Usalo per orientare <em>criterio</em> e <em>tono</em>, non come formula magica.</p>

      <h3>10 &middot; Usa il prefill per forzare il formato</h3>
      <p>Nelle API puoi iniziare tu il turno dell’assistente. Se il messaggio dell’assistente comincia con <code>{</code>, la risposta continuer&agrave; in JSON e non con &laquo;Certo, ecco&hellip;&raquo;. &Egrave; il modo pi&ugrave; economico per eliminare preamboli e stabilizzare il formato.</p>

      <h3>11 &middot; Un compito per chiamata (concatena, non accumulare)</h3>
      <p>Un prompt che estrae + classifica + traduce + riassume fallisce in modo confuso: non capisci quale sottocompito &egrave; andato male. Spezzare in passaggi concatenati costa qualche chiamata in pi&ugrave; ma ti d&agrave; punti di controllo diagnosticabili e riusabili.</p>

      <h3>12 &middot; Itera su casi reali, non immaginari</h3>
      <p>La miglior best practice &egrave; metodologica: raccogli 10&ndash;20 input veri, con difficolt&agrave; assortita, e giudica ogni modifica su quelli. Senza questo, &laquo;migliorare il prompt&raquo; &egrave; solo cambiare il prompt. &Egrave; il ponte verso il modulo successivo.</p>`},

    {t:'compare',title:'Prima / dopo su un caso reale',
      bad:{h:'Prompt originale',code:`Analizza queste segnalazioni e dimmi quali sono urgenti.`},
      good:{h:'Prompt riscritto',code:`Sei un analista del supporto tecnico di un gestionale sanitario.
Classifichi le segnalazioni per il triage del mattino: la tua
classificazione decide chi viene chiamato entro un'ora.

<criteri>
CRITICA  = servizio non utilizzabile, o dato clinico a rischio,
           o piu' di 10 utenti bloccati.
ALTA     = funzione chiave degradata con workaround noto.
MEDIA    = disagio operativo senza blocco.
BASSA    = estetica, richiesta di miglioria, dubbio d'uso.
</criteri>

<segnalazioni>
{{ELENCO}}
</segnalazioni>

Per ogni segnalazione ragiona brevemente in <analisi>, poi emetti
una riga in <output> nel formato:
ID | LIVELLO | motivazione (max 12 parole) | dato_mancante_per_decidere

Regole:
- Applica solo i <criteri>: non usare il tono del segnalante come indizio.
- Se mancano informazioni per scegliere fra due livelli, scegli il
  piu' grave dei due e indicalo in dato_mancante_per_decidere.
- Nessun testo fuori da <analisi> e <output>.`}},
    {t:'callout',kind:'ok',title:'Che cosa è cambiato, in ordine di impatto',html:`Ruolo <em>e</em> conseguenza della decisione (1) &middot; criteri espliciti al posto di &laquo;urgenti&raquo; (1, 8) &middot; struttura con tag (2) &middot; formato mostrato (4) &middot; spazio di ragionamento separato dall’output (6) &middot; regola positiva contro un bias noto, il tono del segnalante (7) &middot; comportamento definito in caso di incertezza (8).`},

    {t:'promptlab'},

    {t:'quiz',id:'q2a',q:'Nel tuo prompt le istruzioni chiedono &laquo;massimo 3 righe, tono neutro&raquo;, ma i tre esempi few-shot sono paragrafi discorsivi da 10 righe. Cosa succede?',
      opts:[
        {tx:'Il modello media fra istruzioni ed esempi, producendo ~6 righe',ok:false,why:'A volte accade, ma non è il fenomeno principale né quello su cui puoi contare.'},
        {tx:'Il modello tende a seguire gli esempi e ignorare il vincolo',ok:true,why:'Corretto. La dimostrazione è un segnale molto più forte della descrizione: il modello imita il pattern che vede. È il difetto più sottovalutato nei prompt reali — e la prima cosa da controllare quando un vincolo di formato viene ignorato.'},
        {tx:'Le istruzioni prevalgono perché sono più vicine all’inizio',ok:false,why:'La posizione conta, ma non ribalta la forza della dimostrazione. Un esempio incoerente resta un bug.'},
        {tx:'Dipende solo dalla temperature',ok:false,why:'La temperature governa la variabilità, non quale segnale prevale.'}
      ]},
    {t:'quiz',id:'q2b',q:'Vuoi che un’applicazione riceva JSON pulito, senza &laquo;Certo, ecco il risultato:&raquo; davanti. Qual è la leva più affidabile ed economica?',
      opts:[
        {tx:'Scrivere IN MAIUSCOLO &laquo;SOLO JSON&raquo; e ripeterlo tre volte',ok:false,why:'Aiuta un po’ ma resta fragile, e appesantisce il prompt. La ripetizione enfatica è un ripiego, non un meccanismo.'},
        {tx:'Fare il prefill del turno assistente con la graffa aperta',ok:true,why:'Esatto. Se l’assistente ha già emesso <code>{</code>, la continuazione più probabile è JSON: il preambolo diventa quasi impossibile. Costa zero token aggiuntivi ed è la tecnica più diretta — dove l’API la supporta.'},
        {tx:'Abbassare max_tokens per troncare il preambolo',ok:false,why:'Tronca la fine, non l’inizio: otterresti JSON incompleto. Peggiora il problema.'},
        {tx:'Aumentare la temperature per uscire dal formato conversazionale',ok:false,why:'Aumenta la variabilità, quindi rende il formato meno prevedibile, non più.'}
      ]},

    {t:'exercise',id:'ex2',label:'Esercizio 2.1 — Progetta i tuoi esempi few-shot (10 minuti)',
      prompt:'Per il tuo caso d’uso del warm-up, scrivi 3 esempi input→output. Vincolo: il primo su un caso tipico, il secondo su un caso limite (dato mancante, ambiguo, fuori perimetro), il terzo su un caso che oggi il modello sbaglierebbe. Rispetta lo stesso formato in tutti e tre.',
      placeholder:'ESEMPIO 1 (tipico)\nInput: ...\nOutput: ...\n\nESEMPIO 2 (caso limite: manca la data)\nInput: ...\nOutput: ...\n\nESEMPIO 3 (caso oggi sbagliato)\nInput: ...\nOutput: ...',
      solution:`<p>Criteri di autovalutazione &mdash; rileggi i tuoi tre esempi e verifica:</p>
        <ul>
          <li><strong>Coerenza rigida di formato.</strong> Stessi campi, stesso ordine, stessa punteggiatura, stessa lunghezza indicativa. Ogni difformit&agrave; verr&agrave; imitata.</li>
          <li><strong>Diversit&agrave; reale.</strong> Se i tre esempi si assomigliano, stai insegnando un solo caso tre volte.</li>
          <li><strong>Il caso limite mostra l’uscita esplicita.</strong> L’esempio 2 deve <em>dimostrare</em> come si dice &laquo;non lo so&raquo;: <code>NON_DETERMINABILE</code>, campo vuoto, richiesta di chiarimento.</li>
          <li><strong>Nessun ragionamento implicito.</strong> Se l’output dell’esempio 3 richiede un passaggio non ovvio, o lo espliciti in una sezione di ragionamento, o l’esempio insegna a indovinare.</li>
          <li><strong>Sono output che accetteresti in produzione.</strong> Gli esempi sono la tua definizione di qualit&agrave;: se non li firmeresti, riscrivili.</li>
        </ul>`},

    {t:'checklist',id:'ck2',title:'Checklist operativa — revisione di un prompt',
      items:[
        'Compito, destinatario e scopo sono espliciti',
        'Istruzioni, dati ed esempi sono separati da delimitatori',
        'I dati lunghi precedono la domanda; il vincolo chiave è ripetuto in chiusura',
        'Il formato di output è mostrato, non solo descritto',
        'Ci sono 2–5 esempi diversi tra loro, coerenti col formato',
        'C’è spazio di ragionamento separato dalla risposta finale (se il compito lo richiede)',
        'I vincoli sono positivi e verificabili, non divieti generici',
        'I casi limite hanno un comportamento definito (uscita esplicita per «non lo so»)',
        'Il prompt fa una cosa sola; il resto è concatenato',
        'Esiste un set di 10–20 casi reali su cui valutare le modifiche'
      ]}
  ]
});
