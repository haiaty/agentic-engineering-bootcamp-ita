<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Agents — Teoria e laboratorio · Programma 4 ore</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel-2:#f1f1ee; --text:#1c1c1a; --muted:#6b6b63;
  --line:#e2e2dc; --accent:#c2451f; --accent-soft:#fdefe9; --ok:#1f7a4d; --ok-soft:#e8f5ee;
  --warn:#8a5a00; --warn-soft:#fdf3e0; --bad:#a52020; --bad-soft:#fbeaea;
  --code-bg:#1e1e1c; --code-text:#f0efe9; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141413; --panel:#1e1e1c; --panel-2:#26261f; --text:#f0efe9; --muted:#a3a39a;
  --line:#33332c; --accent:#e8825c; --accent-soft:#2e211c; --ok:#5ec48d; --ok-soft:#17281f;
  --warn:#e0b45f; --warn-soft:#2a2318; --bad:#e88b8b; --bad-soft:#2b1a1a;
  --code-bg:#0f0f0e; --code-text:#e8e7e1; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 18px;
}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}
.pill{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.pill.ghost{background:transparent}
.pill:hover{border-color:var(--accent)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress-wrap{width:100%;height:3px;background:var(--panel-2)}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

.shell{display:grid;grid-template-columns:274px minmax(0,1fr);gap:0;align-items:start}
nav.side{
  position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg);
}
nav.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 8px 8px}
.navitem{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;
  color:var(--text);padding:8px 10px;border-radius:9px;margin-bottom:2px;line-height:1.35;
}
.navitem:hover{background:var(--panel-2)}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none;padding-top:2px}
.navitem.active .idx{color:var(--accent)}
.navitem .nt{font-size:13.5px}
.navitem .nm{font-size:11px;color:var(--muted);display:block}
.navitem .tick{margin-left:auto;color:var(--ok);font-size:12px;flex:none}

main{padding:30px 34px 90px;max-width:920px;margin:0 auto;width:100%}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:31px;line-height:1.18;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:21px;letter-spacing:-.01em;margin:38px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:24px 0 8px}
.lede{color:var(--muted);font-size:15px;margin:0 0 4px}
.prose{font-size:15px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:12px 0;padding-left:22px}
.prose li{margin:6px 0}
.prose strong{font-weight:650}
code{font-family:var(--mono);font-size:.875em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
pre{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:var(--radius);overflow-x:auto;font-size:12.5px;line-height:1.55;margin:14px 0}
pre code{background:none;border:0;padding:0;color:inherit;font-size:12.5px}

.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:13px 16px;margin:16px 0;font-size:14px;box-shadow:var(--shadow)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout .ct{display:block;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.grid{display:grid;gap:12px;margin:16px 0}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card h5{margin:0 0 5px;font-size:13.5px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tablewrap table{margin:0}

/* ---------- widgets ---------- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:20px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.widget-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;flex:none}
.widget-t{font-weight:650;font-size:15px}
.widget-s{color:var(--muted);font-size:13.5px;margin:2px 0 14px}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:10px 13px;margin-bottom:7px;font-size:14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-ok{border-color:var(--ok)}
.opt .mk{font-family:var(--mono);font-weight:700;margin-right:8px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin-top:6px;padding-left:2px;display:none}
.opt.shown .why{display:block}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:6px;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;flex:none;accent-color:var(--accent);width:15px;height:15px}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .lb{font-weight:600}
.chk .ds{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-h{padding:7px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pane.bad .pane-h{background:var(--bad-soft);color:var(--bad)}
.pane.ok .pane-h{background:var(--ok-soft);color:var(--ok)}
.pane pre{margin:0;border-radius:0;max-height:340px}

.bp{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:14px 16px;margin-bottom:10px}
.bp-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:15px}
.bp-n{font-family:var(--mono);font-size:12px;color:var(--accent);flex:none}
.bp-why{font-size:13.5px;color:var(--muted);margin:6px 0 10px}
.bp-ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.bp-ex>div{border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5}
.bp-ex .do{background:var(--ok-soft);border-left:3px solid var(--ok)}
.bp-ex .dont{background:var(--bad-soft);border-left:3px solid var(--bad)}
.bp-ex b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.bp-ex .do b{color:var(--ok)}
.bp-ex .dont b{color:var(--bad)}

.preview{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:400px;overflow-y:auto;min-height:80px}
.meter{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scoreline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-family:var(--mono)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--mono)}
.tab:hover{border-color:var(--accent)}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

textarea,input[type="text"],select{
  width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fl{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:.3s}
.saved.on{opacity:1}

.sorter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:7px}
.sorter-row .it{flex:1 1 240px;font-size:13.5px}
.sorter-row .bs{display:flex;gap:5px;flex:none}
.bbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:650}
.bbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sorter-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.sorter-row.bad{border-color:var(--bad);background:var(--bad-soft)}
.sorter-row .fb{flex:1 1 100%;font-size:12.5px;color:var(--muted);display:none}
.sorter-row.done .fb{display:block}

.diag{margin-top:12px;font-size:13.5px}
.diag div{padding:6px 0;border-top:1px dashed var(--line)}

/* ---------- ciclo dell'agente ---------- */
.loopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.lstep{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 11px;font-size:13px;opacity:.45;transition:.2s}
.lstep.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.lstep.past{opacity:.85}
.lstep b{display:block;font-size:11px;font-family:var(--mono);color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.lstep span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}

/* ---------- builder file di contesto ---------- */

.footnav{display:flex;justify-content:space-between;gap:10px;margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}
.timerbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 24px}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:290px}
  main{padding:22px 16px 70px}
  h1{font-size:25px}
}
@media print{
  nav.side,header.top,.footnav,.btnrow{display:none}
  main{max-width:none;padding:0}
  .widget,.card,.callout{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span><span>Coding Agents<small>Programma formativo — 4 ore, teoria + laboratorio su codice vero</small></span></div>
  <div class="spacer"></div>
  <div class="timerbox">
    <button class="pill ghost" id="timerBtn">▶ Avvia timer</button>
    <span class="pill clock" id="clock">00:00:00 / 4:00:00</span>
  </div>
  <button class="pill ghost" id="exportBtn" title="Scarica risposte e note in Markdown">⬇ Esporta</button>
  <button class="pill ghost" id="themeBtn" title="Tema chiaro/scuro">◐</button>
</header>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

<div class="shell">
  <nav class="side">
    <h4>Programma</h4>
    <div id="nav"></div>
    <h4 style="margin-top:18px">Avanzamento</h4>
    <div style="padding:0 10px;font-size:12.5px;color:var(--muted)" id="statsBox"></div>
    <div style="padding:10px">
      <button class="btn" id="resetBtn" style="width:100%;font-size:12px">Azzera avanzamento</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   STATO + PERSISTENZA
   ============================================================ */
const NS = 'agc8h.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} },
  clearAll(){ try{ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};
let current = store.get('current', 0);
let done = store.get('done', {});
let answers = store.get('answers', {});
let quizState = store.get('quiz', {});

function saveAll(){ store.set('done', done); store.set('answers', answers); store.set('quiz', quizState); }

/* ============================================================
   CONTENUTI
   ============================================================ */
const MODULES = [];

/* ---------- 0. Apertura ---------- */
MODULES.push({
  id:'m0', n:'00', title:'Apertura', min:5,
  blocks:[
    {t:'p',html:`<p>Il corso è diviso in due metà. Nella prima impari come funziona e ti alleni su script piccoli, dove se sbagli non succede niente. Nella seconda lavori su una repo vera del tuo lavoro: capire, analizzare, aggiungere, testare, debuggare.</p>`},
    {t:'cards',cards:[
      {tag:'Ora 1',h:'Teoria',p:'Cosa sono, quali sono, i file che leggono (AGENTS.md e CLAUDE.md), le skill.'},
      {tag:'Ora 2',h:'Primi task',p:'Installare Pi e fare le prime prove, in sessione e con un solo comando.'},
      {tag:'Ora 3',h:'Codice vero',p:'Capire un progetto sconosciuto, aggiungere una funzionalità nuova.'},
      {tag:'Ora 4',h:'Lavoro vero',p:'Test di concorrenza, un test BDD, debug da log e payload.'}
    ]},
    {t:'table',head:['Blocco','Durata'],rows:[
      ['00 · Apertura','5 min'],
      ['01 · Cosa sono i coding agent','18 min'],
      ['02 · I file che l\'agente legge: AGENTS.md e CLAUDE.md','22 min'],
      ['03 · Le skill','14 min'],
      ['04 · Task 1 — Installare Pi','12 min'],
      ['— Pausa','10 min'],
      ['05 · Task 2 — Capire un progetto vero','28 min'],
      ['06 · Task 3 — Aggiungere funzionalità: Salvare il tracing di esecuzione','22 min'],
      ['07 · Task 4 — Script di test con concorrenza','14 min'],
      ['08 · Task 5 — Un test BDD','14 min'],
      ['09 · Task 6 — Debug da log e payload','20 min'],
      ['11 · Chiusura','11 min']
    ]},
    {t:'callout',kind:'ok',title:'Come si usa questo materiale',html:`Naviga con la barra a sinistra o con i pulsanti in fondo a ogni modulo. Ogni esercizio si salva da solo nel browser (niente esce dal tuo computer): puoi chiudere e riprendere. Con <strong>&#8681; Esporta</strong> scarichi tutte le tue risposte in un file Markdown. Il timer in alto serve al docente per tenere il ritmo.`},
    {t:'p',html:`<h3>Cosa devi saper fare a fine giornata</h3>
      <ol>
        <li>Spiegare con parole tue cosa fa un coding agent e dove sbaglia di più.</li>
        <li>Scrivere un <code>AGENTS.md</code> o <code>CLAUDE.md</code> corto e utile per un progetto tuo.</li>
        <li>Capire quando serve una skill e come si scrive.</li>
        <li>Usare Pi sia in sessione sia con un solo comando dal terminale.</li>
        <li>Far capire all'agente un progetto che non conosce, e verificare che abbia capito davvero.</li>
        <li>Farti aiutare su un fix, un test e un debug, controllando il risultato passo per passo.</li>
      </ol>`}
  ]
});

/* ---------- 1. Cosa sono i coding agent ---------- */
MODULES.push({
  id:'m1', n:'01', title:'Cosa sono i coding agent', min:24,
  blocks:[
    {t:'p',html:`
      <p>Un <strong>coding agent</strong> è un programma che riceve un compito scritto a parole, <strong>legge i file del tuo progetto, lancia comandi sul tuo computer, scrive o modifica codice, guarda cosa è successo e riprova</strong> finché il compito è finito o finché si ferma a chiederti qualcosa.</p>
      <p>Dentro c'è un modello linguistico, ma il modello da solo non basta. Servono tre pezzi:</p>`},
    {t:'cards',cards:[
      {tag:'1',h:'Il modello',p:'Decide cosa fare al passo successivo. Non fa nulla da solo: dice solo "adesso leggi questo file".'},
      {tag:'2',h:'Gli strumenti',p:'Leggi file, scrivi file, cerca nel codice, lancia un comando di shell, apri una pagina web.'},
      {tag:'3',h:'Il ciclo',p:'Il programma esegue lo strumento, rimanda il risultato al modello e riparte. Finché non ha finito.'}
    ]},
    {t:'p',html:`<p>Una chat risponde una volta e si ferma. Un agente <strong>va avanti da solo</strong>: se un test fallisce lo legge, capisce perché e riprova. Se un file non esiste lo cerca altrove. Ogni giro costa tempo e token, ma il lavoro lo porta avanti lui.</p>`},
    {t:'agentloop'},
    {t:'p',html:`<p>Lo stesso ciclo, scritto in codice. È una versione semplificata in Node.js, ma la struttura è davvero questa in tutti gli agenti:</p>`},
    {t:'code',lang:'javascript',code:`// Gli strumenti: funzioni normali che il modello puo' chiedere di usare
const tools = {
  leggi_file: ({ path }) => fs.readFileSync(path, 'utf8'),
  scrivi_file: ({ path, testo }) => fs.writeFileSync(path, testo),
  shell: ({ comando }) => execSync(comando, { encoding: 'utf8' }),
};

async function agente(compito) {
  const messaggi = [{ role: 'user', content: compito }];

  while (true) {
    // 1. Il modello legge tutta la conversazione e decide il passo dopo
    const risposta = await modello.chiama({ messaggi, tools });
    messaggi.push(risposta);

    // 2. Nessuno strumento richiesto: ha finito, risponde e si ferma
    if (!risposta.tool_call) return risposta.testo;

    // 3. Il programma (non il modello) esegue lo strumento richiesto
    const { nome, argomenti } = risposta.tool_call;
    let risultato;
    try {
      risultato = tools[nome](argomenti);
    } catch (err) {
      risultato = 'ERRORE: ' + err.message; // anche l'errore torna al modello
    }

    // 4. Il risultato torna nella conversazione, e si ricomincia
    messaggi.push({ role: 'tool', content: risultato });
  }
}

agente('I test in test/ falliscono: trova il motivo e correggilo.');`},

    {t:'p',html:`<h3>Il punto delicato: lancia comandi veri</h3>
      <p>Un agente può cancellare file, fare <code>git reset</code>, mandare richieste in rete, toccare un database. Non è teoria: succede. Tre regole che valgono sempre, da oggi in poi:</p>
      <ul>
        <li><strong>Git pulito prima di iniziare.</strong> Se parti con <code>git status</code> pulito, qualunque cosa faccia l'agente la vedi nel diff e la butti via con un comando.</li>
        <li><strong>Mai su dati veri.</strong> Database di sviluppo, chiavi di test, ambienti finti. Se l'agente deve toccare un database, che sia una copia.</li>
        <li><strong>Leggi prima di approvare.</strong> Quando ti chiede il permesso di lanciare un comando, guardalo davvero. Il momento in cui smetti di leggere è il momento in cui ti fai male.</li>
      </ul>`},
    {t:'callout',kind:'bad',title:'La modalità "approva tutto"',html:`Tutti gli agenti hanno un'opzione per non chiedere mai il permesso. Serve, ma <strong>solo dentro un contenitore isolato o su una copia usa e getta</strong> del progetto. Usarla sul tuo computer di lavoro, sulla repo vera, è il modo più rapido per perdere un pomeriggio.`},

    {t:'p',html:`<h3>Sicurezza: quanto danno può fare, al massimo</h3>
      <p>L'agente lancia i comandi <strong>con i tuoi permessi</strong>: vede i file che vedi tu, legge le variabili d'ambiente della tua shell, usa le credenziali salvate sul tuo computer. E può sbagliare in due modi: per errore suo, oppure perché è stato <strong>manipolato da un testo che ha letto</strong> (un README, una issue, una pagina web, il commento in un file) con dentro istruzioni nascoste. Si chiama <em>prompt injection</em>, e non esiste ancora un modo per evitarla del tutto.</p>
      <p>Quindi la domanda giusta non è «si comporterà bene?», ma: <strong>se va storto, quanto danno può fare?</strong> Il danno massimo che può fare si chiama <em>blast radius</em>, e lo decidi tu prima di iniziare, con tre leve.</p>`},
    {t:'cards',cards:[
      {tag:'Sandbox',h:'Dove gira',p:'Un contenitore, una VM o la sandbox integrata nell\'agente. Vede solo la cartella del progetto, non il resto del disco, e la rete è limitata. Quello che succede lì dentro resta lì dentro.'},
      {tag:'Permessi',h:'Cosa può fare senza chiedere',p:'Leggere e lanciare i test sì. Push, installazioni, cancellazioni e comandi sul database solo con la tua conferma. Alcune cose mai, neanche su richiesta.'},
      {tag:'Credenziali',h:'A cosa può arrivare',p:'Solo chiavi di sviluppo, con dati finti e permessi minimi. Una chiave che l\'agente non ha non la può usare male, né per errore né perché qualcuno lo ha manipolato.'}
    ]},

      opts:[
        {tx:'Perché i file lunghi sono difficili da leggere per le persone',ok:false,why:'Vero ma secondario. Il motivo forte riguarda come l\'agente usa quel file.'},
        {tx:'Perché viene riletto per intero a ogni richiesta: costa sempre e annega le poche righe che contano',ok:true,why:'Esatto. È un peso fisso su ogni messaggio. Più righe di contorno ci sono, meno peso hanno le tre regole che davvero cambiano il comportamento.'},
        {tx:'Perché gli agenti leggono solo le prime 100 righe',ok:false,why:'Non è vero: lo leggono tutto. Il problema non è che non lo leggono, è che l\'attenzione si distribuisce.'},
        {tx:'Perché altrimenti non entra nella finestra di contesto',ok:false,why:'Una pagina in più non satura nulla. Il danno si vede molto prima del limite tecnico.'}
      ]},
    {t:'quiz',id:'q2b',q:'Quale di queste righe merita davvero di stare in AGENTS.md?',
      opts:[
        {tx:'«Scrivi sempre codice leggibile e ben strutturato.»',ok:false,why:'Non si può verificare e non cambia niente: è rumore che diluisce le righe utili.'},
        {tx:'«Il progetto è nato nel 2019 ed è stato riscritto nel 2021.»',ok:false,why:'Storia. Non aiuta a fare nessun compito.'},
        {tx:'«Usa pnpm, non npm: i due lockfile vanno in conflitto e la build salta.»',ok:true,why:'Perfetta: concreta, verificabile, e spiega la conseguenza. Senza questa riga l\'agente userebbe npm perché è il default del mondo.'},
        {tx:'«La struttura completa delle cartelle, con tutti i file elencati.»',ok:false,why:'Invecchia in una settimana e l\'agente sa già cercare da solo. Bastano le 4 cartelle che contano.'}
      ]},
    {t:'exercise',id:'ex2',label:'Esercizio 2.1 — Scrivi il tuo AGENTS.md (6 minuti)',
      prompt:'Per il progetto su cui lavorerai nella seconda parte, scrivi un AGENTS.md vero. Massimo 25 righe. Tre sezioni: Comandi, Mappa, Regole. Solo cose che sai per certo.',
      placeholder:'# AGENTS.md\n\n## Comandi\n...\n\n## Mappa\n- Entry point: ...\n\n## Regole\n- ...',
      solution:'Controlla il tuo file con queste tre domande: <strong>1)</strong> ogni riga si può verificare guardando il codice, o è un buon proposito? <strong>2)</strong> c\'è almeno una trappola che un collega nuovo non indovinerebbe mai da solo? <strong>3)</strong> sta in una pagina? Se una regola ti è costata un bug in passato, scrivi accanto quale: le regole con un perché vengono seguite di più.'},
    {t:'checklist',id:'ck2',title:'Il file di contesto è fatto bene se...',
      items:[
        'Sta in una pagina (indicativamente sotto le 100 righe)',
        'I comandi ci sono, esatti e copiabili',
        'Dice da dove parte l\'applicazione e dove sta la logica vera',
        'Contiene almeno una trappola che non si indovina dal codice',
        'Ogni riga si può verificare: niente buoni propositi',
        'I documenti lunghi sono richiamati con una riga, non copiati dentro',
        'Non contiene chiavi, password o dati di clienti',
        'È in git e il team lo sa'
      ]}
  ]
});

/* ---------- 3. Le skill ---------- */
MODULES.push({
  id:'m3', n:'03', title:'Le skill', min:14,
  blocks:[
    {t:'p',html:`<h3>Da dove nasce il problema</h3>
      <p>Hai appena imparato che il file di contesto va tenuto corto. Ma ci sono cose lunghe che ogni tanto servono davvero: la procedura per fare una release, le dieci regole di stile per le nostre API, come si scrive un report di incidente da noi.</p>
      <p>Se le metti in <code>AGENTS.md</code> le paghi sempre, anche i giorni in cui nessuno fa una release. Se non le metti da nessuna parte, l'agente le inventa.</p>
      <p>Le <strong>skill</strong> risolvono proprio questo: sono istruzioni che stanno da parte e <strong>vengono caricate solo quando servono</strong>.</p>`},
    {t:'cards',cards:[
      {tag:'Sempre',h:'AGENTS.md / CLAUDE.md',p:'Poche righe, presenti a ogni messaggio. Il costo fisso.'},
      {tag:'Su richiesta',h:'Skill',p:'Cartelle di istruzioni. Sempre visibile solo il nome e una riga di descrizione.'},
      {tag:'Mai da sole',h:'docs/',p:'Documenti normali. Entrano solo se qualcuno (tu o l\'agente) li apre.'}
    ]},

    {t:'p',html:`<h3>Com'è fatta una skill</h3>
      <p>Una cartella con dentro un file <code>SKILL.md</code>. Sopra al file ci sono due campi obbligatori: il <strong>nome</strong> e la <strong>descrizione</strong>. Sotto, le istruzioni vere.</p>`},
    {t:'code',lang:'text',code:`.claude/skills/
  release/
    SKILL.md            <- nome, descrizione, istruzioni
    checklist.md        <- file di appoggio, letti solo se servono
    scripts/
      bump-version.sh   <- l'agente puo' anche solo lanciarlo`},
    {t:'code',lang:'markdown',code:`---
name: release
description: Procedura per pubblicare una nuova versione del pacchetto.
  Usala quando l'utente chiede di fare una release, pubblicare una
  versione, o preparare un changelog per il rilascio.
---

# Come si fa una release

1. Controlla che il branch sia main e che git sia pulito.
2. Lancia pnpm test e pnpm lint: devono passare entrambi.
3. Aggiorna la versione con ./scripts/bump-version.sh <maggiore|minore|patch>.
4. Genera il changelog dai commit dall'ultimo tag (vedi checklist.md
   per il formato esatto delle voci).
5. Crea il tag e fermati: la pubblicazione la fa la pipeline.

## Non fare mai
- Non pubblicare da un branch diverso da main.
- Non modificare a mano il campo version in package.json.`},

    {t:'callout',kind:'warn',title:'La descrizione è la parte più importante',html:`Di tutta la skill, l'unica cosa che l'agente ha davanti sempre è <strong>nome + descrizione</strong>. È su quella riga che decide se aprirla. Quindi la descrizione non deve dire <em>cos'è</em> la skill: deve dire <strong>quando usarla</strong>, con le parole che userebbe chi la chiede. Se scrivi «gestione release» non si attiverà quasi mai. Se scrivi «usala quando l'utente chiede di pubblicare una versione, fare una release, preparare un changelog», si attiva.`},

    {t:'p',html:`<h3>Il meccanismo, in tre livelli</h3>
      <p>È lo stesso principio dell'indice di un libro, portato all'estremo:</p>`},
    {t:'table',head:['Livello','Cosa entra nel contesto','Quando'],rows:[
      ['1','Nome + descrizione (una o due righe)','Sempre. Costa pochissimo.'],
      ['2','Il corpo di <code>SKILL.md</code>','Solo quando l\'agente decide che quella skill serve.'],
      ['3','I file di appoggio e gli script','Solo se il corpo dice di aprirli o lanciarli.']
    ]},
    {t:'p',html:`<p>Risultato: puoi avere venti skill da cinque pagine l'una e pagarne quaranta righe in tutto, finché non ne serve una.</p>`},

    {t:'p',html:`<h3>Dove si mettono</h3>`},
    {t:'code',lang:'text',code:`~/.claude/skills/<nome>/SKILL.md          tue, su tutti i progetti
<progetto>/.claude/skills/<nome>/SKILL.md  del progetto, in git,
                                           condivise con il team`},
    {t:'p',html:`<p>Le skill del progetto sono la cosa interessante per un team: <strong>metti in git il modo in cui da voi si fanno le cose</strong>, e vale per tutti quelli che lavorano sulla repo.</p>`},

    {t:'p',html:`<h3>Quando fare una skill e quando no</h3>`},
    {t:'table',head:['Se...','Allora'],rows:[
      ['È una regola breve che vale sempre','Una riga in <code>AGENTS.md</code>. Non serve una skill.'],
      ['È una procedura lunga che serve ogni tanto','<strong>Skill.</strong> È esattamente il caso giusto.'],
      ['È un compito che lanci tu, sempre uguale','Un comando personalizzato (slash command). Lo attivi tu, non l\'agente.'],
      ['È solo documentazione da leggere per capire','Un file in <code>docs/</code>, richiamato da <code>AGENTS.md</code>.'],
      ['Serve una connessione a un sistema esterno','Non è una skill: serve un server MCP (dà strumenti nuovi, non istruzioni).']
    ]},
    {t:'callout',kind:'',title:'Regola pratica',html:`Se ti accorgi che stai spiegando la stessa procedura all'agente per la terza volta, e la spiegazione è più lunga di dieci righe: <strong>quella è una skill</strong>. Scrivila una volta e non spiegarla mai più.`},

    {t:'p',html:`<h3>Come si scrive una skill buona</h3>
      <ul>
        <li><strong>Un compito, una skill.</strong> Se la descrizione ha una "e" in mezzo, probabilmente sono due skill.</li>
        <li><strong>Passi numerati, verbi all'imperativo.</strong> Non spiegare la teoria: dì cosa fare.</li>
        <li><strong>Metti la sezione "non fare mai".</strong> È quella che salva più spesso.</li>
        <li><strong>Se c'è uno script, chiama lo script.</strong> Un comando deterministico batte dieci righe di istruzioni.</li>
        <li><strong>Provala.</strong> Apri una sessione nuova, chiedi la cosa con parole normali e guarda se la skill si attiva da sola. Se non si attiva, il problema è la descrizione.</li>
      </ul>`},
    {t:'quiz',id:'q3a',q:'Qual è la differenza vera fra una riga in AGENTS.md e una skill?',
      opts:[
        {tx:'La skill può contenere più testo',ok:false,why:'Vero, ma è una conseguenza, non la differenza di fondo.'},
        {tx:'AGENTS.md è sempre nel contesto; della skill è sempre visibile solo la descrizione, il resto entra quando serve',ok:true,why:'Esatto. È una scelta su cosa paghi sempre e cosa paghi ogni tanto. Per questo le procedure lunghe e rare stanno bene nelle skill.'},
        {tx:'Le skill valgono per tutti i progetti, AGENTS.md solo per uno',ok:false,why:'Tutte e due possono stare sia nel progetto sia nella tua cartella personale.'},
        {tx:'Le skill possono lanciare comandi, AGENTS.md no',ok:false,why:'I comandi li lancia l\'agente in entrambi i casi. Una skill può però portarsi dietro degli script pronti.'}
      ]},
    {t:'quiz',id:'q3b',q:'Una tua skill non si attiva mai da sola. Da dove parti?',
      opts:[
        {tx:'Riscrivo le istruzioni dentro al corpo',ok:false,why:'Il corpo non c\'entra: se la skill non si apre, quel testo non è mai stato letto.'},
        {tx:'Riscrivo la descrizione dicendo quando usarla, con le parole che userebbe chi la chiede',ok:true,why:'Esatto. La descrizione è l\'unica cosa su cui l\'agente decide. Deve contenere i termini reali della richiesta, non il nome interno della procedura.'},
        {tx:'Sposto la skill nella cartella personale',ok:false,why:'Cambia solo dove vale, non se si attiva.'},
        {tx:'Aggiungo più file di appoggio',ok:false,why:'Peggiora e basta: quei file si leggono solo dopo che la skill si è aperta.'}
      ]},
    {t:'exercise',id:'ex3',label:'Esercizio 3.1 — Una skill del tuo lavoro (5 minuti)',
      prompt:'Pensa a una procedura che nel tuo team spieghi sempre a voce. Scrivi il nome, la descrizione (quando usarla) e i primi 5 passi.',
      placeholder:'name: ...\ndescription: Usala quando l\'utente chiede di ...\n\n1. ...\n2. ...\n3. ...\n\n## Non fare mai\n- ...',
      solution:'Prova la descrizione così: leggila e chiediti «se un collega mi chiedesse questa cosa, userebbe queste parole?». Se la tua descrizione dice «gestione del processo di onboarding tenant» ma il collega direbbe «devo aggiungere un cliente nuovo», la skill non si attiverà. Metti dentro tutte e due le formulazioni.'}
  ]
});

/* ---------- 4. Task 1: installare Pi ---------- */
MODULES.push({
  id:'m4', n:'04', title:'Task 1 — Installare Pi', min:12,
  blocks:[
    {t:'p',html:`<p>Nei laboratori usiamo <strong>Pi</strong>: è un agente da terminale leggero e si configura in pochi minuti. Chi ha già <strong>Claude Code</strong> può usare quello: i compiti sono identici, cambiano solo i nomi dei comandi. Nelle schede che seguono trovi sempre tutte e due le versioni.</p>`},
    {t:'callout',kind:'warn',title:'Prima di partire, controlla questi tre',html:`<code>node --version</code> deve dire <strong>18 o più</strong>. <code>git --version</code> deve rispondere qualcosa. E devi avere la <strong>chiave API</strong> (te la dà il docente). Se manca uno dei tre, fermati qui e sistemalo: senza, i moduli dopo non funzionano.`},

    {t:'p',html:`<h3>Passo 1 — Installare</h3>
      <p>Pi si installa come un qualsiasi pacchetto globale di Node:</p>`},
    {t:'code',lang:'bash',code:`# Pi
npm install -g <nome-pacchetto-pi>

# In alternativa, Claude Code
npm install -g @anthropic-ai/claude-code`},
    {t:'callout',kind:'',title:'Il nome esatto del pacchetto',html:`Il nome del pacchetto npm di Pi te lo dà il docente a inizio esercitazione (oppure lo trovi sul README ufficiale del progetto). La <strong>forma</strong> del comando è quella qui sopra e non cambia. Se l'installazione globale ti dà un errore di permessi, non usare <code>sudo</code>: configura una cartella npm tua, oppure lancia lo strumento con <code>npx</code> senza installarlo.`},

    {t:'p',html:`<h3>Passo 2 — Controllare che ci sia</h3>`},
    {t:'code',lang:'bash',code:`pi --version
# oppure
claude --version

# Se dice "command not found", la cartella dei pacchetti globali
# non e' nel PATH. Controlla dove sono finiti:
npm prefix -g`},

    {t:'p',html:`<h3>Passo 3 — La chiave API</h3>
      <p>Due modi. Il primo è una variabile d'ambiente: comoda, ma se la metti nel file di configurazione della shell resta scritta in chiaro sul disco.</p>`},
    {t:'code',lang:'bash',code:`# Solo per questa finestra di terminale (la piu' sicura in aula)
export ANTHROPIC_API_KEY="la-tua-chiave"

# Per renderla permanente (attenzione: resta scritta in chiaro)
echo 'export ANTHROPIC_API_KEY="la-tua-chiave"' >> ~/.zshrc
source ~/.zshrc`},
    {t:'p',html:`<p>Il secondo modo è l'accesso guidato al primo avvio: lanci lo strumento senza chiave e ti apre una pagina per fare login. Se la tua azienda usa un account aziendale, di solito è questa la strada giusta.</p>`},
    {t:'callout',kind:'bad',title:'Tre cose da non fare mai con la chiave',html:`Non metterla in un file dentro la repo. Non incollarla in una chat o in una issue. Non usare la chiave di produzione per esercitarti. Se ti scappa, <strong>revocala subito</strong> dal pannello: una chiave revocata è un fastidio, una chiave in giro è un problema.`},

    {t:'p',html:`<h3>Passo 4 — Primo avvio</h3>`},
    {t:'code',lang:'bash',code:`mkdir ~/prova-agente && cd ~/prova-agente
git init

pi          # oppure: claude

# Si apre la sessione. Scrivi:
> ciao, dimmi in che cartella sei e cosa vedi`},
    {t:'p',html:`<p>Se ti risponde citando la cartella giusta, hai finito: funziona. Se risponde in inglese e vuoi l'italiano, aggiungilo al tuo file personale (<code>~/.claude/CLAUDE.md</code>): <em>«Rispondi sempre in italiano.»</em></p>`},

    {t:'p',html:`<h3>I comandi della sessione che userai davvero</h3>
      <p>Cambiano un po' da strumento a strumento, ma questi cinque ci sono sempre. Vale la pena impararli ora, perché li userai tutto il giorno.</p>`},
    {t:'table',head:['Cosa vuoi fare','Come'],rows:[
      ['Fermarlo mentre lavora','<code>Esc</code> (o <code>Ctrl+C</code>). Serve più spesso di quanto pensi: se ha preso la strada sbagliata, fermalo subito.'],
      ['Ripulire e ricominciare','<code>/clear</code>. Fra un compito e l\'altro: il contesto vecchio confonde.'],
      ['Vedere quanto contesto hai usato','<code>/context</code> o <code>/status</code>, a seconda dello strumento.'],
      ['Uscire','<code>/exit</code> o <code>Ctrl+D</code>.'],
      ['Vedere i comandi disponibili','<code>/help</code>. Il primo da provare.']
    ]},
    {t:'callout',kind:'ok',title:'Abitudine da prendere subito',html:`<strong>Un compito, una sessione.</strong> Finito un compito, <code>/clear</code>. Il contesto sporco del compito precedente è una delle cause più frequenti di risposte strane: l'agente continua a ragionare su file che non c'entrano più.`},

    {t:'checklist',id:'ck4',title:'Task 1 completato quando...',
      items:[
        'node --version dice 18 o più',
        'Il comando dell\'agente risponde a --version',
        'La chiave API è configurata e non è dentro nessuna repo',
        'Ho aperto una sessione in una cartella di prova e mi ha risposto',
        'Ho provato /help e so come fermarlo (Esc) e come uscire',
        'So dove sta il mio file personale di contesto'
      ]},
    {t:'tablewrap',head:['Problema','Cosa succede','Cosa fare'],rows:[
      ['<code>command not found</code>','Installato ma non trovato','La cartella dei binari globali non è nel PATH. Guarda <code>npm prefix -g</code> e aggiungi <code>/bin</code> al PATH.'],
      ['<code>EACCES</code> in installazione','Permessi negati','Non usare <code>sudo</code>. Configura una cartella npm personale, oppure usa <code>npx</code>.'],
      ['<code>401</code> / <code>invalid api key</code>','Chiave sbagliata o non letta','Controlla con <code>echo $ANTHROPIC_API_KEY</code>. Spesso è uno spazio o un a capo copiato insieme alla chiave.'],
      ['<code>429</code>','Troppe richieste','Limite raggiunto. Aspetta, o usa un modello più piccolo per gli esercizi.'],
      ['Risponde in inglese','Nessuna preferenza impostata','Metti «Rispondi in italiano» nel tuo file personale di contesto.']
    ]}
  ]
});

MODULES.push({
  id:'brk', n:'—', title:'Pausa', min:10,
  blocks:[
    {t:'p',html:`<h1 style="font-size:26px;margin-top:10px">Pausa — 10 minuti</h1>
      <p class="lede">Al ritorno si smette di giocare: si lavora su una repo vera.</p>`},
    {t:'callout',kind:'warn',title:'Prima di tornare, prepara la repo',html:`Apri il progetto su cui lavorerai e lancia <code>git status</code>. Deve essere <strong>pulito</strong>: niente file modificati, niente file nuovi. Se hai lavoro in sospeso, mettilo da parte con <code>git stash</code> oppure fai un branch nuovo. Serve anche che il progetto <strong>si costruisca e i test girino</strong> prima di iniziare: se non funziona già prima, non saprai mai se è colpa tua o dell'agente.`},
    {t:'callout',kind:'',title:'Domanda su cui pensare durante la pausa',html:`Da qui in poi controllerai il lavoro dell'agente con <code>git diff</code>. Su una repo da centomila righe che non conosci del tutto: <strong>come farai a sapere se quello che ti consegna è giusto?</strong> È la domanda vera della seconda parte.`}
  ]
});

/* ---------- 5. Capire un progetto vero ---------- */
MODULES.push({
  id:'m6', n:'05', title:'Task 2 — Capire un progetto vero', min:28,
  blocks:[
    {t:'p',html:`<p>Questo è il primo uso di un coding agent che conviene davvero a tutti, anche a chi è scettico: <strong>farsi spiegare un progetto che non si conosce</strong>. È veloce, non tocca niente, e il risultato lo puoi verificare.</p>
      <p>È anche il momento in cui impari il gesto più importante della giornata: <strong>non fidarti della spiegazione, chiedi le prove</strong>.</p>`},
    {t:'callout',kind:'warn',title:'Controllo prima di iniziare',html:`<code>git status</code> pulito. Il progetto si costruisce e i test passano. Se una di queste due cose non è vera, sistemala adesso: altrimenti per tutta la seconda parte non saprai distinguere i problemi tuoi da quelli dell'agente.`},

    {t:'p',html:`<h3>Esercizio: capire il progetto app_workshop</h3>
      <p>Crea il prompt per conoscere il nuovo progetto, supponendo che ti sia appena stato assegnato e che sia la prima volta che ci devi lavorare. Scrivilo tu e provalo nella sessione, poi confrontalo con la soluzione di riferimento.</p>`},
    {t:'reveal',id:'pk6',title:'Compito: capire il progetto app_workshop',
      sub:'Quando hai fatto la tua prova, apri la soluzione di riferimento e confrontala con il tuo prompt.',
      text:`Sei appena entrato in questo progetto e non lo conosci.
Progetto: [nome e tipo]
Quello che so gia': [cosa sai]
Mi serve per: [obiettivo]

Leggi il codice e rispondimi in modo strutturato:

1. A cosa serve questo progetto, in 3 righe.
2. L'entry point: da quale file parte l'applicazione, e cosa succede
   nei primi passi dell'avvio.
3. L'architettura: quali sono i 4-6 blocchi principali e come si parlano.
   Indica per ognuno la cartella o il file.
4. Dove sta la logica vera (le regole del dominio) e dove sta invece
   solo il contorno (validazione, trasporto, configurazione).
5. Come si costruisce, come si lancia in locale, come si lanciano i test.
   Comandi esatti presi dai file del progetto, non inventati.
6. Le 5 cose che uno nuovo deve sapere per non fare danni.

REGOLE:
- Per ogni affermazione cita il file e la riga da cui la ricavi.
- Se una cosa non riesci a dedurla dal codice, scrivi "NON SO"
  invece di ipotizzare.
- Non modificare nessun file.`},
    {t:'callout',kind:'ok',title:'Le due righe che fanno la differenza',html:`«<strong>Cita il file e la riga</strong>» e «<strong>scrivi NON SO</strong>». La prima ti dà un modo per controllare in dieci secondi: apri il file, guardi. La seconda gli dà il permesso di ammettere un buco — senza, riempirà il buco con una risposta plausibile, detta con la stessa sicurezza del resto.`},

    {t:'p',html:`<h3>Verificare quello che ti dice llm</h3>
      <p>Adesso la parte che quasi nessuno fa, ed è quella che conta. Prendi la risposta e controllala.</p>`},
    {t:'table',head:['Cosa','Come si controlla','Quanto ci vuole'],rows:[
      ['L\'entry point','Aprilo. C\'è davvero? Fa quello che ha detto?','30 secondi'],
      ['I comandi','Lanciane uno. Funziona?','1 minuto'],
      ['Tre citazioni a caso','Apri i file alle righe indicate. Dicono quella cosa?','2 minuti'],
      ['Una cosa che sai già','Cercala nella risposta. L\'ha detta giusta?','30 secondi']
    ]},
    {t:'callout',kind:'bad',title:'Il tipo di errore da cercare',html:`Gli errori grossi si vedono. Quelli pericolosi no: sono le <strong>righe plausibili e sbagliate</strong>. «La validazione avviene in <code>middleware/validate.ts</code>» — il file esiste, il nome torna, ma la validazione vera la fa un altro pezzo e quel middleware è morto da un anno. Se non apri il file non te ne accorgi mai, e ci costruisci sopra tutto il resto del corso.`},

    {t:'p',html:`<h3>Scavare dove serve</h3>
      <p>Adesso che hai la mappa, chiedi il dettaglio sul punto che ti interessa. Qui il tipo di domanda che rende di più è quella che <strong>segue un percorso</strong>, non quella che chiede una spiegazione.</p>`},
    {t:'split2',a:{h:'Domande deboli',items:[
      ['«Spiegami come funziona l\'autenticazione.»','Troppo larga: ti scrive un tema, e metà è generica.'],
      ['«Il codice è ben scritto?»','Non si può verificare. Ti dirà di sì con dei distinguo.'],
      ['«Ci sono problemi?»','Senza un criterio, ti elenca cose a caso.']
    ]},b:{h:'Domande che rendono',items:[
      ['«Segui una richiesta POST /ordini dal primo file che la riceve fino alla scrittura sul DB. Elenca i file in ordine.»','Un percorso concreto. Verificabile riga per riga.'],

    ]}},
