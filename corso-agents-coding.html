/* ---------- 7. Test con concorrenza ---------- */
MODULES.push({
  id:'m9', n:'07', title:'Task 4 — Uno script di test con concorrenza', min:14,
  blocks:[
    {t:'p',html:`<p>I problemi di concorrenza sono quelli su cui un agente è meno affidabile quando legge il codice: legge il codice come una storia che va in ordine, e in una storia in ordine due richieste che arrivano insieme non si vedono. Per questo non glieli fai <em>cercare</em>: li <strong>provi</strong>. Uno script che lancia tante richieste insieme e guarda se il sistema si comporta come dovrebbe.</p>
      <p>Attenzione: non stiamo misurando la velocità. Ci interessa un'altra cosa — <strong>quando due richieste arrivano insieme, il risultato è ancora giusto?</strong></p>`},
    {t:'callout',kind:'bad',title:'Dove si lancia',html:`<strong>Solo su ambiente locale o di sviluppo.</strong> Mai contro un ambiente condiviso, mai contro produzione. Uno script del genere, puntato sul posto sbagliato, è indistinguibile da un attacco: riempie i log, satura le connessioni, e può bloccare il lavoro di altri. Prima di lanciarlo, guarda due volte l'indirizzo che c'è dentro.`},

    {t:'p',html:`<h3>6A — Lo script (8 min)</h3>`},
    {t:'promptkit',id:'pk9',title:'Compito: script di prova in parallelo',
      sub:'Descrivi cosa deve succedere e, soprattutto, qual è la regola che non deve mai essere violata.',
      fields:[
        {k:'end',lb:'Cosa chiamare',ph:'Es. POST http://localhost:3000/ordini/{id}/conferma con header Authorization',rows:2},
        {k:'inv',lb:'La regola che non deve mai rompersi',ph:'Es. un ordine può essere confermato una volta sola: su 50 richieste insieme, 1 sola deve andare a buon fine e 49 devono dare 409',rows:3},
        {k:'come',lb:'Come misurare che la regola ha tenuto',ph:'Es. contando le risposte per codice, e poi leggendo la riga sul DB: ordini.confermato_il deve essere valorizzato una volta sola',rows:2}
      ],
      build:(v)=>
`Scrivimi uno script per provare il comportamento sotto richieste
simultanee. Serve a verificare la correttezza, non la velocita'.

Cosa chiamare: `+(v.end||'[endpoint o funzione]')+`
Regola che non deve mai rompersi: `+(v.inv||'[la regola]')+`
Come verificarla: `+(v.come||'[come si controlla]')+`

Lo script deve:
1. Lanciare N richieste il piu' possibile nello stesso istante
   (N configurabile, default 50). Partire davvero insieme, non in fila.
2. Contare le risposte per codice di stato.
3. Controllare la regola e stampare alla fine, chiaro:
   REGOLA RISPETTATA  oppure  REGOLA VIOLATA: <cosa e' successo>
4. Uscire con codice 1 se la regola e' violata, cosi' si puo' mettere
   in una pipeline.
5. Ripetere il giro M volte (default 10): questi problemi non
   succedono tutte le volte.
6. Avere l'indirizzo di destinazione in una variabile in cima al file,
   con scritto in un commento che va usato SOLO in locale.

Vincoli:
- Linguaggio e librerie: quelli gia' usati in questo progetto.
- Stampa alla fine un riassunto leggibile in 5 righe.
- Aggiungi una nota su come pulire i dati creati dallo script.`},
    {t:'p',html:`<p>I punti 1 e 5 sono quelli che la gente dimentica sempre. <strong>Partire davvero insieme</strong>: se lo script manda le richieste in fila, non stai provando niente. <strong>Ripetere</strong>: una gara fra processi si vede magari una volta su venti, quindi un giro solo che va bene non dimostra nulla.</p>`},

    {t:'p',html:`<h3>6B — Lanciarlo e leggere il risultato (6 min)</h3>`},
    {t:'table',head:['Cosa vedi','Cosa vuol dire','Cosa fai'],rows:[
      ['Regola rispettata tutte le volte','Il punto è protetto — oppure lo script non parte davvero insieme','Controlla lo script: rompi apposta la protezione e vedi se lo script se ne accorge'],
      ['Regola violata ogni tanto','Hai trovato una gara vera','Ticket, con lo script allegato: è la riprova'],
      ['Regola violata sempre','Non è concorrenza: manca proprio il controllo','Guarda il codice, probabilmente non c\'è nessun vincolo'],
      ['Errori di connessione','Hai saturato qualcosa','Abbassa N. Non è il problema che stavi cercando']
    ]},
    {t:'callout',kind:'ok',title:'Il controllo dello script stesso',html:`Il rischio più insidioso è uno script che <strong>non sa fallire</strong>. Prima di credere a un "regola rispettata", togli la protezione nel codice (commenta la transazione, il lock, il vincolo unico) e rilancia: se adesso dice VIOLATA, lo script funziona. Se dice ancora RISPETTATA, stavi guardando un test che non guarda niente. Questo vale per ogni test scritto da un agente: <strong>un test che non fallisce mai non è un test</strong>.`},
    {t:'exercise',id:'ex9',label:'Esercizio 7.1 — La controprova (4 minuti)',
      prompt:'Rompi apposta la protezione e rilancia lo script. Si accorge della differenza? Scrivi cosa hai tolto e cosa è cambiato nel risultato.',
      placeholder:'Ho tolto: ...\nPrima: ...\nDopo: ...\nLo script se ne accorge? ...'},
    {t:'checklist',id:'ck9',title:'Task 4 completato quando...',
      items:[
        'Lo script punta a un ambiente locale e sta scritto nel file',
        'Le richieste partono davvero insieme, non in fila',
        'Lo script ripete il giro più volte',
        'Dice chiaramente se la regola ha tenuto o no, ed esce con codice 1 se no',
        'Ho fatto la controprova: rotta la protezione, lo script se ne accorge',
        'So come pulire i dati creati dallo script'
      ]}
  ]
});

/* ---------- 8. Test BDD ---------- */
MODULES.push({
  id:'m10', n:'08', title:'Task 5 — Un test BDD', min:14,
  blocks:[
    {t:'p',html:`<h3>Cos'è un test BDD, in breve</h3>
      <p>Un test BDD descrive il comportamento con <strong>parole che capisce anche chi non programma</strong>, in tre parti fisse:</p>`},
    {t:'code',lang:'gherkin',code:`Funzionalita': Conferma di un ordine

  Scenario: un ordine gia' confermato non si conferma due volte
    Dato che esiste un ordine 4471 in stato "confermato"
    Quando un operatore chiede di confermare l'ordine 4471
    Allora la richiesta viene rifiutata con codice 409
    E lo stato dell'ordine resta "confermato"`},
    {t:'p',html:`<p><strong>Dato che</strong> = la situazione di partenza. <strong>Quando</strong> = l'azione. <strong>Allora</strong> = cosa deve succedere. Sotto, del codice normale collega ogni riga a quello che fa davvero (si chiamano <em>step definition</em>).</p>
      <p>Perché è utile con un agente? Perché lo scenario <strong>è già il compito</strong>. Invece di spiegare a parole cosa deve fare il test, glielo scrivi in una forma precisa e lui lo traduce in codice. E resta leggibile da chi ha chiesto la funzionalità.</p>`},
    {t:'callout',kind:'',title:'Se nel tuo progetto il BDD non c\'è',html:`Va benissimo lo stesso. Scrivi lo scenario in forma <em>Dato / Quando / Allora</em> e chiedi all'agente di implementarlo <strong>con la libreria di test che il progetto usa già</strong>. Il valore sta nel modo di pensare al test, non nello strumento. Non introdurre un framework nuovo in un progetto solo per un esercizio.`},

    {t:'p',html:`<h3>7A — Scrivere lo scenario (5 min)</h3>
      <p>Questa parte falla <strong>tu</strong>, a mano. È l'unico pezzo che l'agente non può fare al posto tuo, perché richiede di sapere cosa deve fare il sistema — e quello sta nella tua testa, non nel codice.</p>`},
    {t:'exercise',id:'ex10a',label:'Esercizio 8.1 — Il tuo scenario (5 minuti)',
      prompt:'Scegli una funzionalità del tuo progetto e scrivi due scenari: uno che va a buon fine e uno che deve essere rifiutato. Usa Dato che / Quando / Allora. Niente termini tecnici: solo cosa succede.',
      placeholder:'Funzionalità: ...\n\nScenario: (caso buono)\n  Dato che ...\n  Quando ...\n  Allora ...\n\nScenario: (caso rifiutato)\n  Dato che ...\n  Quando ...\n  Allora ...',
      solution:'Due errori tipici. <strong>Primo:</strong> mettere la tecnica nello scenario («Quando faccio una POST su /api/v2/ordini con header X»). Lo scenario dice <em>cosa</em> succede, non <em>come</em> si chiama. Il come sta nel codice sotto. <strong>Secondo:</strong> un "Allora" vago («Allora l\'ordine viene gestito correttamente»). Se non si può controllare con un confronto, non è un Allora: scrivi il valore atteso.'},

    {t:'p',html:`<h3>7B — Farlo implementare (9 min)</h3>`},
    {t:'promptkit',id:'pk10',title:'Compito: implementa lo scenario',
      sub:'Incolla lo scenario che hai scritto e digli che strumenti usare.',
      fields:[
        {k:'scen',lb:'I tuoi scenari (Dato / Quando / Allora)',ph:'Incolla qui i due scenari scritti sopra',rows:8},
        {k:'stack',lb:'Con cosa si scrivono i test qui',ph:'Es. vitest + supertest; oppure pytest + pytest-bdd; oppure Cucumber + JUnit',rows:2},
        {k:'dati',lb:'Come si preparano i dati di partenza',ph:'Es. c\'è già una factory in test/helpers/factory.ts; il DB di test si azzera fra un test e l\'altro',rows:2}
      ],
      build:(v)=>
`Implementa questi scenari come test automatici.

SCENARI:
`+(v.scen||'[incolla qui gli scenari]')+`

Strumenti da usare: `+(v.stack||'[framework di test del progetto]')+`
Dati di partenza: `+(v.dati||'[come si preparano i dati]')+`

REGOLE:
- Usa SOLO quello che il progetto usa gia'. Nessuna libreria nuova.
- Prima guarda i test che esistono e copiane lo stile: stessa struttura,
  stesso modo di preparare i dati, stesso modo di pulire.
- Ogni riga "Allora" deve diventare un confronto vero con un valore
  atteso. Niente controlli generici tipo "non e' nullo" o "non lancia
  eccezioni".
- Il test deve poter girare da solo e piu' volte di fila,
  senza lasciare sporcizia dietro.
- Niente attese a tempo fisso (sleep): se serve aspettare, aspetta
  una condizione.

Poi:
1. Lancia i test e mostrami l'output vero.
2. IMPORTANTE: rompi apposta il codice di produzione in un punto che
   questo test dovrebbe coprire, rilancia, e mostrami il test che
   FALLISCE. Poi rimetti a posto il codice.`},
    {t:'callout',kind:'ok',title:'Quell\'ultimo punto è il cuore del modulo',html:`Un agente sa scrivere test verdi. È bravissimo: se serve, adatta il test finché non passa — anche quando il codice è sbagliato. <strong>L'unica prova che un test serve a qualcosa è vederlo fallire quando deve.</strong> Fallo fare a lui, davanti a te, e guarda l'output. Prendi l'abitudine: vale per tutti i test che ti consegnerà da qui in avanti.`},
    {t:'p',html:`<h3>Come si riconosce un test che non serve</h3>`},
    {t:'split2',a:{h:'Segnali di allarme',items:[
      ['Controlla solo che "non sia nullo"','Passa anche se il valore è completamente sbagliato.'],
      ['Verifica solo che non esploda','Un codice che non fa niente passa questo test.'],
      ['Ha una sleep dentro','Fallirà a caso sulla macchina della pipeline. E rallenta tutto.'],
      ['Ricalcola il valore atteso con la stessa formula del codice','Se la formula è sbagliata, il test conferma l\'errore.'],
      ['Ha bisogno degli altri test','Girato da solo fallisce. Girato due volte fallisce.']
    ]},b:{h:'Segnali buoni',items:[
      ['Confronta con valori scritti a mano','Il valore atteso viene da te, non dal codice.'],
      ['Fallisce se rompi il codice','L\'hai visto con i tuoi occhi.'],
      ['Gira da solo e più volte','Nessuna dipendenza dall\'ordine o da dati rimasti in giro.'],
      ['Il nome dice cosa verifica','Quando fallisce in pipeline capisci subito cos\'è.'],
      ['Copre anche il caso rifiutato','I bug stanno quasi sempre lì, non nel caso buono.']
    ]}},
    {t:'quiz',id:'q10',q:'L\'agente ti consegna cinque test e passano tutti. Qual è la prima cosa da fare?',
      opts:[
        {tx:'Controllare la copertura del codice',ok:false,why:'Serve, ma dopo. La copertura dice quali righe sono state eseguite, non se il test controlla qualcosa di sensato.'},
        {tx:'Rompere apposta il codice e controllare che i test falliscano',ok:true,why:'Esatto. È l\'unica prova diretta che quei test guardano davvero qualcosa. Cinque test verdi su un codice rotto sono peggio di nessun test: ti danno una sicurezza falsa.'},
        {tx:'Leggere i nomi dei test',ok:false,why:'Aiuta a capire l\'intenzione, ma un nome giusto può stare sopra a un controllo inutile.'},
        {tx:'Chiedergli di aggiungerne altri',ok:false,why:'Se non sai se i cinque che hai servono, aggiungerne altri cinque non migliora niente.'}
      ]},
    {t:'checklist',id:'ck10',title:'Task 5 completato quando...',
      items:[
        'Ho scritto io gli scenari, a parole, senza termini tecnici',
        'C\'è anche uno scenario di caso rifiutato, non solo quello buono',
        'Il test usa solo gli strumenti già presenti nel progetto',
        'Ogni Allora è un confronto con un valore atteso',
        'Ho visto il test fallire quando ho rotto il codice apposta',
        'Il test gira da solo e due volte di fila senza problemi'
      ]}
  ]
});

/* ---------- 9. Debug ---------- */
MODULES.push({
  id:'m11', n:'09', title:'Task 6 — Debug da log e payload', min:20,
  blocks:[
    {t:'p',html:`<p>L'ultimo compito è quello per cui, secondo molti, un agente rende di più: <strong>hai un errore, hai dei log, non hai idea di dove guardare</strong>.</p>
      <p>Il motivo è semplice. Un log di duemila righe tu lo leggi in venti minuti e a metà ti si offusca la vista. Lui lo legge tutto, e sa anche cercare nel codice il punto che produce una certa riga. È un incrocio fra due cose grandi, ed è esattamente quello che fa meglio.</p>`},
    {t:'callout',kind:'bad',title:'Prima di incollare qualsiasi log',html:`I log veri contengono <strong>dati di persone vere</strong>: email, codici fiscali, indirizzi, token, numeri di carta. Prima di darli a un agente, <strong>sostituiscili</strong>. Tieni la forma (stessa lunghezza, stesso tipo) e cambia il contenuto: <code>mario.rossi@example.com</code> diventa <code>utente1@example.com</code>. La forma serve a capire il problema, il contenuto no. Se non puoi ripulirlo, non incollarlo.`},

    {t:'p',html:`<h3>8A — Preparare il materiale (6 min)</h3>
      <p>La qualità della risposta dipende quasi tutta da cosa gli dai. Quattro cose, in ordine di importanza:</p>`},
    {t:'table',head:['Cosa','Perché serve','Se manca'],rows:[
      ['<strong>Cosa doveva succedere</strong>','È il metro di paragone','Non sa cosa sta cercando: ti segnala righe strane a caso'],
      ['<strong>Cosa è successo invece</strong>','Il sintomo esatto, con il messaggio preciso','Cerca il problema sbagliato'],
      ['<strong>Il log intorno al momento</strong>','Il fatto vero','Tira a indovinare sul codice'],
      ['<strong>Il payload della richiesta</strong>','I dati in ingresso: spesso il problema è lì','Non può vedere che mancava un campo']
    ]},
    {t:'p',html:`<p>Una cosa in più che vale molto: <strong>dire se succede sempre o ogni tanto</strong>. È la prima cosa che divide il campo in due — «sempre» punta a un errore nella logica, «ogni tanto» punta a dati particolari, concorrenza, o qualcosa che dipende dal tempo.</p>`},
    {t:'promptkit',id:'pk11',title:'Compito: trova la causa',
      sub:'Dai il contesto, non chiedere la soluzione. La soluzione arriva dopo, quando la causa è chiara.',
      fields:[
        {k:'att',lb:'Cosa doveva succedere',ph:'Es. la conferma dell\'ordine doveva salvare lo stato e mandare l\'email',rows:2},
        {k:'suc',lb:'Cosa succede invece (messaggio esatto)',ph:'Es. 500 con "Cannot read properties of undefined (reading id)". Lo stato resta "nuovo", nessuna email.',rows:3},
        {k:'freq',lb:'Sempre o ogni tanto?',ph:'Es. circa 1 volta su 30, solo su ordini con più di 5 righe, solo di mattina',rows:2},
        {k:'log',lb:'Log e payload (già ripuliti dai dati personali)',ph:'Incolla qui le righe di log intorno all\'errore e il payload della richiesta',rows:8}
      ],
      build:(v)=>
`Ho un errore e ti do il contesto. Non correggere niente per adesso:
voglio prima capire la causa.

Cosa doveva succedere: `+(v.att||'[comportamento atteso]')+`
Cosa succede invece: `+(v.suc||'[sintomo esatto]')+`
Quanto spesso: `+(v.freq||'[sempre / ogni tanto, in che condizioni]')+`

LOG E PAYLOAD:
--- inizio ---
`+(v.log||'[incolla qui]')+`
--- fine ---

Fai questo, nell'ordine:

1. Ricostruisci cosa e' successo, passo per passo, basandoti SOLO
   sul log. Dove il log non dice niente, scrivi "il log non lo dice".
2. Trova nel codice il punto esatto che ha prodotto l'errore.
   File e riga. Fammi vedere le righe.
3. Elenca 2 o 3 possibili cause, dalla piu' probabile alla meno.
   Per ognuna: cosa dovrei trovare nel codice o nei dati se fosse quella.
4. Per la causa piu' probabile, dimmi UN modo per confermarla o
   escluderla in meno di 5 minuti (un comando, una query, una riga
   di log da aggiungere).
5. Fermati qui. Non proporre ancora la correzione.

REGOLE:
- Non inventare righe di log che non ti ho dato.
- Se ti serve un altro pezzo di log o un altro file, chiedimelo
  invece di tirare a indovinare.`},
    {t:'callout',kind:'ok',title:'Perché «fermati prima della correzione»',html:`Lasciato libero, un agente <strong>salta alla correzione</strong>: legge l'errore, riconosce una forma nota, e mette una toppa. Spesso la toppa funziona — nasconde il sintomo — e la causa vera resta lì, pronta a tornare fuori in un altro punto. Separare «trova la causa» da «correggi» è la cosa che fa la differenza fra un debug e un cerotto.</p><p style="margin:8px 0 0">Il punto 4 è altrettanto importante: ti dà <strong>qualcosa da fare tu</strong>, in cinque minuti, per sapere se la strada è giusta prima di spenderci mezz'ora.`},

    {t:'p',html:`<h3>8B — Confermare, poi correggere (9 min)</h3>
      <ol>
        <li><strong>Fai la verifica</strong> che ti ha suggerito. Lancia il comando, fai la query, aggiungi la riga di log.</li>
        <li><strong>Riporta il risultato</strong>, anche se contraddice la sua ipotesi. Anzi: soprattutto se la contraddice. «Ho fatto X, ho ottenuto Y» è l'informazione più preziosa che gli puoi dare.</li>
        <li><strong>Se la causa è confermata</strong>, chiedi la correzione — e chiedi anche il test che la dimostra.</li>
        <li><strong>Se non è confermata</strong>, si passa alla seconda ipotesi. È normale: la prima ipotesi è giusta forse la metà delle volte.</li>
      </ol>`},
    {t:'code',lang:'text',code:`Causa confermata: [cosa hai verificato e cosa hai trovato].

Adesso:
1. Scrivi PRIMA un test che riproduce il problema. Lancialo e mostrami
   che fallisce con l'errore giusto.
2. Poi la correzione piu' piccola che fa passare quel test.
3. Rilancia tutti i test del progetto e mostrami l'output vero.
4. Dimmi se questa stessa causa puo' esserci in altri punti del codice,
   e dove.`},
    {t:'p',html:`<p>L'ordine "prima il test che fallisce, poi la correzione" non è pedanteria: è l'unico modo per essere sicuri che la correzione corregga davvero <em>questo</em> problema. Un test scritto dopo passa sempre, e non dimostra niente.</p>`},
    {t:'p',html:`<h3>8C — Quando non ne esce (5 min)</h3>
      <p>Capita: due o tre giri e siete ancora fermi. I segnali sono chiari — ripete la stessa ipotesi con parole diverse, o comincia a proporre cambiamenti a caso "proviamo così". Cosa fare:</p>`},
    {t:'table',head:['Segnale','Mossa'],rows:[
      ['Ripete la stessa ipotesi','<code>/clear</code> e ricomincia con un contesto nuovo. Si è incastrato nel suo ragionamento precedente.'],
      ['Propone modifiche a caso','Fermalo. Torna al punto 1: cosa dice esattamente il log?'],
      ['Chiede dati che non hai','Daglieli davvero, o dì chiaro che non ci sono. Un buco riempito da lui è un\'ipotesi travestita da fatto.'],
      ['Dà una risposta diversa ogni volta','Vuol dire che il materiale non basta. Servono più log, non più domande.'],
      ['Tre giri senza progresso','Cambia strada: chiedigli di scrivere <em>come si riproduce a comando</em> il problema. Un caso che si riproduce vale più di dieci ipotesi.']
    ]},
    {t:'exercise',id:'ex11',label:'Esercizio 9.1 — Com\'è andata (5 minuti)',
      prompt:'Scrivi come è andato il debug: la causa proposta, come l\'hai verificata, se era giusta, quanto ci hai messo. E cosa avresti fatto senza agente.',
      placeholder:'Causa proposta: ...\nVerifica: ...\nEra giusta? ...\nTempo: ...\nSenza agente avrei: ...',
      solution:'Il guadagno vero quasi mai è "ha trovato il bug". È che <strong>ha tolto dal tavolo le strade sbagliate in due minuti</strong>: ti ha detto dove non è il problema. Il restringimento del campo è il lavoro che costa più tempo a una persona, ed è quello che lui fa meglio. La decisione finale resta tua, ma parti da un campo dieci volte più piccolo.'},
    {t:'checklist',id:'ck11',title:'Task 6 completato quando...',
      items:[
        'Ho ripulito i log dai dati personali prima di incollarli',
        'Ho dato attesa, sintomo, frequenza, log e payload',
        'L\'ho fermato prima della correzione e ho avuto un elenco di cause',
        'Ho fatto io la verifica rapida che mi ha suggerito',
        'Gli ho riportato il risultato vero, anche quando lo smentiva',
        'La correzione è arrivata dopo un test che falliva'
      ]}
  ]
});

/* ---------- 10. Best practices ---------- */
MODULES.push({
  id:'mbp', n:'10', title:'Best practices', min:15,
  blocks:[
    {t:'p',html:`<p class="lede">Il lavoro si sposta: scrivi meno codice a mano, ma devi diventare bravo a <strong>specificare, delegare, verificare e controllare</strong> un sistema che il codice lo scrive. Queste regole vengono tutte da lì. Per ognuna trovi il motivo e un esempio di cosa fare e cosa evitare.</p>`},

    {t:'practices',title:'Specificare bene il compito',items:[
      {n:'01',h:'Dai task piccoli, chiari e verificabili',
        why:'Un compito piccolo ha un diff che riesci a leggere tutto e un modo chiaro per dire se è finito. Con un compito grande l\'agente deve indovinare molte decisioni, e ogni scelta sbagliata si porta dietro le successive.',
        do:'«Aggiungi la validazione dell\'email in <code>signup.ts</code>: se è vuota o malformata rispondi 400. Aggiungi un test per ciascun caso.»',
        dont:'«Sistema la registrazione degli utenti e già che ci sei rendila più robusta.»'},
      {n:'02',h:'Specifica sempre l\'output atteso e quando il lavoro è finito',
        why:'Se non dici quando il lavoro è finito, l\'agente si ferma quando <em>gli sembra</em> finito. Un criterio concreto (un test che passa, un comando che esce con 0, un file generato) diventa l\'obiettivo che l\'agente può controllare da solo.',
        do:'«È finito quando <code>pnpm test auth</code> passa, <code>pnpm lint</code> è pulito e la risposta segue lo schema in <code>docs/api/login.md</code>.»',
        dont:'«Fammi sapere quando funziona.»'},
      {n:'03',h:'Fornisci il contesto necessario: architettura, convenzioni, file rilevanti, vincoli',
        why:'L\'agente riparte da zero ogni volta. Quello che non gli dici lo ricostruisce leggendo il codice, e spesso sbaglia. Un riferimento preciso a file e componenti vale più di una spiegazione lunga.',
        do:'«Il pattern da seguire è quello di <code>services/orders.ts</code>. Non toccare <code>legacy/</code>. Gli errori passano sempre da <code>AppError</code>.»',
        dont:'Lanciarlo sulla repo con «aggiungi il servizio per le fatture» e lasciare che scelga da solo struttura e convenzioni.'},
      {n:'04',h:'Preferisci convenzioni esplicite a comportamenti impliciti',
        why:'Quello che «si fa sempre così» ma non è scritto da nessuna parte l\'agente non lo può sapere. Lo scopre solo se sta scritto in un file, in un tipo o in una regola di lint.',
        do:'Scrivere in <code>AGENTS.md</code>: «Le date sono sempre in UTC e vengono formattate solo nel frontend». Meglio ancora: una regola di lint che lo impone.',
        dont:'Correggere a mano, a ogni PR, lo stesso errore sulle date senza scriverlo mai da nessuna parte.'},
      {n:'05',h:'Mantieni <code>AGENTS.md</code>, README e istruzioni operative brevi e aggiornate',
        why:'Questi file vengono letti a ogni avvio. Se un\'istruzione è vecchia, l\'agente la segue lo stesso e sbaglia con convinzione. Se il file è troppo lungo, le regole importanti si perdono in mezzo alle altre.',
        do:'Una pagina: comandi di build e test, struttura, convenzioni, cose da NON fare. La aggiorni nella stessa PR che cambia il comando.',
        dont:'Un <code>AGENTS.md</code> di 800 righe che dice ancora di usare <code>npm</code> anche se il progetto è passato a <code>pnpm</code> da sei mesi.'}
    ]},

    {t:'practices',title:'Capire prima di scrivere',items:[
      {n:'06',h:'Fai esplorare il codebase prima di modificare il codice',
        why:'Se l\'agente comincia subito a scrivere, lavora con quello che si immagina del progetto. Se prima lo esplora, lavora con quello che c\'è davvero. E se ti riassume cosa ha trovato, vedi subito se ha capito male, prima che abbia scritto una sola riga.',
        do:'«Prima di modificare qualcosa, trova dove viene calcolato lo sconto e dimmi file e righe. Non cambiare niente.»',
        dont:'«Correggi il calcolo dello sconto.» su un progetto che l\'agente non ha mai visto.'},
      {n:'07',h:'Chiedi prima un piano per le modifiche non banali',
        why:'Correggere un piano di dieci righe richiede un minuto. Buttare un\'implementazione su cinque file partita nella direzione sbagliata costa molto di più. Tenere separati piano e implementazione riduce di molto questo rischio.',
        do:'«Proponi un piano: file che tocchi, cosa cambi in ciascuno, come lo testi. Aspetta il mio ok prima di scrivere codice.»',
        dont:'«Migra l\'autenticazione a JWT.» e guardare il risultato solo alla fine.'}
    ]},

    {t:'practices',title:'Feedback automatico',items:[
      {n:'08',h:'Usa test, typecheck, lint e build come feedback automatico',
        why:'L\'agente va avanti a tentativi: prova, guarda il risultato, corregge. Più segnali oggettivi gli dai, più errori corregge da solo prima di arrivare a te. Allo stesso modo, anche un ambiente configurato bene (script di avvio, variabili, strumenti disponibili) riduce gli errori.',
        do:'Nel file di contesto: «Dopo ogni modifica lancia <code>pnpm typecheck && pnpm lint && pnpm test</code>».',
        dont:'Un progetto in cui i test non partono in locale, e l\'agente deve fermarsi a «il codice dovrebbe funzionare».'},
      {n:'09',h:'Chiedi di aggiungere o aggiornare i test insieme al codice',
        why:'Un test scritto nella stessa modifica documenta cosa ti aspetti dal codice e lo protegge dalle regressioni. Se lo rimandi a dopo, di solito non lo scrive nessuno.',
        do:'«Implementa il nuovo filtro e aggiungi i test: caso normale, lista vuota, parametro non valido.»',
        dont:'Fare il merge della funzionalità con un TODO: «test da aggiungere».'},
      {n:'10',h:'Fai eseguire i test all\'agente dopo ogni modifica importante',
        why:'Un errore che salta fuori subito si corregge in pochi secondi. Se viene fuori dopo dieci modifiche, bisogna prima capire quale delle dieci lo ha causato.',
        do:'«Lancia i test ora e mostrami l\'output vero prima di andare avanti.»',
        dont:'Accettare «ho completato tutte le modifiche» senza un singolo output di test.'}
    ]},

    {t:'practices',title:'Review e verifica',items:[
      {n:'11',h:'Separa implementazione e review quando possibile',
        why:'Chi ha scritto il codice lo rilegge dando per buone le proprie scelte. Una sessione nuova, o un altro agente, lo guarda senza quei presupposti e trova cose che l\'autore non vede.',
        do:'Aprire una sessione pulita: «Fai la review di questo diff. Cerca bug, casi limite e violazioni delle convenzioni in <code>AGENTS.md</code>».',
        dont:'Chiedere alla stessa sessione che ha scritto il codice: «È tutto a posto?»'},
      {n:'12',h:'Chiedi una review esplicita del diff prima del merge',
        why:'Il diff è quello che entra davvero nel codice, al di là di quello che l\'agente dice di aver fatto. Rileggerlo è l\'unico modo per trovare modifiche che non avevi chiesto.',
        do:'Leggere <code>git diff main...</code> riga per riga, e chiedere conto di ogni file che non ti aspettavi.',
        dont:'Fare il merge fidandoti del riassunto finale dell\'agente.'},
      {n:'13',h:'Controlla soprattutto auth, permessi, DB, migrazioni, concurrency, error handling e API contract',
        why:'In queste aree un errore è costoso e spesso non si vede subito: i test passano, e il problema salta fuori in produzione, sotto carico o con dati veri.',
        do:'Su una migrazione: controlla che sia reversibile, quanto blocca le tabelle, cosa succede ai dati esistenti. Sulle API: verifica che la risposta non cambi forma per chi già la usa.',
        dont:'Dedicare lo stesso tempo di review al rename di una variabile e a un cambio nel middleware di autenticazione.'},
      {n:'14',h:'Non accettare codice solo perché compila o passa i test. Controlla soprattutto il codice dei test',
        why:'Pur di arrivare al verde, l\'agente può scrivere test che non verificano niente, oppure ammorbidire un test esistente. I test passano sempre, ma non ti proteggono da niente.',
        do:'Rompere di proposito il codice e controllare che il test fallisca. Leggere le asserzioni: verificano il comportamento o solo che «non esploda»?',
        dont:'Accettare un test con <code>expect(result).toBeDefined()</code>, o un <code>skip</code> aggiunto «temporaneamente».'},
      {n:'15',h:'Verifica semplicità, correttezza, sicurezza e compatibilità',
        why:'Codice che funziona non è per forza codice buono. Gli agenti tendono ad aggiungere astrazioni, dipendenze e casi che nessuno ha chiesto, e ogni riga in più va mantenuta.',
        do:'Chiedersi: si poteva fare con metà del codice? Ha aggiunto una dipendenza? Rompe qualcosa per chi usa già questa funzione?',
        dont:'Accettare una factory con tre interfacce per una funzione che viene chiamata in un posto solo.'},
      {n:'16',h:'Chiedi all\'agente di identificare edge case e failure mode',
        why:'L\'agente è bravo a elencare casi limite, se glielo chiedi. Da solo tende a coprire solo il caso felice. Chiederglielo esplicitamente costa una riga di prompt.',
        do:'«Elenca gli edge case: input vuoto, valori enormi, chiamate concorrenti, rete che cade. Per ognuno dimmi come si comporta il codice.»',
        dont:'Scoprire in produzione che la funzione esplode quando la lista è vuota.'},
      {n:'17',h:'Chiedi all\'agente cosa non è riuscito a verificare',
        why:'Un agente tende a presentare il lavoro come finito e sicuro. Se gli chiedi esplicitamente cosa non ha potuto provare, ti dice dove devi guardare tu.',
        do:'«Cosa non hai potuto verificare? Rispondi anche NON SO, se è il caso.» Risposte tipiche: «Non ho accesso al DB di staging», «Non ho testato con Safari».',
        dont:'Leggere «tutto funziona correttamente» e prenderlo per buono.'}
    ]},

    {t:'practices',title:'Isolamento e reversibilità',items:[
      {n:'18',h:'Usa branch, worktree o ambienti isolati per task indipendenti',
        why:'Se qualcosa va male, butti via il branch e non hai perso niente. Tenere isolati i task evita anche che le modifiche di uno si mescolino con quelle di un altro.',
        do:'<code>git worktree add ../feat-export -b feat/export</code> e far lavorare l\'agente lì dentro.',
        dont:'Far lavorare l\'agente su <code>main</code>, in mezzo alle tue modifiche non ancora committate.'},
      {n:'19',h:'Parallelizza solo lavori davvero indipendenti',
        why:'Due task che sembrano separati ma toccano lo stesso modulo producono conflitti, oppure soluzioni incompatibili fra loro. A quel punto il tempo guadagnato lavorando in parallelo lo perdi a sistemare.',
        do:'In parallelo: «documenta il modulo A» e «aggiungi i test al modulo B».',
        dont:'In parallelo: «rifattorizza il modello User» e «aggiungi un campo al modello User».'},
      {n:'20',h:'Evita che più agenti modifichino contemporaneamente gli stessi file',
        why:'Un agente non sa cosa ha cambiato l\'altro. Può sovrascrivere le sue modifiche, o prendere decisioni partendo da un file che nel frattempo è cambiato.',
        do:'Assegnare a ogni agente un\'area precisa: «tu lavori solo in <code>src/billing/</code>».',
        dont:'Tre agenti lanciati insieme, e tutti e tre toccano <code>config.ts</code>.'},
      {n:'21',h:'Mantieni commit piccoli e facilmente reversibili',
        why:'Un commit piccolo si legge, si capisce e si annulla con <code>git revert</code> senza toccare il resto. Un commit enorme o lo tieni tutto o lo butti tutto.',
        do:'Un commit per passo: prima il refactoring senza cambi di comportamento, poi la nuova funzione, poi i test.',
        dont:'Un unico commit «WIP agent changes» da 40 file.'},
      {n:'22',h:'Usa Git e CI come rete di sicurezza',
        why:'Git ti permette di tornare indietro, la CI ricontrolla tutto in un ambiente pulito. Insieme ti proteggono dagli errori che sfuggono a te e all\'agente.',
        do:'<code>git status</code> pulito prima di iniziare, e merge solo dopo che la CI è verde sulla PR.',
        dont:'Push diretto su <code>main</code> «tanto sono solo due righe».'}
    ]},

    {t:'practices',title:'Sicurezza e permessi',items:[
      {n:'23',h:'Non dare accesso a production, secret o permessi amministrativi',
        why:'Un agente può sbagliare, e può essere manipolato da contenuti che legge (un file, una issue, una pagina web). Il danno massimo che può fare dipende dai permessi che ha: DB di produzione, admin AWS, SSH, permessi di deploy, secret completi.',
        do:'Credenziali di un ambiente di sviluppo, con dati finti e permessi limitati. Sulla produzione intervieni solo tu.',
        dont:'Lanciare l\'agente in una shell dove sono caricate le credenziali AWS di amministratore.'},
      {n:'24',h:'Applica il least privilege agli strumenti disponibili all\'agente',
        why:'Ogni strumento abilitato è un\'azione in più che l\'agente può fare, anche per sbaglio. Sandbox, rete controllata e approvazioni per le operazioni sensibili sono gli elementi di base per usare i coding agent in sicurezza.',
        do:'Permettere <code>read</code>, <code>edit</code> e i comandi di test; chiedere conferma per <code>git push</code> e installazione di pacchetti; rete limitata ai registry che servono.',
        dont:'Modalità «approva tutto» con accesso libero alla rete, su un laptop dove c\'è tutto.'},
      {n:'25',h:'Per operazioni distruttive, richiedi sempre approvazione umana',
        why:'<code>rm -rf</code>, <code>DROP TABLE</code>, <code>git push --force</code> e simili non si annullano. Chiedere conferma costa pochi secondi, sbagliare può costare giorni.',
        do:'Configurare l\'agente in modo che chieda conferma per cancellazioni, migrazioni, force-push e comandi su database.',
        dont:'Lasciare che l\'agente «pulisca» da solo le tabelle di test su un database condiviso.'}
    ]},

    {t:'practices',title:'Il controllo resta a te',items:[
      {n:'26',h:'Non delegare la decisione finale: delega l\'implementazione, tieni per te la verifica',
        why:'L\'agente non risponde di quello che va in produzione, tu sì. Quello che firmi è tuo, chiunque l\'abbia scritto.',
        do:'«Implementa tu, poi leggo il diff, lancio i test e decido io se fare il merge.»',
        dont:'Pipeline in cui l\'output dell\'agente arriva in produzione senza che nessuno lo abbia letto.'}
    ]},

    {t:'callout',kind:'warn',title:'Quando non usare un agente',html:`È ottimo per refactoring, test, CRUD, migrazioni meccaniche, boilerplate, bug localizzati, integrazioni con API, documentazione ed esplorazione del codice. Va usato con molta più cautela per decisioni architetturali irreversibili, crittografia, sicurezza critica, logica finanziaria, cancellazione di dati, incidenti in produzione e requisiti ambigui. <strong>Non perché non possa aiutare, ma perché lì verificare il suo lavoro costa di più.</strong>`}
  ]
});

/* ============================================================
   RENDERER
   ============================================================ */
const mounts = [];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBlock(b, mid, i){
  const id = mid+'_'+i;
  switch(b.t){
    case 'p': return '<div class="prose">'+b.html+'</div>';
    case 'code': return '<pre><code>'+esc(b.code)+'</code></pre>';
    case 'callout':
      return '<div class="callout '+(b.kind||'')+'"><span class="ct">'+b.title+'</span><div>'+b.html+'</div></div>';
    case 'cards':
      return '<div class="grid c3">'+b.cards.map(c=>
        '<div class="card"><div class="tag">'+c.tag+'</div><h5>'+c.h+'</h5><p>'+c.p+'</p></div>').join('')+'</div>';
    case 'table':
    case 'tablewrap':
      return '<div class="tablewrap"><table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+
        '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    case 'compare':
      return '<h3>'+b.title+'</h3><div class="split">'+
        '<div class="pane bad"><div class="pane-h">'+b.bad.h+'</div><pre><code>'+esc(b.bad.code)+'</code></pre></div>'+
        '<div class="pane ok"><div class="pane-h">'+b.good.h+'</div><pre><code>'+esc(b.good.code)+'</code></pre></div></div>';
    case 'practices':
      return (b.title?'<h3>'+b.title+'</h3>':'')+b.items.map(it=>
        '<div class="bp"><div class="bp-h"><span class="bp-n">'+it.n+'</span><span>'+it.h+'</span></div>'+
        '<div class="bp-why"><strong>Perché:</strong> '+it.why+'</div>'+
        '<div class="bp-ex"><div class="do"><b>Fai così</b>'+it.do+'</div><div class="dont"><b>Non così</b>'+it.dont+'</div></div></div>').join('');
    case 'split2':
      return '<div class="split">'+[b.a,b.b].map(col=>
        '<div class="widget" style="margin:0"><div class="widget-t">'+col.h+'</div><div style="margin-top:10px">'+
        col.items.map(it=>'<div style="padding:8px 0;border-top:1px solid var(--line)"><strong style="font-size:13.5px">'+it[0]+
        '</strong><div style="font-size:13px;color:var(--muted)">'+it[1]+'</div></div>').join('')+'</div></div>').join('')+'</div>';
    case 'quiz':      mounts.push(()=>mountQuiz(id,b));      return '<div id="'+id+'"></div>';
    case 'exercise':  mounts.push(()=>mountExercise(id,b));  return '<div id="'+id+'"></div>';
    case 'checklist': mounts.push(()=>mountChecklist(id,b)); return '<div id="'+id+'"></div>';
    case 'agentloop': mounts.push(()=>mountAgentLoop(id));   return '<div id="'+id+'"></div>';
    case 'triage':    mounts.push(()=>mountTriage(id));      return '<div id="'+id+'"></div>';
    case 'cmdlab':    mounts.push(()=>mountCmdLab(id));      return '<div id="'+id+'"></div>';
    case 'promptkit': mounts.push(()=>mountPromptKit(id,b)); return '<div id="'+id+'"></div>';
    case 'reveal':    mounts.push(()=>mountReveal(id,b));    return '<div id="'+id+'"></div>';
    case 'plan':      mounts.push(()=>mountPlan(id));        return '<div id="'+id+'"></div>';
    default: return '';
  }
}

function widgetShell(kind,title,sub,body){
  return '<div class="widget"><div class="widget-h"><span class="widget-k">'+kind+'</span><span class="widget-t">'+title+'</span></div>'+
    (sub?'<div class="widget-s">'+sub+'</div>':'')+body+'</div>';
}

/* ---------- quiz ---------- */
function mountQuiz(id, b){
  const el = document.getElementById(id);
  const marks = ['A','B','C','D','E'];

    opts.forEach((btn,j)=>{
      btn.disabled = true; btn.classList.add('shown');

    fb.style.color = b.opts[k].ok ? 'var(--ok)' : 'var(--bad)';
  }
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    const k = +btn.dataset.k; quizState[b.id]=k; saveAll(); apply(k); refreshStats();
  }));

}

function mountAgentLoop(id){
  const el = document.getElementById(id);

  const body =
    '<div class="loopgrid" id="'+id+'_g"></div>'+
    '<div class="preview" id="'+id+'_lg"></div>'+
    '<div class="btnrow">'+
      '<button class="btn primary" id="'+id+'_nx">Passo successivo</button>'+

      '<span class="hint" id="'+id+'_c" style="margin-left:auto"></span>'+

    timer = setInterval(next, 1600); draw();
  });
  draw();
}

function mountCmdLab(id){
  const el = document.getElementById(id);
  const st = store.get('cmdlab', {task:'Riassumi in 5 punti cosa fa questo script', fmt:0, wr:0, pipe:0, loop:0, tool:'pi'});
  const body =
    '<div class="split"><div>'+

        '<span class="lb">Output in formato stretto</span>'+
        '<span class="ds">Serve quando il risultato lo legge un altro comando, non una persona.</span></span></label>'+
      '<label class="chk"><input type="checkbox" id="'+id+'_wr"><span>'+
        '<span class="lb">Può scrivere file e lanciare comandi</span>'+
        '<span class="ds">Senza permessi resta fermo ad aspettare. Con i permessi, fa sul serio.</span></span></label>'+
      '<label class="chk"><input type="checkbox" id="'+id+'_pipe"><span>'+
        '<span class="lb">Riceve il testo da un altro comando (pipe)</span>'+
        '<span class="ds">Es. git diff | ... — il contenuto arriva da stdin.</span></span></label>'+
      '<label class="chk"><input type="checkbox" id="'+id+'_loop"><span>'+
        '<span class="lb">Ripetuto su tanti file</span>'+
        '<span class="ds">Il caso in cui il comando secco vale davvero la pena.</span></span></label>'+
    '</div><div>'+
      '<div class="tabs">'+
        '<button class="tab" data-f="pi">Pi</button>'+
        '<button class="tab" data-f="claude">Claude Code</button>'+
      '</div>'+
      '<div class="preview" id="'+id+'_pv"></div>'+
      '<div class="btnrow"><button class="btn" id="'+id+'_cp">Copia</button>'+
      '<span class="saved" id="'+id+'_sv">copiato</span></div>'+
      '<div class="diag" id="'+id+'_d"></div>'+
    '</div></div>';
  el.innerHTML = widgetShell('Lab 5.1','Costruisci il comando secco',
    'Stesso compito, senza sessione. Spunta cosa ti serve e guarda come cambia il comando — e cosa devi stare attento a non fare.', body);
  const t=document.getElementById(id+'_t'), pv=document.getElementById(id+'_pv'), dg=document.getElementById(id+'_d');
  t.value = st.task;
  ['fmt','wr','pipe','loop'].forEach(k=>{ document.getElementById(id+'_'+k).checked = !!st[k]; });
  let last='';
  function upd(){
    st.task=t.value; ['fmt','wr','pipe','loop'].forEach(k=>{ st[k]=document.getElementById(id+'_'+k).checked?1:0; });
    store.set('cmdlab',st);
    const task = (st.task||'IL TUO COMPITO').replace(/"/g,"'");
    const isPi = st.tool==='pi';
    const bin = isPi?'pi':'claude';
    let opts = '';
    if(st.fmt) opts += isPi ? ' --formato json' : ' --output-format json';
    if(st.wr)  opts += isPi ? ' --consenti-scrittura' : ' --allowedTools "Read,Write,Bash"';
    let full = '';
    const prompt = st.pipe ? (task+'. Il testo da analizzare arriva da stdin.') : task;
    const core = bin+' -p "'+prompt+'"'+opts;
    if(st.pipe) full = 'git diff | '+core;
    else full = core;
    if(st.loop){
      full = 'for f in src/*.ts; do\n'+
             '  echo "== $f"\n'+
             '  '+(st.pipe? 'cat "$f" | '+core : bin+' -p "'+prompt+' File: $f"'+opts)+'\n'+
             'done';
    }
    last = full;
    pv.textContent = full;
    el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.f===st.tool));
    const d=[];
    if(isPi) d.push(['ok','I nomi esatti delle opzioni di Pi li vedi con <code>pi --help</code>: la <strong>forma</strong> del comando è questa, i nomi possono cambiare da versione a versione.']);
    if(st.wr) d.push(['bad','Con i permessi di scrittura il comando fa modifiche senza chiederti niente. Usalo <strong>solo</strong> su una copia usa e getta o dentro un contenitore isolato — mai sulla repo vera.']);
    if(!st.wr && st.loop) d.push(['ok','Senza permessi di scrittura: legge e risponde, non tocca niente. È il modo giusto per i giri di analisi su tanti file.']);
    if(st.fmt) d.push(['ok','Con l\'output in formato stretto puoi passare il risultato a un altro comando. Ricordati di chiedere il formato <strong>anche dentro il compito</strong>: «rispondi solo con JSON valido, niente altro».']);
    if(!st.fmt && st.loop) d.push(['warn','Su tanti file senza un formato fisso, l\'output di ogni giro è diverso: difficile da rileggere e impossibile da elaborare. Chiedi un formato.']);
    if(st.pipe) d.push(['ok','In pipe il contenuto arriva da stdin: comodo per diff, log, output di altri comandi. Attenzione a cosa ci passi dentro: se il log ha dati personali, ripuliscilo prima.']);
    if(!st.task.trim()) d.push(['warn','Compito vuoto: nel comando secco non c\'è nessuno che possa chiarire dopo. Più il compito è preciso, meno giri buttati.']);
    dg.innerHTML = d.map(x=>'<div style="color:'+(x[0]==='bad'?'var(--bad)':x[0]==='warn'?'var(--warn)':'var(--ok)')+'">'+
      (x[0]==='bad'?'✗ ':x[0]==='warn'?'⚠ ':'✓ ')+x[1]+'</div>').join('');
  }
  el.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{ st.tool=x.dataset.f; upd(); }));
  t.addEventListener('input',upd);
  ['fmt','wr','pipe','loop'].forEach(k=>document.getElementById(id+'_'+k).addEventListener('change',upd));
  document.getElementById(id+'_cp').addEventListener('click',()=>{
    navigator.clipboard && navigator.clipboard.writeText(last);
    const sv=document.getElementById(id+'_sv'); sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'),1400);
  });
  upd();
}

    '<span class="idx">'+m.n+'</span><span><span class="nt">'+m.title+'</span><span class="nm">'+m.min+' minuti</span></span>'+
    (done[m.id]?'<span class="tick">●</span>':'')+'</button>').join('');
  nav.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
}

function renderModule(){
  const m=MODULES[current];
  mounts.length=0;
  const main=document.getElementById('main');
  const isBreak = m.id==='brk';
  let html='';
  if(!isBreak){
    html+='<div class="eyebrow">Modulo '+m.n+' · '+m.min+' minuti</div><h1>'+m.title+'</h1>';
    html+='<div class="mod-meta"><span class="badge">'+(current+1)+' di '+MODULES.length+'</span>'+
      '<span class="badge" id="modTimer">⏱ --:--</span>'+
      '<label class="chk" style="margin:0;padding:6px 11px"><input type="checkbox" id="modDone" '+(done[m.id]?'checked':'')+'><span class="lb" style="font-weight:600;font-size:13px">Modulo completato</span></label></div>';
  }
  html+=m.blocks.map((b,i)=>renderBlock(b,m.id,i)).join('');
  html+='<div class="footnav">'+
    (current>0?'<button class="btn" id="prevBtn">← '+MODULES[current-1].title+'</button>':'<span></span>')+
    (current<MODULES.length-1?'<button class="btn primary" id="nextBtn">'+MODULES[current+1].title+' →</button>':'<span></span>')+
    '</div>';
  main.innerHTML=html;
  mounts.forEach(f=>f());
  const pb=document.getElementById('prevBtn'); if(pb) pb.addEventListener('click',()=>go(current-1));
  const nb=document.getElementById('nextBtn'); if(nb) nb.addEventListener('click',()=>{
    if(!isBreak && !done[m.id]){ done[m.id]=true; saveAll(); }
    go(current+1);
  });
  const md=document.getElementById('modDone');
  if(md) md.addEventListener('change',()=>{ if(md.checked) done[m.id]=true; else delete done[m.id]; saveAll(); renderNav(); refreshStats(); });
  window.scrollTo({top:0,behavior:'instant'});
  updModTimer();
}

function go(i){
  if(i<0||i>=MODULES.length) return;
  current=i; store.set('current',i); renderNav(); renderModule(); refreshStats();
}

/* ============================================================
   TIMER
   ============================================================ */
const TOTAL=4*3600;
let elapsed=store.get('elapsed',0), running=false, tick=null;
let modStart=null;
function fmt(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function paintClock(){
  const c=document.getElementById('clock');
  c.textContent=fmt(elapsed)+' / 4:00:00';
  c.style.color = elapsed>TOTAL?'var(--bad)': elapsed>TOTAL*0.9?'var(--warn)':'';
}
function updModTimer(){
  const e=document.getElementById('modTimer'); if(!e) return;
  const m=MODULES[current];
  const spent = modStart!==null? Math.floor((elapsed-modStart)) : 0;
  e.textContent='⏱ '+Math.floor(spent/60)+' / '+m.min+' min';
  e.style.color = spent/60>m.min?'var(--warn)':'';
}
function toggleTimer(){
  running=!running;
  const b=document.getElementById('timerBtn');
  b.textContent = running?'⏸ Pausa timer':'▶ Avvia timer';
  if(running){ if(modStart===null) modStart=elapsed;
    tick=setInterval(()=>{ elapsed++; store.set('elapsed',elapsed); paintClock(); updModTimer(); },1000); }
  else clearInterval(tick);
}

/* ============================================================
   STATS / EXPORT / TEMA
   ============================================================ */
function allBlocks(t){ return MODULES.flatMap(m=>m.blocks.filter(b=>b.t===t).map(b=>({m:m,b:b}))); }

function refreshStats(){
  const quizzes = allBlocks('quiz');
  const aQ=Object.keys(quizState).length;
  const okQ=quizzes.filter(x=>quizState[x.b.id]!==undefined && x.b.opts[quizState[x.b.id]].ok).length;
  const exIds=allBlocks('exercise').map(x=>x.b.id);
  const aE=exIds.filter(k=>(answers[k]||'').trim().length>20).length;
  const kits=allBlocks('promptkit');
  const aK=kits.filter(x=>x.b.fields.some(f=>(answers[x.b.id+'.'+f.k]||'').trim().length>10)).length;
  const planN=PLAN.filter(f=>(answers['plan.'+f.k]||'').trim().length>20).length;
  const dM=Object.keys(done).length;
  const nM=MODULES.filter(m=>m.id!=='brk').length;
  document.getElementById('statsBox').innerHTML=
    'Moduli completati <strong>'+dM+'/'+nM+'</strong><br>'+
    'Quiz risposti <strong>'+aQ+'/'+quizzes.length+'</strong>'+(aQ?' · corretti <strong>'+okQ+'</strong>':'')+'<br>'+
    'Esercizi svolti <strong>'+aE+'/'+exIds.length+'</strong><br>'+
    'Compiti composti <strong>'+aK+'/'+kits.length+'</strong><br>'+
    'Piano <strong>'+planN+'/'+PLAN.length+'</strong> sezioni';
  const tot=nM+quizzes.length+exIds.length+kits.length+PLAN.length;
  document.getElementById('pbar').style.width=((dM+aQ+aE+aK+planN)/tot*100)+'%';
}

function doExport(planOnly){
  const L=[];
  const d=new Date();
  const stamp=d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  L.push('# Coding Agents — 4 ore');
  L.push('');
  L.push('Esportato il '+stamp+'  ·  tempo d’aula registrato: '+fmt(elapsed));
  L.push('');
  if(!planOnly){
    L.push('## Risposte agli esercizi');
    allBlocks('exercise').forEach(x=>{
      const v=(answers[x.b.id]||'').trim();
      L.push(''); L.push('### '+x.m.n+' — '+x.b.label);
      L.push(''); L.push('> '+x.b.prompt);
      L.push(''); L.push(v||'_(non compilato)_');
    });
    L.push(''); L.push('## Compiti composti (da riusare)');
    allBlocks('promptkit').forEach(x=>{
      const v={}; let any=false;
      x.b.fields.forEach(f=>{ v[f.k]=(answers[x.b.id+'.'+f.k]||'').trim(); if(v[f.k]) any=true; });
      L.push(''); L.push('### '+x.m.n+' — '+x.b.title);
      L.push('');
      if(!any){ L.push('_(non compilato)_'); }
      else { L.push('```'); L.push(x.b.build(v)); L.push('```'); }
    });
    L.push(''); L.push('## Quiz');
    allBlocks('quiz').forEach(x=>{
      const k=quizState[x.b.id];
      L.push('- **'+x.b.q.replace(/<[^>]+>/g,'')+'**');
      L.push('  - Risposta data: '+(k===undefined?'_nessuna_':x.b.opts[k].tx+(x.b.opts[k].ok?' ✅':' ❌')));
      if(k!==undefined&&!x.b.opts[k].ok) L.push('  - Corretta: '+x.b.opts.find(o=>o.ok).tx);
    });
    L.push(''); L.push('## Checklist');
    allBlocks('checklist').forEach(x=>{
      const s=store.get('ck.'+x.b.id,[]);
      L.push(''); L.push('### '+x.m.n+' — '+x.b.title);
      x.b.items.forEach((it,i)=>L.push('- ['+(s[i]?'x':' ')+'] '+it));
    });
    const tr=store.get('triage',null);
    if(tr && Object.keys(tr).length){
      L.push(''); L.push('## Esercizio «Dove lo metti?»');
      let ok=0, tot=0;
      TRIAGE.forEach((it,k)=>{ if(tr[k]!==undefined){ tot++; if(tr[k]===it.a) ok++;
        L.push('- '+(tr[k]===it.a?'✅':'❌')+' '+it.tx+' → hai scelto **'+TR_LB[tr[k]]+'**'+(tr[k]===it.a?'':', corretta: **'+TR_LB[it.a]+'**')); } });
      L.push('');
      L.push('**'+ok+'/'+tot+' corrette.**');
    }
  }
  L.push(''); L.push('## Piano di adozione');
  PLAN.forEach(f=>{ L.push(''); L.push('### '+f.lb); L.push(''); L.push((answers['plan.'+f.k]||'').trim()||'_(non compilato)_'); });
  const blob=new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(planOnly?'piano-adozione-coding-agents':'corso-agents-coding')+'.md';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ============================================================
   BOOT
   ============================================================ */
document.getElementById('timerBtn').addEventListener('click',toggleTimer);
document.getElementById('exportBtn').addEventListener('click',()=>doExport(false));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t); store.set('theme',t);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('Azzerare tutte le risposte, le checklist e il timer? Non si torna indietro.')) return;
  store.clearAll(); location.reload();
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});
if(!store.get('theme',null) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');
else document.documentElement.setAttribute('data-theme', store.get('theme','light'));

renderNav(); renderModule(); paintClock(); refreshStats();
</script>
</body>
