<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Agents — Teoria e laboratorio · Programma 4 ore</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel-2:#f1f1ee; --text:#1c1c1a; --muted:#6b6b63;
  --line:#e2e2dc; --accent:#c2451f; --accent-soft:#fdefe9; --ok:#1f7a4d; --ok-soft:#e8f5ee;
  --warn:#8a5a00; --warn-soft:#fdf3e0; --bad:#a52020; --bad-soft:#fbeaea;
  --code-bg:#1e1e1c; --code-text:#f0efe9; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141413; --panel:#1e1e1c; --panel-2:#26261f; --text:#f0efe9; --muted:#a3a39a;
  --line:#33332c; --accent:#e8825c; --accent-soft:#2e211c; --ok:#5ec48d; --ok-soft:#17281f;
  --warn:#e0b45f; --warn-soft:#2a2318; --bad:#e88b8b; --bad-soft:#2b1a1a;
  --code-bg:#0f0f0e; --code-text:#e8e7e1; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 18px;
}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}
.pill{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.pill.ghost{background:transparent}
.pill:hover{border-color:var(--accent)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress-wrap{width:100%;height:3px;background:var(--panel-2)}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

.shell{display:grid;grid-template-columns:274px minmax(0,1fr);gap:0;align-items:start}
nav.side{
  position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg);
}
nav.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 8px 8px}
.navitem{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;
  color:var(--text);padding:8px 10px;border-radius:9px;margin-bottom:2px;line-height:1.35;
}
.navitem:hover{background:var(--panel-2)}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none;padding-top:2px}
.navitem.active .idx{color:var(--accent)}
.navitem .nt{font-size:13.5px}
.navitem .nm{font-size:11px;color:var(--muted);display:block}
.navitem .tick{margin-left:auto;color:var(--ok);font-size:12px;flex:none}

main{padding:30px 34px 90px;max-width:920px;margin:0 auto;width:100%}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:31px;line-height:1.18;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:21px;letter-spacing:-.01em;margin:38px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:24px 0 8px}
.lede{color:var(--muted);font-size:15px;margin:0 0 4px}
.prose{font-size:15px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:12px 0;padding-left:22px}
.prose li{margin:6px 0}
.prose strong{font-weight:650}
code{font-family:var(--mono);font-size:.875em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
pre{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:var(--radius);overflow-x:auto;font-size:12.5px;line-height:1.55;margin:14px 0}
pre code{background:none;border:0;padding:0;color:inherit;font-size:12.5px}

.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:13px 16px;margin:16px 0;font-size:14px;box-shadow:var(--shadow)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout .ct{display:block;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.grid{display:grid;gap:12px;margin:16px 0}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card h5{margin:0 0 5px;font-size:13.5px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tablewrap table{margin:0}

/* ---------- widgets ---------- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:20px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.widget-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;flex:none}
.widget-t{font-weight:650;font-size:15px}
.widget-s{color:var(--muted);font-size:13.5px;margin:2px 0 14px}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:10px 13px;margin-bottom:7px;font-size:14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-ok{border-color:var(--ok)}
.opt .mk{font-family:var(--mono);font-weight:700;margin-right:8px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin-top:6px;padding-left:2px;display:none}
.opt.shown .why{display:block}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:6px;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;flex:none;accent-color:var(--accent);width:15px;height:15px}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .lb{font-weight:600}
.chk .ds{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-h{padding:7px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pane.bad .pane-h{background:var(--bad-soft);color:var(--bad)}
.pane.ok .pane-h{background:var(--ok-soft);color:var(--ok)}
.pane pre{margin:0;border-radius:0;max-height:340px}

.preview{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:400px;overflow-y:auto;min-height:80px}
.meter{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scoreline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-family:var(--mono)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--mono)}
.tab:hover{border-color:var(--accent)}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

textarea,input[type="text"],select{
  width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fl{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:.3s}
.saved.on{opacity:1}

.sorter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:7px}
.sorter-row .it{flex:1 1 240px;font-size:13.5px}
.sorter-row .bs{display:flex;gap:5px;flex:none}
.bbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:650}
.bbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sorter-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.sorter-row.bad{border-color:var(--bad);background:var(--bad-soft)}
.sorter-row .fb{flex:1 1 100%;font-size:12.5px;color:var(--muted);display:none}
.sorter-row.done .fb{display:block}

.diag{margin-top:12px;font-size:13.5px}
.diag div{padding:6px 0;border-top:1px dashed var(--line)}

/* ---------- ciclo dell'agente ---------- */
.loopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.lstep{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 11px;font-size:13px;opacity:.45;transition:.2s}
.lstep.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.lstep.past{opacity:.85}
.lstep b{display:block;font-size:11px;font-family:var(--mono);color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.lstep span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}

/* ---------- builder file di contesto ---------- */
.fl-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:5px;cursor:pointer;font-size:13.5px}
.fl-row input{margin-top:4px;flex:none;accent-color:var(--accent);width:15px;height:15px}
.fl-row.on{border-color:var(--accent);background:var(--accent-soft)}
.fl-row .w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-top:2px}
.fl-sec{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;font-weight:700}

.footnav{display:flex;justify-content:space-between;gap:10px;margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}
.timerbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 24px}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:290px}
  main{padding:22px 16px 70px}
  h1{font-size:25px}
}
@media print{
  nav.side,header.top,.footnav,.btnrow{display:none}
  main{max-width:none;padding:0}
  .widget,.card,.callout{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span><span>Coding Agents<small>Programma formativo — 4 ore, teoria + laboratorio su codice vero</small></span></div>
  <div class="spacer"></div>
  <div class="timerbox">
    <button class="pill ghost" id="timerBtn">▶ Avvia timer</button>
    <span class="pill clock" id="clock">00:00:00 / 4:00:00</span>
  </div>
  <button class="pill ghost" id="exportBtn" title="Scarica risposte e note in Markdown">⬇ Esporta</button>
  <button class="pill ghost" id="themeBtn" title="Tema chiaro/scuro">◐</button>
</header>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

<div class="shell">
  <nav class="side">
    <h4>Programma</h4>
    <div id="nav"></div>
    <h4 style="margin-top:18px">Avanzamento</h4>
    <div style="padding:0 10px;font-size:12.5px;color:var(--muted)" id="statsBox"></div>
    <div style="padding:10px">
      <button class="btn" id="resetBtn" style="width:100%;font-size:12px">Azzera avanzamento</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   STATO + PERSISTENZA
   ============================================================ */
const NS = 'agc8h.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} },
  clearAll(){ try{ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};
let current = store.get('current', 0);
let done = store.get('done', {});
let answers = store.get('answers', {});
let quizState = store.get('quiz', {});

function saveAll(){ store.set('done', done); store.set('answers', answers); store.set('quiz', quizState); }

/* ============================================================
   CONTENUTI
   ============================================================ */
const MODULES = [];

/* ---------- 0. Apertura ---------- */
MODULES.push({
  id:'m0', n:'00', title:'Apertura', min:5,
  blocks:[
    {t:'p',html:`<p>Il corso è diviso in due metà. Nella prima impari come funziona e ti alleni su script piccoli, dove se sbagli non succede niente. Nella seconda lavori su una repo vera del tuo lavoro: capire, analizzare, aggiungere, testare, debuggare.</p>`},
    {t:'cards',cards:[
      {tag:'Ora 1',h:'Teoria',p:'Cosa sono, quali sono, i file che leggono (AGENTS.md e CLAUDE.md), le skill.'},
      {tag:'Ora 2',h:'Primi task',p:'Installare Pi, creare e modificare script, usarlo in sessione e con un solo comando.'},
      {tag:'Ora 3',h:'Codice vero',p:'Capire un progetto sconosciuto, aggiungere un comando nuovo alla CLI.'},
      {tag:'Ora 4',h:'Lavoro vero',p:'Aggiungere una funzione, test di concorrenza, un test BDD, debug da log e payload.'}
    ]},
    {t:'table',head:['Blocco','Durata'],rows:[
      ['00 · Apertura','5 min'],
      ['01 · Cosa sono i coding agent','18 min'],
      ['02 · I file che l\'agente legge: AGENTS.md e CLAUDE.md','22 min'],
      ['03 · Le skill','14 min'],
      ['04 · Task 1 — Installare Pi','12 min'],
      ['05 · Task 2 — Creare e modificare script','28 min'],
      ['— Pausa','10 min'],
      ['06 · Task 3 — Capire un progetto vero','28 min'],
      ['07 · Task 4 — Aggiungere una nuova funzionalità da essere usata con la CLI','22 min'],
      ['08 · Task 5 — Aggiungere una piccola funzione','22 min'],
      ['09 · Task 6 — Script di test con concorrenza','14 min'],
      ['10 · Task 7 — Un test BDD','14 min'],
      ['11 · Task 8 — Debug da log e payload','20 min'],
      ['12 · Chiusura','11 min']
    ]},
    {t:'callout',kind:'ok',title:'Come si usa questo materiale',html:`Naviga con la barra a sinistra o con i pulsanti in fondo a ogni modulo. Ogni esercizio si salva da solo nel browser (niente esce dal tuo computer): puoi chiudere e riprendere. Con <strong>&#8681; Esporta</strong> scarichi tutte le tue risposte in un file Markdown. Il timer in alto serve al docente per tenere il ritmo.`},
    {t:'p',html:`<h3>Cosa devi saper fare a fine giornata</h3>
      <ol>
        <li>Spiegare con parole tue cosa fa un coding agent e dove sbaglia di più.</li>
        <li>Scrivere un <code>AGENTS.md</code> o <code>CLAUDE.md</code> corto e utile per un progetto tuo.</li>
        <li>Capire quando serve una skill e come si scrive.</li>
        <li>Usare Pi sia in sessione sia con un solo comando dal terminale.</li>
        <li>Far capire all'agente un progetto che non conosce, e verificare che abbia capito davvero.</li>
        <li>Farti aiutare su un fix, un test e un debug, controllando il risultato passo per passo.</li>
      </ol>`}
  ]
});

/* ---------- 1. Cosa sono i coding agent ---------- */
MODULES.push({
  id:'m1', n:'01', title:'Cosa sono i coding agent', min:18,
  blocks:[
    {t:'p',html:`
      <p>Un <strong>coding agent</strong> è un programma che riceve un compito scritto a parole, <strong>legge i file del tuo progetto, lancia comandi sul tuo computer, scrive o modifica codice, guarda cosa è successo e riprova</strong> finché il compito è finito o finché si ferma a chiederti qualcosa.</p>
      <p>Dentro c'è un modello linguistico, ma il modello da solo non basta. Servono tre pezzi:</p>`},
    {t:'cards',cards:[
      {tag:'1',h:'Il modello',p:'Decide cosa fare al passo successivo. Non fa nulla da solo: dice solo "adesso leggi questo file".'},
      {tag:'2',h:'Gli strumenti',p:'Leggi file, scrivi file, cerca nel codice, lancia un comando di shell, apri una pagina web.'},
      {tag:'3',h:'Il ciclo',p:'Il programma esegue lo strumento, rimanda il risultato al modello e riparte. Finché non ha finito.'}
    ]},
    {t:'p',html:`<p>Una chat risponde una volta e si ferma. Un agente <strong>va avanti da solo</strong>: se un test fallisce lo legge, capisce perché e riprova. Se un file non esiste lo cerca altrove. Ogni giro costa tempo e token, ma il lavoro lo porta avanti lui.</p>`},
    {t:'agentloop'},
    {t:'callout',kind:'',title:'Una cosa importante da capire',html:`L'agente <strong>non ricorda niente</strong> fra una sessione e l'altra. Ogni volta che lo avvii riparte da zero e non sa nulla del tuo progetto. Tutto quello che sa arriva da: le tue parole, i file che legge in quel momento, e i file di contesto (modulo 02)`},

    {t:'p',html:`<h3>Quali sono</h3>`},
    {t:'table',head:['Strumento','Dove gira','Note'],rows:[
      ['<strong>Claude Code</strong> (Anthropic)','Terminale, estensione IDE, web','Molto usato su codebase grandi. Legge <code>CLAUDE.md</code>. Ha skill, sub-agenti, hook.'],
      ['<strong>Pi</strong>','Terminale','Leggero e veloce da configurare. È quello che usiamo oggi nei laboratori.'],
      ['<strong>Codex CLI</strong> (OpenAI)','Terminale','Simile come idea. Legge <code>AGENTS.md</code>.'],
      ['<strong>Gemini CLI</strong> (Google)','Terminale','Open source, generoso nel piano gratuito.'],
      ['<strong>Cursor</strong> / <strong>Windsurf</strong>','Editor completo','Editor con l\'agente dentro. Comodi se vivi nell\'IDE.'],
      ['<strong>Cline</strong> / <strong>Roo Code</strong>','Estensione VS Code','Open source, scegli tu il modello dietro.'],
      ['<strong>Aider</strong>','Terminale','Open source, storico, lavora molto a colpi di commit git.'],
      ['<strong>Agenti in cloud</strong>','Su un server remoto','Gli dai una issue e ti tornano una pull request. Utili per lavori isolati e ripetitivi.']
    ]},
    {t:'callout',kind:'ok',title:'La buona notizia',html:`Quello che impari oggi non è legato a uno strumento. Il modo di dare i compiti, i file di contesto, il modo di controllare il lavoro: <strong>funzionano uguale su tutti</strong>. Cambiano i nomi dei comandi, non il metodo.`},

    {t:'p',html:`<h3>I due modi di usarlo</h3>

    {t:'p',html:`<h3>Il punto delicato: lancia comandi veri</h3>
      <p>Un agente può cancellare file, fare <code>git reset</code>, mandare richieste in rete, toccare un database. Non è teoria: succede. Tre regole che valgono sempre, da oggi in poi:</p>

    {t:'p',html:`<p>Il salto vero è fra la seconda e la terza riga. Con la chat il lavoro di applicare le modifiche resta tuo. Con l'agente il lavoro passa a lui, e il tuo lavoro diventa un altro: <strong>dare il compito bene e controllare il risultato</strong>.</p>`},

    {t:'p',html:`<h3>Da dove nasce il problema</h3>
      <p>Hai appena imparato che il file di contesto va tenuto corto. Ma ci sono cose lunghe che ogni tanto servono davvero: la procedura per fare una release, le dieci regole di stile per le nostre API, come si scrive un report di incidente da noi.</p>
      <p>Se le metti in <code>AGENTS.md</code> le paghi sempre, anche i giorni in cui nessuno fa una release. Se non le metti da nessuna parte, l'agente le inventa.</p>
      <p>Le <strong>skill</strong> risolvono proprio questo: sono istruzioni che stanno da parte e <strong>vengono caricate solo quando servono</strong>.</p>`},
    {t:'cards',cards:[
      {tag:'Sempre',h:'AGENTS.md / CLAUDE.md',p:'Poche righe, presenti a ogni messaggio. Il costo fisso.'},
      {tag:'Su richiesta',h:'Skill',p:'Cartelle di istruzioni. Sempre visibile solo il nome e una riga di descrizione.'},
      {tag:'Mai da sole',h:'docs/',p:'Documenti normali. Entrano solo se qualcuno (tu o l\'agente) li apre.'}
    ]},

    {t:'p',html:`<h3>Com'è fatta una skill</h3>
      <p>Una cartella con dentro un file <code>SKILL.md</code>. Sopra al file ci sono due campi obbligatori: il <strong>nome</strong> e la <strong>descrizione</strong>. Sotto, le istruzioni vere.</p>`},
    {t:'code',lang:'text',code:`.claude/skills/
  release/
    SKILL.md            <- nome, descrizione, istruzioni
    checklist.md        <- file di appoggio, letti solo se servono

    {t:'code',lang:'markdown',code:`---
name: release
description: Procedura per pubblicare una nuova versione del pacchetto.
  Usala quando l'utente chiede di fare una release, pubblicare una
  versione, o preparare un changelog per il rilascio.
---

# Come si fa una release

1. Controlla che il branch sia main e che git sia pulito.
2. Lancia pnpm test e pnpm lint: devono passare entrambi.
3. Aggiorna la versione con ./scripts/bump-version.sh <maggiore|minore|patch>.
4. Genera il changelog dai commit dall'ultimo tag (vedi checklist.md
   per il formato esatto delle voci).
5. Crea il tag e fermati: la pubblicazione la fa la pipeline.

## Non fare mai
- Non pubblicare da un branch diverso da main.
- Non modificare a mano il campo version in package.json.`},

    {t:'callout',kind:'warn',title:'La descrizione è la parte più importante',html:`Di tutta la skill, l'unica cosa che l'agente ha davanti sempre è <strong>nome + descrizione</strong>. È su quella riga che decide se aprirla. Quindi la descrizione non deve dire <em>cos'è</em> la skill: deve dire <strong>quando usarla</strong>, con le parole che userebbe chi la chiede. Se scrivi «gestione release» non si attiverà quasi mai. Se scrivi «usala quando l'utente chiede di pubblicare una versione, fare una release, preparare un changelog», si attiva.`},

    {t:'p',html:`<h3>Il meccanismo, in tre livelli</h3>
      <p>È lo stesso principio dell'indice di un libro, portato all'estremo:</p>`},
    {t:'table',head:['Livello','Cosa entra nel contesto','Quando'],rows:[
      ['1','Nome + descrizione (una o due righe)','Sempre. Costa pochissimo.'],
      ['2','Il corpo di <code>SKILL.md</code>','Solo quando l\'agente decide che quella skill serve.'],
      ['3','I file di appoggio e gli script','Solo se il corpo dice di aprirli o lanciarli.']
    ]},
    {t:'p',html:`<p>Risultato: puoi avere venti skill da cinque pagine l'una e pagarne quaranta righe in tutto, finché non ne serve una.</p>`},

    {t:'p',html:`<h3>Dove si mettono</h3>`},
    {t:'code',lang:'text',code:`~/.claude/skills/<nome>/SKILL.md          tue, su tutti i progetti
<progetto>/.claude/skills/<nome>/SKILL.md  del progetto, in git,
                                           condivise con il team`},
    {t:'p',html:`<p>Le skill del progetto sono la cosa interessante per un team: <strong>metti in git il modo in cui da voi si fanno le cose</strong>, e vale per tutti quelli che lavorano sulla repo.</p>`},

    {t:'p',html:`<h3>Quando fare una skill e quando no</h3>`},
    {t:'table',head:['Se...','Allora'],rows:[
      ['È una regola breve che vale sempre','Una riga in <code>AGENTS.md</code>. Non serve una skill.'],
      ['È una procedura lunga che serve ogni tanto','<strong>Skill.</strong> È esattamente il caso giusto.'],
      ['È un compito che lanci tu, sempre uguale','Un comando personalizzato (slash command). Lo attivi tu, non l\'agente.'],
      ['È solo documentazione da leggere per capire','Un file in <code>docs/</code>, richiamato da <code>AGENTS.md</code>.'],
      ['Serve una connessione a un sistema esterno','Non è una skill: serve un server MCP (dà strumenti nuovi, non istruzioni).']
    ]},
    {t:'callout',kind:'',title:'Regola pratica',html:`Se ti accorgi che stai spiegando la stessa procedura all'agente per la terza volta, e la spiegazione è più lunga di dieci righe: <strong>quella è una skill</strong>. Scrivila una volta e non spiegarla mai più.`},

    {t:'p',html:`<h3>Come si scrive una skill buona</h3>
      <ul>
        <li><strong>Un compito, una skill.</strong> Se la descrizione ha una "e" in mezzo, probabilmente sono due skill.</li>
        <li><strong>Passi numerati, verbi all'imperativo.</strong> Non spiegare la teoria: dì cosa fare.</li>
        <li><strong>Metti la sezione "non fare mai".</strong> È quella che salva più spesso.</li>
        <li><strong>Se c'è uno script, chiama lo script.</strong> Un comando deterministico batte dieci righe di istruzioni.</li>
        <li><strong>Provala.</strong> Apri una sessione nuova, chiedi la cosa con parole normali e guarda se la skill si attiva da sola. Se non si attiva, il problema è la descrizione.</li>
      </ul>`},
    {t:'quiz',id:'q3a',q:'Qual è la differenza vera fra una riga in AGENTS.md e una skill?',
      opts:[
        {tx:'La skill può contenere più testo',ok:false,why:'Vero, ma è una conseguenza, non la differenza di fondo.'},
        {tx:'AGENTS.md è sempre nel contesto; della skill è sempre visibile solo la descrizione, il resto entra quando serve',ok:true,why:'Esatto. È una scelta su cosa paghi sempre e cosa paghi ogni tanto. Per questo le procedure lunghe e rare stanno bene nelle skill.'},
        {tx:'Le skill valgono per tutti i progetti, AGENTS.md solo per uno',ok:false,why:'Tutte e due possono stare sia nel progetto sia nella tua cartella personale.'},
        {tx:'Le skill possono lanciare comandi, AGENTS.md no',ok:false,why:'I comandi li lancia l\'agente in entrambi i casi. Una skill può però portarsi dietro degli script pronti.'}
      ]},
    {t:'quiz',id:'q3b',q:'Una tua skill non si attiva mai da sola. Da dove parti?',
      opts:[
        {tx:'Riscrivo le istruzioni dentro al corpo',ok:false,why:'Il corpo non c\'entra: se la skill non si apre, quel testo non è mai stato letto.'},
        {tx:'Riscrivo la descrizione dicendo quando usarla, con le parole che userebbe chi la chiede',ok:true,why:'Esatto. La descrizione è l\'unica cosa su cui l\'agente decide. Deve contenere i termini reali della richiesta, non il nome interno della procedura.'},
        {tx:'Sposto la skill nella cartella personale',ok:false,why:'Cambia solo dove vale, non se si attiva.'},
        {tx:'Aggiungo più file di appoggio',ok:false,why:'Peggiora e basta: quei file si leggono solo dopo che la skill si è aperta.'}
      ]},
    {t:'exercise',id:'ex3',label:'Esercizio 3.1 — Una skill del tuo lavoro (5 minuti)',
      prompt:'Pensa a una procedura che nel tuo team spieghi sempre a voce. Scrivi il nome, la descrizione (quando usarla) e i primi 5 passi.',
      placeholder:'name: ...\ndescription: Usala quando l\'utente chiede di ...\n\n1. ...\n2. ...\n3. ...\n\n## Non fare mai\n- ...',
      solution:'Prova la descrizione così: leggila e chiediti «se un collega mi chiedesse questa cosa, userebbe queste parole?». Se la tua descrizione dice «gestione del processo di onboarding tenant» ma il collega direbbe «devo aggiungere un cliente nuovo», la skill non si attiverà. Metti dentro tutte e due le formulazioni.'}
  ]
});

/* ---------- 4. Task 1: installare Pi ---------- */
MODULES.push({
  id:'m4', n:'04', title:'Task 1 — Installare Pi', min:12,
  blocks:[
    {t:'p',html:`<p>Nei laboratori usiamo <strong>Pi</strong>: è un agente da terminale leggero e si configura in pochi minuti. Chi ha già <strong>Claude Code</strong> può usare quello: i compiti sono identici, cambiano solo i nomi dei comandi. Nelle schede che seguono trovi sempre tutte e due le versioni.</p>`},
    {t:'callout',kind:'warn',title:'Prima di partire, controlla questi tre',html:`<code>node --version</code> deve dire <strong>18 o più</strong>. <code>git --version</code> deve rispondere qualcosa. E devi avere la <strong>chiave API</strong> (te la dà il docente). Se manca uno dei tre, fermati qui e sistemalo: senza, i moduli dopo non funzionano.`},

    {t:'p',html:`<h3>Passo 1 — Installare</h3>
      <p>Pi si installa come un qualsiasi pacchetto globale di Node:</p>`},
    {t:'code',lang:'bash',code:`# Pi
npm install -g <nome-pacchetto-pi>

# In alternativa, Claude Code
npm install -g @anthropic-ai/claude-code`},
    {t:'callout',kind:'',title:'Il nome esatto del pacchetto',html:`Il nome del pacchetto npm di Pi te lo dà il docente a inizio esercitazione (oppure lo trovi sul README ufficiale del progetto). La <strong>forma</strong> del comando è quella qui sopra e non cambia. Se l'installazione globale ti dà un errore di permessi, non usare <code>sudo</code>: configura una cartella npm tua, oppure lancia lo strumento con <code>npx</code> senza installarlo.`},

    {t:'p',html:`<h3>Passo 2 — Controllare che ci sia</h3>`},
    {t:'code',lang:'bash',code:`pi --version
# oppure
claude --version

# Se dice "command not found", la cartella dei pacchetti globali
# non e' nel PATH. Controlla dove sono finiti:
npm prefix -g`},

    {t:'p',html:`<h3>Passo 3 — La chiave API</h3>
      <p>Due modi. Il primo è una variabile d'ambiente: comoda, ma se la metti nel file di configurazione della shell resta scritta in chiaro sul disco.</p>`},
    {t:'code',lang:'bash',code:`# Solo per questa finestra di terminale (la piu' sicura in aula)
export ANTHROPIC_API_KEY="la-tua-chiave"

# Per renderla permanente (attenzione: resta scritta in chiaro)
echo 'export ANTHROPIC_API_KEY="la-tua-chiave"' >> ~/.zshrc
source ~/.zshrc`},
    {t:'p',html:`<p>Il secondo modo è l'accesso guidato al primo avvio: lanci lo strumento senza chiave e ti apre una pagina per fare login. Se la tua azienda usa un account aziendale, di solito è questa la strada giusta.</p>`},
    {t:'callout',kind:'bad',title:'Tre cose da non fare mai con la chiave',html:`Non metterla in un file dentro la repo. Non incollarla in una chat o in una issue. Non usare la chiave di produzione per esercitarti. Se ti scappa, <strong>revocala subito</strong> dal pannello: una chiave revocata è un fastidio, una chiave in giro è un problema.`},

    {t:'p',html:`<h3>Passo 4 — Primo avvio</h3>`},
    {t:'code',lang:'bash',code:`mkdir ~/prova-agente && cd ~/prova-agente
git init

pi          # oppure: claude

# Si apre la sessione. Scrivi:
> ciao, dimmi in che cartella sei e cosa vedi`},
    {t:'p',html:`<p>Se ti risponde citando la cartella giusta, hai finito: funziona. Se risponde in inglese e vuoi l'italiano, aggiungilo al tuo file personale (<code>~/.claude/CLAUDE.md</code>): <em>«Rispondi sempre in italiano.»</em></p>`},

    {t:'p',html:`<h3>I comandi della sessione che userai davvero</h3>
      <p>Cambiano un po' da strumento a strumento, ma questi cinque ci sono sempre. Vale la pena impararli ora, perché li userai tutto il giorno.</p>`},
    {t:'table',head:['Cosa vuoi fare','Come'],rows:[
      ['Fermarlo mentre lavora','<code>Esc</code> (o <code>Ctrl+C</code>). Serve più spesso di quanto pensi: se ha preso la strada sbagliata, fermalo subito.'],
      ['Ripulire e ricominciare','<code>/clear</code>. Fra un compito e l\'altro: il contesto vecchio confonde.'],
      ['Vedere quanto contesto hai usato','<code>/context</code> o <code>/status</code>, a seconda dello strumento.'],
      ['Uscire','<code>/exit</code> o <code>Ctrl+D</code>.'],
      ['Vedere i comandi disponibili','<code>/help</code>. Il primo da provare.']
    ]},
    {t:'callout',kind:'ok',title:'Abitudine da prendere subito',html:`<strong>Un compito, una sessione.</strong> Finito un compito, <code>/clear</code>. Il contesto sporco del compito precedente è una delle cause più frequenti di risposte strane: l'agente continua a ragionare su file che non c'entrano più.`},

    {t:'checklist',id:'ck4',title:'Task 1 completato quando...',
      items:[
        'node --version dice 18 o più',
        'Il comando dell\'agente risponde a --version',
        'La chiave API è configurata e non è dentro nessuna repo',
        'Ho aperto una sessione in una cartella di prova e mi ha risposto',
        'Ho provato /help e so come fermarlo (Esc) e come uscire',
        'So dove sta il mio file personale di contesto'
      ]},
    {t:'tablewrap',head:['Problema','Cosa succede','Cosa fare'],rows:[
      ['<code>command not found</code>','Installato ma non trovato','La cartella dei binari globali non è nel PATH. Guarda <code>npm prefix -g</code> e aggiungi <code>/bin</code> al PATH.'],
      ['<code>EACCES</code> in installazione','Permessi negati','Non usare <code>sudo</code>. Configura una cartella npm personale, oppure usa <code>npx</code>.'],
      ['<code>401</code> / <code>invalid api key</code>','Chiave sbagliata o non letta','Controlla con <code>echo $ANTHROPIC_API_KEY</code>. Spesso è uno spazio o un a capo copiato insieme alla chiave.'],
      ['<code>429</code>','Troppe richieste','Limite raggiunto. Aspetta, o usa un modello più piccolo per gli esercizi.'],
      ['Risponde in inglese','Nessuna preferenza impostata','Metti «Rispondi in italiano» nel tuo file personale di contesto.']
    ]}
  ]
});

/* ---------- 5. Task 2: script semplici ---------- */
MODULES.push({
  id:'m5', n:'05', title:'Task 2 — Creare e modificare script', min:28,
  blocks:[
    {t:'p',html:`<p>Mezz'ora su cose piccole, in una cartella di prova, dove non c'è niente da rompere. L'obiettivo non è lo script: è <strong>prendere le misure allo strumento</strong>. Capire come chiede i permessi, cosa fa quando il compito è vago, cosa fa quando è preciso, e che differenza c'è fra parlarci e dargli un comando secco.</p>`},
    {t:'code',lang:'bash',code:`mkdir ~/lab-agente && cd ~/lab-agente
git init
echo "# Lab" > README.md
git add -A && git commit -m "inizio"
# Da adesso, dopo ogni esercizio: git diff  ->  vedi esattamente cosa ha fatto`},

    {t:'p',html:`<h3>2A — Il primo script (10 min)</h3>
      <p>Apri la sessione e dai questo compito. Poi <strong>guarda mentre lavora</strong>: quali file apre, cosa lancia, quando ti chiede il permesso.</p>`},
    {t:'code',lang:'text',code:`Scrivi uno script Python chiamato csv2json.py che:
- prende in ingresso il percorso di un file CSV e scrive un file JSON
  con lo stesso nome ma estensione .json
- usa solo la libreria standard
- se il file non esiste, stampa un messaggio chiaro ed esce con codice 1
- ha un --help che si capisce

Poi crea un file di esempio con 3 righe, provalo davvero, e mostrami
l'output del comando.`},
    {t:'p',html:`<p>Nota tre cose di questo compito, perché sono lo schema di tutti i compiti buoni:</p>
      <ul>
        <li><strong>Dice cosa deve fare, non come scriverlo.</strong> Il "come" è il suo mestiere.</li>
        <li><strong>Mette i limiti</strong> ("solo libreria standard"). Senza limiti, si installa tre pacchetti.</li>
        <li><strong>Chiede la prova.</strong> "Provalo davvero e mostrami l'output" cambia tutto: lo costringe a lanciare il codice invece di consegnartelo e basta.</li>
      </ul>`},
    {t:'callout',kind:'warn',title:'Da guardare mentre lavora',html:`Se scrive lo script e <strong>non lo lancia</strong>, fermalo e chiediglielo. Codice mai eseguito è codice non verificato — ed è il modo più comune in cui un agente ti consegna qualcosa che non funziona con la massima sicurezza.`},

    {t:'p',html:`<h3>2B — Modificarlo (10 min)</h3>
      <p>Adesso la parte interessante. Cambiare codice esistente è più difficile che scriverlo da zero, perché deve capire cosa c'è già. Dai queste tre modifiche <strong>una alla volta</strong>, e fai <code>git diff</code> dopo ognuna.</p>`},
    {t:'table',head:['#','Compito','Cosa stai osservando'],rows:[
      ['1','«Aggiungi l\'opzione <code>--delimiter</code> per scegliere il separatore, con default la virgola.»','Modifica piccola e chiara: il diff dovrebbe essere di 5-6 righe. Se ne tocca trenta, ha "sistemato" cose che non avevi chiesto.'],
      ['2','«Aggiungi <code>--dry-run</code>: stampa a video cosa scriverebbe, senza scrivere il file.»','Deve cambiare il flusso, non solo aggiungere un parametro. Guarda se il controllo lo mette nel punto giusto.'],
      ['3','«Le righe con un numero di colonne diverso dall\'intestazione vanno saltate, con un avviso su stderr. Aggiungi un test che lo dimostra.»','Caso limite + prova. Il test deve <em>fallire</em> se togli la gestione: chiediglielo.']
    ]},
    {t:'exercise',id:'ex5a',label:'Esercizio 5.1 — Cos\'è successo nei diff (3 minuti)',
      prompt:'Guarda i tre git diff. Quante righe ha toccato ogni volta? Ha cambiato qualcosa che non avevi chiesto? Scrivi cosa hai notato.',
      placeholder:'Modifica 1: ... righe. Ha toccato anche ...\nModifica 2: ...\nModifica 3: ...\nCosa ho notato: ...',
      solution:'Il segnale da cercare si chiama <strong>modifica che deborda</strong>: hai chiesto un parametro e ti ritrovi anche i commenti riscritti, le import riordinate, un refactoring "già che c\'ero". Non è un disastro su uno script di venti righe, ma sulla repo vera rende il diff illeggibile e il code review impossibile. Si cura con una riga nel compito: <em>«tocca solo il minimo necessario, non riformattare il resto»</em>. Mettila in AGENTS.md e vale sempre.'},

    {t:'p',html:`<h3>2C — Lo stesso lavoro, con un solo comando (8 min)</h3>
      <p>Fin qui hai parlato con l'agente. Adesso lo usi come un normale comando del terminale: gli passi il compito, lui lavora e stampa il risultato, poi esce. Senza sessione.</p>`},
    {t:'cmdlab'},
    {t:'p',html:`<p>È lo stesso motore, ma il modo di lavorare cambia parecchio:</p>`},
    {t:'table',head:['','In sessione','Un solo comando'],rows:[
      ['Ti dice cosa sta facendo','Sì, passo per passo','Solo il risultato finale'],
      ['Puoi correggerlo a metà','Sì','No: se il compito è scritto male, te ne accorgi alla fine'],
      ['Chiede i permessi','Sì','Dipende: o glieli dai prima, o si blocca'],
      ['Si può mettere in uno script','No','Sì — è tutto il punto'],
      ['Si può mettere in pipe','No','Sì: prende da stdin e scrive su stdout'],
      ['Quando usarlo','Compiti poco chiari, lavoro esplorativo','Compiti chiari e ripetuti, tanti file, CI']
    ]},
    {t:'p',html:`<p>Il caso in cui vale davvero la pena è questo: <strong>lo stesso compito su tante cose</strong>. Un ciclo del terminale e l'agente diventa un comando come tutti gli altri.</p>`},
    {t:'code',lang:'bash',code:`# Un riassunto di testa per ogni script della cartella
for f in *.py; do
  echo "== $f"
  pi -p "Leggi $f e scrivi 2 righe: a cosa serve, e un problema che vedi."
done

# In pipe: l'agente legge da stdin
git diff | pi -p "Riassumi queste modifiche in 5 punti per il changelog."

# Dentro uno script, con il risultato salvato
pi -p "Elenca le funzioni pubbliche di src/, una per riga" > funzioni.txt`},
    {t:'callout',kind:'warn',title:'Attenzione ai permessi',html:`Se il comando secco deve anche <strong>scrivere</strong> file o lanciare comandi, deve poterlo fare senza chiedere: altrimenti resta lì fermo ad aspettare una risposta che nessuno gli darà. Le opzioni per dargli questi permessi esistono in tutti gli strumenti — e sono anche il modo più rapido per farsi male. <strong>Usale solo dentro una copia usa e getta o in un contenitore isolato</strong>, mai sulla repo vera.`},
    {t:'exercise',id:'ex5b',label:'Esercizio 5.2 — Un comando riutilizzabile (5 minuti)',
      prompt:'Scrivi il comando secco (una riga di terminale) di un lavoro che ripeti spesso nel tuo lavoro. Poi provalo e scrivi se il risultato era usabile così com\'era o no.',
      placeholder:'Comando: pi -p "..."\nRisultato usabile? ...\nCosa ho dovuto aggiungere al compito per farlo funzionare: ...',
      solution:'Quasi sempre serve un secondo giro, e quasi sempre per lo stesso motivo: <strong>il formato dell\'output</strong>. In sessione un output sciolto va benissimo, tanto lo leggi tu. In uno script no: se il testo ti serve per un altro comando devi chiederlo esplicitamente («solo le righe, senza introduzione», «rispondi solo con JSON valido, niente altro»). È la differenza fra un giocattolo e una cosa che metti in pipeline.'},
    {t:'checklist',id:'ck5',title:'Task 2 completato quando...',
      items:[
        'Ho creato uno script da zero e l\'agente l\'ha davvero eseguito',
        'Ho fatto tre modifiche e guardato il git diff di ognuna',
        'Ho notato almeno una volta una modifica più grande del necessario',
        'Ho rifatto un compito con un solo comando, senza sessione',
        'Ho provato l\'agente in pipe (qualcosa | pi -p "...")',
        'So dire in che casi userei l\'uno e in che casi l\'altro'
      ]}
  ]
});

/* ---------- Pausa ---------- */
MODULES.push({
  id:'brk', n:'—', title:'Pausa', min:10,
  blocks:[
    {t:'p',html:`<h1 style="font-size:26px;margin-top:10px">Pausa — 10 minuti</h1>
      <p class="lede">Al ritorno si smette di giocare: si lavora su una repo vera.</p>`},
    {t:'callout',kind:'warn',title:'Prima di tornare, prepara la repo',html:`Apri il progetto su cui lavorerai e lancia <code>git status</code>. Deve essere <strong>pulito</strong>: niente file modificati, niente file nuovi. Se hai lavoro in sospeso, mettilo da parte con <code>git stash</code> oppure fai un branch nuovo. Serve anche che il progetto <strong>si costruisca e i test girino</strong> prima di iniziare: se non funziona già prima, non saprai mai se è colpa tua o dell'agente.`},
    {t:'callout',kind:'',title:'Domanda su cui pensare durante la pausa',html:`Fin qui hai controllato il lavoro dell'agente con <code>git diff</code>, su script di venti righe. Su una repo da centomila righe che non conosci del tutto: <strong>come farai a sapere se quello che ti consegna è giusto?</strong> È la domanda vera della seconda parte.`}
  ]
});

/* ---------- 6. Capire un progetto vero ---------- */
MODULES.push({
  id:'m6', n:'06', title:'Task 3 — Capire un progetto vero', min:28,
  blocks:[
    {t:'p',html:`<p>Questo è il primo uso di un coding agent che conviene davvero a tutti, anche a chi è scettico: <strong>farsi spiegare un progetto che non si conosce</strong>. È veloce, non tocca niente, e il risultato lo puoi verificare.</p>
      <p>È anche il momento in cui impari il gesto più importante della giornata: <strong>non fidarti della spiegazione, chiedi le prove</strong>.</p>`},
    {t:'callout',kind:'warn',title:'Controllo prima di iniziare',html:`<code>git status</code> pulito. Il progetto si costruisce e i test passano. Se una di queste due cose non è vera, sistemala adesso: altrimenti per tutta la seconda parte non saprai distinguere i problemi tuoi da quelli dell'agente.`},

    {t:'p',html:`<h3>3A — La prima domanda (8 min)</h3>
      <p>Apri la sessione nella radice del progetto e parti con una domanda larga. Non chiedere subito il dettaglio: prima la mappa.</p>`},
    {t:'promptkit',id:'pk6',title:'Compito: capire il progetto',
      sub:'Compila i campi con i dati del tuo progetto. Sotto ti si compone il compito da copiare nella sessione.',
      fields:[
        {k:'nome',lb:'Nome e tipo del progetto',ph:'Es. gestionale ordini, API REST in Node + Postgres',rows:2},
        {k:'so',lb:'Cosa già sai (anche poco)',ph:'Es. so che c\'è un frontend React e che il DB è Postgres. Non so come sono divisi i moduli.',rows:2},
        {k:'serve',lb:'Perché ti serve capirlo',ph:'Es. devo aggiungere un campo a un ordine e non so quanti punti tocca.',rows:2}
      ],
      build:(v)=>
`Sei appena entrato in questo progetto e non lo conosci.
Progetto: `+(v.nome||'[nome e tipo]')+`
Quello che so gia': `+(v.so||'[cosa sai]')+`
Mi serve per: `+(v.serve||'[obiettivo]')+`

Leggi il codice e rispondimi in modo strutturato:

1. A cosa serve questo progetto, in 3 righe.
2. L'entry point: da quale file parte l'applicazione, e cosa succede
   nei primi passi dell'avvio.
3. L'architettura: quali sono i 4-6 blocchi principali e come si parlano.
   Indica per ognuno la cartella o il file.
4. Dove sta la logica vera (le regole del dominio) e dove sta invece
   solo il contorno (validazione, trasporto, configurazione).
5. Come si costruisce, come si lancia in locale, come si lanciano i test.
   Comandi esatti presi dai file del progetto, non inventati.
6. Le 5 cose che uno nuovo deve sapere per non fare danni.

REGOLE:
- Per ogni affermazione cita il file e la riga da cui la ricavi.
- Se una cosa non riesci a dedurla dal codice, scrivi "NON SO"
  invece di ipotizzare.
- Non modificare nessun file.`},
    {t:'callout',kind:'ok',title:'Le due righe che fanno la differenza',html:`«<strong>Cita il file e la riga</strong>» e «<strong>scrivi NON SO</strong>». La prima ti dà un modo per controllare in dieci secondi: apri il file, guardi. La seconda gli dà il permesso di ammettere un buco — senza, riempirà il buco con una risposta plausibile, detta con la stessa sicurezza del resto.`},

    {t:'p',html:`<h3>3B — Verificare (7 min)</h3>
      <p>Adesso la parte che quasi nessuno fa, ed è quella che conta. Prendi la risposta e controllala.</p>`},
    {t:'table',head:['Cosa','Come si controlla','Quanto ci vuole'],rows:[
      ['L\'entry point','Aprilo. C\'è davvero? Fa quello che ha detto?','30 secondi'],
      ['I comandi','Lanciane uno. Funziona?','1 minuto'],
      ['Tre citazioni a caso','Apri i file alle righe indicate. Dicono quella cosa?','2 minuti'],
      ['Una cosa che sai già','Cercala nella risposta. L\'ha detta giusta?','30 secondi']
    ]},
    {t:'callout',kind:'bad',title:'Il tipo di errore da cercare',html:`Gli errori grossi si vedono. Quelli pericolosi no: sono le <strong>righe plausibili e sbagliate</strong>. «La validazione avviene in <code>middleware/validate.ts</code>» — il file esiste, il nome torna, ma la validazione vera la fa un altro pezzo e quel middleware è morto da un anno. Se non apri il file non te ne accorgi mai, e ci costruisci sopra tutto il resto del corso.`},
    {t:'exercise',id:'ex6a',label:'Esercizio 6.1 — Il controllo (3 minuti)',
      prompt:'Hai controllato quattro cose. Quante erano giuste? Scrivi l\'errore più insidioso che hai trovato (o scrivi che non ne hai trovati).',
      placeholder:'Controllate: 4. Giuste: ...\nErrore trovato: ...\nPerché era insidioso: ...'},

    {t:'p',html:`<h3>3C — Scavare dove serve (8 min)</h3>
      <p>Adesso che hai la mappa, chiedi il dettaglio sul punto che ti interessa. Qui il tipo di domanda che rende di più è quella che <strong>segue un percorso</strong>, non quella che chiede una spiegazione.</p>`},
    {t:'split2',a:{h:'Domande deboli',items:[
      ['«Spiegami come funziona l\'autenticazione.»','Troppo larga: ti scrive un tema, e metà è generica.'],
      ['«Il codice è ben scritto?»','Non si può verificare. Ti dirà di sì con dei distinguo.'],
      ['«Ci sono problemi?»','Senza un criterio, ti elenca cose a caso.']
    ]},b:{h:'Domande che rendono',items:[
      ['«Segui una richiesta POST /ordini dal primo file che la riceve fino alla scrittura sul DB. Elenca i file in ordine.»','Un percorso concreto. Verificabile riga per riga.'],
      ['«Dove viene deciso lo stato di una spedizione? Elenca TUTTI i punti che lo scrivono.»','Risposta chiusa e controllabile con una ricerca.'],
      ['«Cosa succede se il pagamento va a buon fine ma la scrittura sull\'ordine fallisce?»','Un caso limite: scopre in due minuti se c\'è un buco.']
    ]}},
    {t:'exercise',id:'ex6b',label:'Esercizio 6.2 — La domanda che ti porti dietro da mesi (5 minuti)',
      prompt:'Riprendi la cosa che nel modulo 00 hai scritto di non aver mai capito del tuo progetto. Trasformala in una domanda "che segue un percorso" e falla all\'agente. Incolla qui la domanda e le due righe più utili della risposta.',
      placeholder:'Domanda: Segui ... dal ... fino a ...\nRisposta utile: ...\nL\'ho verificata aprendo: ...',
      solution:'Se la risposta ti ha svelato qualcosa, hai appena visto il caso d\'uso che conviene sempre: <strong>l\'agente come mappa di un territorio grande</strong>. Fa in due minuti la ricerca incrociata che a te costa mezza giornata. Ma resta una mappa: prima di prendere una decisione su quello che ti ha detto, il file lo apri tu.'},

    {t:'p',html:`<h3>3D — Trasformare il lavoro in un file (5 min)</h3>
      <p>Quello che hai capito adesso, fra una settimana lo hai dimenticato — e l'agente lo ha già dimenticato. Mettilo per iscritto, ora che ce l'hai davanti.</p>`},
    {t:'code',lang:'text',code:`Dalla nostra conversazione, scrivi un file AGENTS.md per questo progetto.

Vincoli:
- Massimo 40 righe.
- Tre sezioni: Comandi, Mappa, Regole.
- Solo cose che hai verificato leggendo i file: niente supposizioni.
- Ogni riga deve essere verificabile. Niente frasi come
  "scrivi codice pulito".
- Metti le trappole: le cose che uno nuovo sbaglierebbe.
- I documenti lunghi richiamali con una riga, non copiarli dentro.`},
    {t:'callout',kind:'warn',title:'Prima di salvarlo, leggilo tutto',html:`Questo file guiderà l'agente per settimane. Se contiene una riga sbagliata, la sbaglierà sistematicamente, ogni volta. <strong>Correggi a mano</strong> quello che sai essere impreciso, e togli tutto quello che non ti sembra necessario: in genere si può tagliare un terzo.`},
    {t:'checklist',id:'ck6',title:'Task 3 completato quando...',
      items:[
        'Ho ottenuto una descrizione del progetto con citazioni di file e righe',
        'Ho aperto almeno tre citazioni per controllarle',
        'Ho lanciato almeno un comando che mi ha indicato',
        'Ho trovato almeno una cosa detta in modo impreciso',
        'Ho fatto una domanda "che segue un percorso" sul mio dubbio vero',
        'Ho un AGENTS.md salvato, riletto e corretto a mano'
      ]}
  ]
});

/* ---------- 7. Aggiungere una nuova funzionalità da essere usata con la CLI ---------- */
MODULES.push({
  id:'m7', n:'07', title:'Task 4 — Aggiungere una nuova funzionalità da essere usata con la CLI', min:22,
  blocks:[
    {t:'p',html:`<p>Fin qui l'agente ha solo letto. Adesso scrive, e si parte da una cosa piccola e ben delimitata: <strong>un comando nuovo nella riga di comando del progetto</strong>. Per esempio un comando che esporta dei dati in CSV, uno che controlla la configurazione prima di un deploy, uno che stampa le statistiche di una tabella.</p>
      <p>È un buon primo lavoro di scrittura perché un comando nuovo si aggiunge <strong>accanto</strong> a quelli che ci sono, senza cambiarli, e si prova subito dal terminale. Se il progetto non ha ancora una CLI, prendi uno degli script del modulo 05 e trasformalo in un comando con le sue opzioni.</p>`},
    {t:'callout',kind:'warn',title:'Branch nuovo, adesso',html:`<code>git checkout -b lab/cli</code>. Da qui in poi si scrive sul serio. Un branch a parte vuol dire che se il risultato non va bene lo butti via con un comando e non resta niente.`},

    {t:'p',html:`<h3>4A — Come è fatta la CLI oggi (6 min)</h3>
      <p>Prima di chiedere il comando nuovo, fatti spiegare <strong>come sono fatti quelli che ci sono</strong>. Ogni CLI ha le sue abitudini: una libreria per leggere gli argomenti, un modo di registrare i comandi, un formato per l'aiuto, un modo di segnalare gli errori. Il comando nuovo le deve seguire tutte, e l'agente le segue solo se le ha viste.</p>`},
    {t:'promptkit',id:'pk7c',title:'Compito: come è fatta la CLI',
      sub:'Solo lettura. Ti serve sapere dove si mette il comando e quale comando esistente prendere come modello.',
      fields:[
        {k:'cli',lb:'Come si lancia oggi la CLI',ph:'Es. python -m gestionale <comando>; oppure npm run cli -- <comando>; oppure ./bin/tool',rows:2},
        {k:'cosa',lb:'Cosa dovrà fare il comando nuovo (in una riga)',ph:'Es. esportare gli ordini di un periodo in un file CSV',rows:2}
      ],
      build:(v)=>
`Analisi della CLI, solo lettura: non modificare niente.

La CLI si lancia cosi': `+(v.cli||'[comando di avvio]')+`
Dovro' aggiungere un comando che: `+(v.cosa||'[cosa deve fare]')+`

Rispondimi con:
1. Il punto di ingresso della CLI e la libreria usata per leggere
   gli argomenti. File e riga.
2. Come si registra un comando nuovo: dove va il codice, dove va
   aggiunto il nome. File e riga.
3. Le abitudini che vedi nei comandi esistenti:
   - come sono scritti l'aiuto e i nomi delle opzioni
   - dove vanno i risultati (stdout) e dove i messaggi (stderr)
   - con che codice esce quando va bene e quando c'e' un errore
   - come leggono la configurazione (file, variabili d'ambiente)
4. Il comando esistente piu' simile a quello che devo aggiungere,
   da usare come modello. Perche' proprio quello.
5. Se ci sono test per la CLI: dove sono e come si lanciano.

Cita sempre file e riga. Se una cosa non la trovi, scrivi NON SO.`},
    {t:'exercise',id:'ex7c',label:'Esercizio 7.1 — Controlla il modello (3 minuti)',
      prompt:'Lancia tu il comando che l\'agente ha scelto come modello, con --help e poi una volta vera. Quello che vedi corrisponde a quello che ti ha descritto?',
      placeholder:'Comando modello: ...\nAiuto e opzioni come descritto? ...\nCodice di uscita (echo $?): ...\nDifferenze con la descrizione: ...',
      solution:'Il comando modello è la scelta più importante di tutto il task: il codice nuovo gli somiglierà. Se l\'agente ne ha scelto uno vecchio o fuori stile (capita spesso: il primo che trova), <strong>diglielo adesso</strong> e indicagli tu quello giusto. Cambiare modello dopo vuol dire riscrivere il comando.'},

    {t:'p',html:`<h3>4B — Il comando nuovo (8 min)</h3>
      <p>Adesso descrivi il comando <strong>come lo userebbe qualcuno</strong>: il nome, le opzioni, un esempio di chiamata e cosa si vede dopo. Un esempio d'uso scritto vale più di un paragrafo di spiegazione.</p>`},
    {t:'promptkit',id:'pk7d',title:'Compito: il comando nuovo',
      sub:'Più l\'esempio d\'uso è preciso, meno cose l\'agente deve inventare.',
      fields:[
        {k:'uso',lb:'Esempio di chiamata',ph:'Es. gestionale export-ordini --dal 2026-01-01 --al 2026-01-31 --out ordini.csv',rows:2},
        {k:'out',lb:'Cosa deve succedere',ph:'Es. scrive il CSV con una riga per ordine (id, data, cliente, totale) e stampa su stderr "Esportati 312 ordini"',rows:3},
        {k:'err',lb:'I casi di errore',ph:'Es. date non valide o --dal dopo --al: messaggio chiaro ed esce con 2. File già esistente: non lo sovrascrive senza --force',rows:3},
        {k:'mod',lb:'Il comando da usare come modello',ph:'Es. export-clienti in src/cli/export_clienti.py',rows:1}
      ],
      build:(v)=>
`Aggiungi un comando nuovo alla CLI.

Esempio d'uso: `+(v.uso||'[esempio di chiamata]')+`
Cosa deve succedere: `+(v.out||'[risultato atteso]')+`
Casi di errore: `+(v.err||'[errori e cosa fare]')+`
Comando da usare come modello: `+(v.mod||'[comando esistente]')+`

Vincoli:
- Segui il comando modello: stessa struttura, stessi nomi delle
  opzioni quando significano la stessa cosa, stesso modo di
  gestire gli errori e la configurazione.
- Scrivi l'aiuto (--help) come quello degli altri comandi, con
  almeno un esempio d'uso.
- Risultati su stdout (o nel file indicato), messaggi e errori
  su stderr. Codice di uscita 0 se va bene, diverso da 0 se no.
- Non modificare i comandi esistenti. Nessuna dipendenza nuova
  senza chiedermelo prima.
- Se ci sono test per la CLI, aggiungine uno per il caso normale
  e uno per un caso di errore, nello stile di quelli che ci sono.

Alla fine:
1. Lancia il comando con --help, poi con l'esempio d'uso, poi con
   un caso di errore. Mostrami l'output vero e il codice di uscita
   di ognuno.
2. Lancia i test esistenti e mostrami l'output vero.
3. Mostrami git diff --stat e spiegami in 3 righe cosa hai cambiato.`},
    {t:'callout',kind:'',title:'Un comando è un contratto',html:`Chi usa la CLI non legge il codice: legge l'aiuto, guarda l'output e, se lo mette in uno script, guarda il <strong>codice di uscita</strong>. Un comando che stampa «errore» ma esce con 0 fa credere a uno script che sia andato tutto bene. Un comando che mescola messaggi e dati su stdout non si può mettere in pipe. Sono le cose che l'agente sbaglia più spesso, perché dal codice «sembra funzionare» lo stesso.`},

    {t:'p',html:`<h3>4C — Provalo come lo userebbe qualcuno (8 min)</h3>
      <p>L'agente ti ha mostrato che funziona. Adesso lo provi tu, da utente, e soprattutto nei casi che nessuno ha provato:</p>`},
    {t:'code',lang:'bash',code:`# L'aiuto: si capisce cosa fa senza leggere il codice?
gestionale export-ordini --help

# Il caso normale, poi il codice di uscita
gestionale export-ordini --dal 2026-01-01 --al 2026-01-31 --out ordini.csv
echo $?

# Un errore: messaggio chiaro, codice diverso da 0
gestionale export-ordini --dal 2026-02-31
echo $?

# Senza argomenti obbligatori
gestionale export-ordini

# In pipe: su stdout ci sono solo i dati?
gestionale export-ordini --dal 2026-01-01 --al 2026-01-31 | head -3

# Cosa ha toccato
git diff --stat`},
    {t:'table',head:['Cosa guardi','Cosa cerchi'],rows:[
      ['<code>--help</code>','Stesso formato degli altri comandi, almeno un esempio, nessuna opzione descritta male.'],
      ['Codice di uscita','0 quando va bene, diverso da 0 quando no. Sempre, non solo nel caso che ha provato lui.'],
      ['Messaggi di errore','Dicono cosa è sbagliato e come si corregge. Niente stack trace per un input sbagliato.'],
      ['Output in pipe','Su stdout solo i dati. Se ci sono anche i messaggi, il comando non si può usare negli script.'],
      ['<code>git diff --stat</code>','Solo i file nuovi e il punto di registrazione. Se ha toccato altri comandi, chiedi perché.']
    ]},
    {t:'quiz',id:'q7b',q:'Il comando nuovo funziona, ma quando le date non sono valide stampa un errore ed esce con codice 0. È un problema?',
      opts:[
        {tx:'No: l\'errore si legge, quindi l\'utente capisce',ok:false,why:'Una persona sì. Uno script no: legge solo il codice di uscita, e 0 vuol dire «tutto bene».'},
        {tx:'Sì: chi usa il comando in uno script o in CI crede che sia andato tutto bene',ok:true,why:'Esatto. Il codice di uscita è la parte del contratto che leggono le macchine. Un errore con 0 passa inosservato finché qualcuno non trova il file vuoto.'},
        {tx:'Solo se il comando verrà usato in produzione',ok:false,why:'Una CLI si usa negli script proprio perché è comoda. Se il comando esiste, prima o poi ci finisce dentro.'},
        {tx:'No, basta che i test passino',ok:false,why:'I test passano se controllano il messaggio e non il codice di uscita. È proprio il caso da aggiungere ai test.'}
      ]},
    {t:'exercise',id:'ex7d',label:'Esercizio 7.2 — Il caso che non ha provato (4 minuti)',
      prompt:'Trova un modo di usare il comando che l\'agente non ha provato (un input strano, un file che esiste già, un periodo senza dati) e lancialo. Cosa è successo? Cosa gli hai chiesto di sistemare?',
      placeholder:'Ho provato: ...\nÈ successo: ...\nCodice di uscita: ...\nGli ho chiesto: ...',
      solution:'Quasi sempre c\'è almeno un caso scoperto: il periodo senza dati che produce un file vuoto senza dirlo, il file che viene sovrascritto senza chiedere, l\'input sbagliato che finisce in uno stack trace. Non è colpa dell\'agente: prova i casi che gli hai descritto. <strong>I casi che non gli hai descritto li devi provare tu.</strong>'},
    {t:'checklist',id:'ck7b',title:'Task 4 completato quando...',
      items:[
        'Ho lavorato su un branch a parte',
        'So dove si registra un comando e quale comando ho usato come modello',
        'Il comando nuovo ha un --help nello stile degli altri, con un esempio',
        'Esce con 0 quando va bene e con un codice diverso da 0 quando no',
        'Su stdout ci sono solo i dati: si può mettere in pipe',
        'Ho provato almeno un caso che l\'agente non aveva provato',
        'Il diff tocca solo il comando nuovo e il punto dove si registra'
      ]}
  ]
});

/* ---------- 8. Aggiungere una funzione ---------- */
MODULES.push({
  id:'m8', n:'08', title:'Task 5 — Aggiungere una piccola funzione', min:22,
  blocks:[
    {t:'p',html:`<p>Nel modulo 07 hai aggiunto un comando accanto a quelli che c'erano. Adesso una modifica che <strong>entra nel codice esistente</strong> e tocca più file. Il compito di esempio è utile davvero: <strong>tracciare le chiamate al database</strong> — per ogni query, sapere quale, quanto ci ha messo, e da dove è partita.</p>
      <p>Se nel tuo progetto esiste già, scegli un'altra funzione piccola: un endpoint di stato che dice se il servizio è vivo, un contatore di quante volte viene usata una funzione, un log strutturato su un punto che oggi non ne ha.</p>`},
    {t:'callout',kind:'warn',title:'Branch nuovo, adesso',html:`Torna su main e parti da zero: <code>git checkout main && git checkout -b lab/tracing</code>. Una modifica per branch. Un branch a parte vuol dire che se il risultato non va bene lo butti via con un comando e non resta niente.`},

    {t:'p',html:`<h3>5A — Prima il piano, poi il codice (7 min)</h3>
      <p>È la regola che fa più differenza di tutte quelle di oggi: <strong>su un cambiamento che tocca più file, chiedi prima il piano</strong>. Leggi il piano, correggilo, e solo dopo lascia scrivere.</p>
      <p>Costa due minuti e ti evita il caso peggiore: venti minuti di lavoro sulla strada sbagliata, con un diff così grande che non hai voglia di leggerlo.</p>`},
    {t:'promptkit',id:'pk8',title:'Compito: il piano (non ancora il codice)',
      sub:'Chiedi il piano. Il codice arriva dopo, quando il piano ti convince.',
      fields:[
        {k:'cosa',lb:'Cosa vuoi aggiungere',ph:'Es. un tracciamento di tutte le query al DB: testo della query, durata in ms, endpoint chiamante',rows:2},
        {k:'dove',lb:'Dove passano oggi le chiamate al DB',ph:'Es. tutte da src/db/client.ts, tranne i job in src/jobs/ che aprono una connessione loro',rows:2},
        {k:'vinc',lb:'Vincoli che deve rispettare',ph:'Es. si deve poter spegnere da configurazione; niente pacchetti nuovi; non deve loggare i valori dei parametri',rows:3}
      ],
      build:(v)=>
`NON SCRIVERE CODICE ADESSO. Voglio prima un piano.

Cosa devo aggiungere: `+(v.cosa||'[la funzione]')+`
Dove passa oggi: `+(v.dove||'[punti del codice]')+`
Vincoli: `+(v.vinc||'[vincoli]')+`

Prima leggi il codice che c'e', poi rispondimi con:

1. Il punto giusto in cui mettere la cosa, e perche' li'.
   Se esiste gia' un punto di passaggio comune, usa quello.
2. Se esiste gia' qualcosa di simile nel progetto (un log, un timer,
   un middleware): dimmelo, e aggancia la nuova cosa a quello
   invece di inventare un modo nuovo.
3. L'elenco dei file da toccare, con una riga su cosa cambia in ognuno.
4. Cosa NON tocchiamo, e perche'.
5. Come faremo a vedere che funziona (un comando, un test, una riga di log
   attesa).
6. I due modi in cui questa modifica puo' rompere qualcosa.

Poi fermati e aspetta il mio ok.`},
    {t:'callout',kind:'ok',title:'Il punto 2 è quello che salva il codice',html:`«Se esiste già qualcosa di simile, aggancia a quello». Senza questa riga, un agente aggiunge volentieri <strong>un secondo modo di fare una cosa che il progetto già faceva</strong>: un altro logger, un altro wrapper, un'altra configurazione. Funziona, passa i test, e intanto il progetto ha due sistemi paralleli da mantenere.`},
    {t:'exercise',id:'ex8a',label:'Esercizio 8.1 — Correggi il piano (4 minuti)',
      prompt:'Leggi il piano. Cosa hai dovuto correggere prima di dargli l\'ok?',
      placeholder:'Il piano proponeva: ...\nHo corretto: ...\nPerché: ...',
      solution:'Le correzioni più frequenti sono tre: <strong>1)</strong> il punto scelto è sbagliato — funziona ma non è il punto di passaggio giusto; <strong>2)</strong> tocca più file del necessario; <strong>3)</strong> ignora una cosa che il progetto ha già. Tutte e tre, sul codice fatto, costano dieci volte tanto a sistemarle.'},

    {t:'p',html:`<h3>5B — L'implementazione (7 min)</h3>
      <p>Piano approvato. Adesso puoi lasciarlo scrivere — ma con dei limiti chiari.</p>`},
    {t:'code',lang:'text',code:`Ok, procedi con il piano, con questi vincoli:

- Tocca solo i file che abbiamo elencato.
- Fai la modifica piu' piccola che funziona. Non riordinare le import,
  non riformattare, non "sistemare" altro codice.
- Segui lo stile che vedi nei file vicini: stessi nomi, stesso modo
  di gestire gli errori, stesso modo di configurare.
- Nessuna dipendenza nuova senza chiedermelo prima.
- Alla fine lancia i test esistenti e mostrami l'output vero,
  non un riassunto.
- Poi mostrami git diff --stat e spiegami in 3 righe cosa hai cambiato.`},
    {t:'callout',kind:'bad',title:'Il tracciamento ha due trappole sue',html:`<strong>Non deve rompere niente se si guasta lui.</strong> Se il tracciamento solleva un errore, la query non deve fallire: il codice che traccia va protetto. Chiediglielo. <strong>Non deve finire nei log quello che non deve starci.</strong> I parametri di una query contengono email, codici fiscali, IBAN. Registra il testo della query e la durata, non i valori — a meno che tu non sappia esattamente cosa stai scrivendo e dove finisce.`},

    {t:'p',html:`<h3>5C — Il controllo (8 min)</h3>
      <p>Il momento vero. Il codice esiste, i test passano, e adesso tocca a te. In ordine:</p>`},
    {t:'table',head:['#','Cosa fai','Cosa cerchi'],rows:[
      ['1','<code>git diff --stat</code>','Quanti file? Quante righe? Se sono più di quelle previste dal piano, guarda subito perché.'],
      ['2','<code>git diff</code>, tutto, riga per riga','Nessuna riga che non sai spiegare. Se non la capisci, chiedi: «perché questa riga?».'],
      ['3','Lancia l\'applicazione','Funziona ancora? Il tracciamento produce davvero le righe attese?'],
      ['4','Spegni la funzione da configurazione','Il vincolo diceva che si doveva poter spegnere. Provalo davvero.'],
      ['5','Guarda cosa finisce nei log','Ci sono dati che non devono starci?'],
      ['6','Rompi qualcosa apposta','Fai fallire il tracciamento. La query deve continuare a funzionare.']
    ]},
    {t:'callout',kind:'warn',title:'La domanda da fare quando qualcosa non torna',html:`Non «sistemalo». Prima: <strong>«perché hai fatto così invece che così?»</strong>. Metà delle volte c'è un motivo che non avevi visto — e impari qualcosa sul tuo progetto. L'altra metà non c'è, e allora glielo dici.`},
    {t:'exercise',id:'ex8b',label:'Esercizio 8.2 — Il diff (5 minuti)',
      prompt:'Quanti file e quante righe ha toccato? Il diff era leggibile? Hai trovato righe che non sapevi spiegare? Lo faresti passare in code review così com\'è?',
      placeholder:'File: ... Righe: ...\nRighe non chiare: ...\nLo farei passare in review? ... perché ...',
      solution:'Il criterio è uno solo, e vale anche per il codice scritto dalle persone: <strong>lo firmeresti?</strong> Se il tuo nome finisce su quel commit, quel codice è tuo — chi lo ha materialmente scritto non interessa a nessuno fra sei mesi quando si romperà. Se non lo firmeresti, non è finito.'},
    {t:'checklist',id:'ck8',title:'Task 5 completato quando...',
      items:[
        'Ho lavorato su un branch a parte',
        'Ho chiesto il piano prima del codice e l\'ho corretto',
        'La modifica tocca solo i file previsti',
        'Ho letto il diff riga per riga e so spiegare tutto',
        'Ho lanciato l\'applicazione e visto la funzione funzionare davvero',
        'Ho provato a spegnerla e a farla fallire: non rompe niente',
        'Nei log non finiscono dati che non devono starci'
