<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAAL e Skills — Corso</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel-2:#f1f1ee; --text:#1c1c1a; --muted:#6b6b63;
  --line:#e2e2dc; --accent:#c2451f; --accent-soft:#fdefe9; --ok:#1f7a4d; --ok-soft:#e8f5ee;
  --warn:#8a5a00; --warn-soft:#fdf3e0; --bad:#a52020; --bad-soft:#fbeaea;
  --code-bg:#1e1e1c; --code-text:#f0efe9; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141413; --panel:#1e1e1c; --panel-2:#26261f; --text:#f0efe9; --muted:#a3a39a;
  --line:#33332c; --accent:#e8825c; --accent-soft:#2e211c; --ok:#5ec48d; --ok-soft:#17281f;
  --warn:#e0b45f; --warn-soft:#2a2318; --bad:#e88b8b; --bad-soft:#2b1a1a;
  --code-bg:#0f0f0e; --code-text:#e8e7e1; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 18px;
}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}
.pill{
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.pill.ghost{background:transparent}
.pill:hover{border-color:var(--accent)}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress-wrap{width:100%;height:3px;background:var(--panel-2)}
.progress-bar{height:100%;width:0;background:var(--accent);transition:width .35s ease}

.shell{display:grid;grid-template-columns:274px minmax(0,1fr);gap:0;align-items:start}
nav.side{
  position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg);
}
nav.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 8px 8px}
.navitem{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;
  color:var(--text);padding:8px 10px;border-radius:9px;margin-bottom:2px;line-height:1.35;
}
.navitem:hover{background:var(--panel-2)}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none;padding-top:2px}
.navitem.active .idx{color:var(--accent)}
.navitem .nt{font-size:13.5px}
.navitem .nm{font-size:11px;color:var(--muted);display:block}
.navitem .tick{margin-left:auto;color:var(--ok);font-size:12px;flex:none}

main{padding:30px 34px 90px;max-width:920px;margin:0 auto;width:100%}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h1{font-size:31px;line-height:1.18;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:21px;letter-spacing:-.01em;margin:38px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3{font-size:16px;margin:24px 0 8px}
.lede{color:var(--muted);font-size:15px;margin:0 0 4px}
.prose{font-size:15px}
.prose p{margin:12px 0}
.prose ul,.prose ol{margin:12px 0;padding-left:22px}
.prose li{margin:6px 0}
.prose strong{font-weight:650}
code{font-family:var(--mono);font-size:.875em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
pre{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:var(--radius);overflow-x:auto;font-size:12.5px;line-height:1.55;margin:14px 0}
pre code{background:none;border:0;padding:0;color:inherit;font-size:12.5px}

.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:10px;padding:13px 16px;margin:16px 0;font-size:14px;box-shadow:var(--shadow)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout .ct{display:block;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}

.grid{display:grid;gap:12px;margin:16px 0}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card h5{margin:0 0 5px;font-size:13.5px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tablewrap table{margin:0}

/* ---------- widgets ---------- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:20px 0;box-shadow:var(--shadow)}
.widget-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.widget-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;flex:none}
.widget-t{font-weight:650;font-size:15px}
.widget-s{color:var(--muted);font-size:13.5px;margin:2px 0 14px}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:10px 13px;margin-bottom:7px;font-size:14px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-ok{border-color:var(--ok)}
.opt .mk{font-family:var(--mono);font-weight:700;margin-right:8px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);margin-top:6px;padding-left:2px;display:none}
.opt.shown .why{display:block}

.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:6px;cursor:pointer;font-size:14px}
.chk input{margin-top:4px;flex:none;accent-color:var(--accent);width:15px;height:15px}
.chk.on{border-color:var(--accent);background:var(--accent-soft)}
.chk .lb{font-weight:600}
.chk .ds{display:block;font-size:12.5px;color:var(--muted);font-weight:400}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane-h{padding:7px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pane.bad .pane-h{background:var(--bad-soft);color:var(--bad)}
.pane.ok .pane-h{background:var(--ok-soft);color:var(--ok)}
.pane pre{margin:0;border-radius:0;max-height:340px}

.bp{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:14px 16px;margin-bottom:10px}
.bp-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:15px}
.bp-n{font-family:var(--mono);font-size:12px;color:var(--accent);flex:none}
.bp-why{font-size:13.5px;color:var(--muted);margin:6px 0 10px}
.bp-ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.bp-ex>div{border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5}
.bp-ex .do{background:var(--ok-soft);border-left:3px solid var(--ok)}
.bp-ex .dont{background:var(--bad-soft);border-left:3px solid var(--bad)}
.bp-ex b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.bp-ex .do b{color:var(--ok)}
.bp-ex .dont b{color:var(--bad)}

.preview{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:400px;overflow-y:auto;min-height:80px}
.meter{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line)}
.meter > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scoreline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-family:var(--mono)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--mono)}
.tab:hover{border-color:var(--accent)}
.tab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

textarea,input[type="text"],select{
  width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;
}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fl{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:.3s}
.saved.on{opacity:1}

.sorter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);margin-bottom:7px}
.sorter-row .it{flex:1 1 240px;font-size:13.5px}
.sorter-row .bs{display:flex;gap:5px;flex:none}
.bbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:650}
.bbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sorter-row.ok{border-color:var(--ok);background:var(--ok-soft)}
.sorter-row.bad{border-color:var(--bad);background:var(--bad-soft)}
.sorter-row .fb{flex:1 1 100%;font-size:12.5px;color:var(--muted);display:none}
.sorter-row.done .fb{display:block}

.diag{margin-top:12px;font-size:13.5px}
.diag div{padding:6px 0;border-top:1px dashed var(--line)}

/* ---------- workflow a step ---------- */
.loopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 12px}
.lstep{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 11px;font-size:13px;opacity:.45;transition:.2s}
.lstep.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.lstep.past{opacity:.85}
.lstep b{display:block;font-size:11px;font-family:var(--mono);color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.lstep span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}


.footnav{display:flex;justify-content:space-between;gap:10px;margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}
.timerbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mod-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 24px}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:290px}
  main{padding:22px 16px 70px}
  h1{font-size:25px}
}
@media print{
  nav.side,header.top,.footnav,.btnrow{display:none}
  main{max-width:none;padding:0}
  .widget,.card,.callout{break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span><span>CAAL &amp; Skills<small>Programma formativo — 3 ore e 30, workflow agentici durevoli e skills per l'era agentica</small></span></div>
  <div class="spacer"></div>
  <div class="timerbox">
    <button class="pill ghost" id="timerBtn">▶ Avvia timer</button>
    <span class="pill clock" id="clock">00:00:00 / 3:30:00</span>
  </div>
  <button class="pill ghost" id="exportBtn" title="Scarica risposte e note in Markdown">⬇ Esporta</button>
  <button class="pill ghost" id="themeBtn" title="Tema chiaro/scuro">◐</button>
</header>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

<div class="shell">
  <nav class="side">
    <h4>Programma</h4>
    <div id="nav"></div>
    <h4 style="margin-top:18px">Avanzamento</h4>
    <div style="padding:0 10px;font-size:12.5px;color:var(--muted)" id="statsBox"></div>
    <div style="padding:10px">
      <button class="btn" id="resetBtn" style="width:100%;font-size:12px">Azzera avanzamento</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   STATO + PERSISTENZA
   ============================================================ */
const NS = 'caalskills.';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(NS+k); }catch(e){} },
  clearAll(){ try{ Object.keys(localStorage).filter(k=>k.indexOf(NS)===0).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};
let current = store.get('current', 0);
let done = store.get('done', {});
let answers = store.get('answers', {});
let quizState = store.get('quiz', {});

function saveAll(){ store.set('done', done); store.set('answers', answers); store.set('quiz', quizState); }

/* ============================================================
   CONTENUTI
   ============================================================ */
const MODULES = [];

/* ---------- 0. Apertura ---------- */
MODULES.push({
  id:'m0', n:'00', title:'Apertura', min:5,
  blocks:[
    {t:'p',html:`<p>Con il Ralph loop hai imparato a dare all'agente un compito scritto bene e a <strong>lasciarlo lavorare da solo</strong>. Funziona, finché il compito è abbastanza corto. Quando diventa una user story intera, con decine di passi, iniziano i problemi: si rompe a metà, va in loop su un test, non sai a che punto è. Oggi vediamo <strong>CAAL</strong>, il «wrapper» del Ralph che risolve questi problemi.</p>
      <p>Nella seconda parte cambiamo prospettiva: se l'agente scrive il codice, <strong>cosa deve saper fare lo sviluppatore?</strong> Parliamo delle skill che contano nell'era agentica, umane e tecniche.</p>`},
    {t:'cards',cards:[
      {tag:'Parte 1',h:'CAAL - Controllable Autonomous Agentic Loop. Perché?',p:'I limiti del Ralph su compiti lunghi, e cosa vuol dire esecuzione durevole e governata.'},
      {tag:'Parte 2',h:'Come funziona',p:'Workflow a step, base prompt e metaprompting, modalità autonoma e human in the loop.'},
      {tag:'Parte 3',h:'Laboratorio',p:'Un task completo con CAAL: piano, implementazione, regressione, stop e ripresa.'},
      {tag:'Parte 4',h:'Skills agentic era',p:'Comunicare, delegare, scomporre, decidere. E le basi tecniche che l\'agente non sostituisce.'}
    ]},
    {t:'table',head:['Blocco','Durata'],rows:[
      ['00 · Apertura','5 min'],
      ['01 · CAAL - Controllable Autonomous Agentic Loop. Perché?','20 min'],
      ['02 · Quando usarlo e quando no','15 min'],
      ['03 · Workflow e step','20 min'],
      ['04 · Base prompt e metaprompting','20 min'],
      ['05 · Autonomo o human in the loop','15 min'],
      ['— Pausa','10 min'],
      ['06 · Laboratorio — Un task con CAAL','25 min'],
      ['07 · Estendere CAAL: verso la software factory','10 min'],
      ['08 · Skills agentic era','30 min'],
      ['09 · Skills tecniche','30 min'],
      ['10 · Chiusura','10 min']
    ]},
    {t:'callout',kind:'ok',title:'Come si usa questo materiale',html:`Naviga con la barra a sinistra, con i pulsanti in fondo a ogni modulo o con le frecce della tastiera. Ogni esercizio si salva da solo nel browser (niente esce dal tuo computer). Con <strong>&#8681; Esporta</strong> scarichi tutte le tue risposte e le checklist in un file Markdown.`},
    {t:'p',html:`<h3>Prerequisiti</h3>
      <ul>
        <li>Sapere com'è fatto un buon prompt e come si usa il <strong>metaprompting</strong>.</li>
        <li>Sapere cos'è un agente AI e come si usa un coding agent.</li>
        <li>Sapere bene cos'è un <strong>Ralph loop</strong> (corso precedente).</li>
      </ul>
      <h3>Cosa devi saper fare a fine giornata</h3>
      <ol>
        <li>Spiegare quali problemi del Ralph risolve CAAL e quando non serve.</li>
        <li>Leggere un workflow CAAL: step deterministici, step agentici, retry inseriti in caso di errore.</li>
        <li>Scrivere un base prompt e capire come l'agente ne ricava i prompt specifici.</li>
        <li>Lanciare un task, fermarlo, controllarne lo stato e riprenderlo da uno step preciso.</li>
        <li>Riconoscere le skill, umane e tecniche, che fanno la differenza quando il codice lo scrive l'agente.</li>
      </ol>`}
  ]
});

/* ---------- 1. CAAL - Controllable Autonomous Agentic Loop. Perché? ---------- */
MODULES.push({
  id:'m1', n:'01', title:'CAAL - Controllable Autonomous Agentic Loop. Perché?', min:20,
  blocks:[
    {t:'callout',kind:'',title:'La definizione',html:`<em>«A controllable autonomous agentic loop/workflow to make durable execution and governance first-class. Workflows can persist through failures and pauses and resume from the last checkpoint; humans can inspect or modify state at interrupt points; the process can pause and resume later, especially for human review or long-running work. The team needs a trace of which route was taken and why; or multiple tools or model calls must share a durable state object.»</em>`},
    {t:'p',html:`<p>Detto semplice: CAAL è <strong>una specie di wrapper del Ralph</strong>. L'agente lavora sempre con il contesto pulito e lo stato sta sempre su file, ma il ciclo non è più un <code>for</code> in bash: è un <strong>workflow a step</strong>, con uno stato salvato, che sa dove si trova, cosa è fallito e da dove ripartire.</p>
      <h3>Le domande a cui il Ralph non risponde</h3>`},
    {t:'table',head:['Problema con il Ralph','Cosa fa CAAL'],rows:[
      ['Si rompe a metà dello sviluppo. Come riparto da un punto preciso senza rifare tutto?','Lo stato del workflow è in <code>.workflow/</code>. <code>resume</code> riparte dal primo step non finito; <code>step &lt;key&gt;</code> riesegue uno step specifico.'],
      ['Ha generato un prompt sbagliato, o sta facendo scelte che non voglio. Come lo fermo?','<code>stop</code> chiede un arresto pulito al prossimo step. Con <code>--human_in_the_loop</code> rivedi (e correggi) il prompt prima che venga eseguito.'],
      ['A che punto è il loop?','<code>status</code> stampa avanzamento, step corrente, prossimo step, base prompt. In qualunque momento, in sola lettura.'],
      ['Vorrei step in parallelo, per esempio più audit dopo che i test passano.','Il workflow è una lista di step con un tipo: si può estendere con nuovi step (modulo 07).'],
      ['Un test fallisce e l\'agente gira a vuoto.','Su un fallimento vengono inseriti uno step <code>debug#k</code> e un <code>run_test#k</code>, fino a <code>--max-retries</code>. Poi si ferma, invece di girare all\'infinito.'],
      ['Vorrei log e eventi di osservabilità su parti specifiche del flusso.','Ogni step lascia i suoi file: meta-prompt, prompt composto, log dei test, <code>progress.txt</code>, <code>error_memories.md</code>.'],
      ['Vorrei reagire con hook quando certe fasi finiscono.','Gli step sono punti di aggancio naturali: dopo un certo step se ne può aggiungere uno (notifica, commit, deploy).']
    ]},
    {t:'split2',a:{h:'Ralph loop',items:[
      ['Il ciclo','Un <code>for</code> in bash che rilancia lo stesso prompt.'],
      ['Lo stato','Quello che l\'agente decide di scrivere in <code>progress.txt</code>.'],
      ['Se fallisce','Il giro dopo riprova, sperando che legga bene i file.'],
      ['Il controllo','Solo alla fine, o uccidendo il processo.']
    ]},b:{h:'CAAL',items:[
      ['Il ciclo','Un workflow a step con nome e tipo (deterministico o agentico).'],
      ['Lo stato','Gestito dal runner in <code>.workflow/</code>, non dall\'agente.'],
      ['Se fallisce','Inserisce step di debug e di retry, con un tetto.'],
      ['Il controllo','<code>status</code>, <code>stop</code>, <code>step</code>, <code>resume</code>, e gate di revisione umana.']
    ]}},
    {t:'callout',kind:'ok',title:'La differenza in una riga',html:`Nel Ralph è <strong>l'agente</strong> che deve ricordarsi dove era arrivato. In CAAL è <strong>il runner</strong>: l'agente esegue uno step alla volta, e la parte deterministica (lanciare i test, segnare uno step come fatto, decidere il prossimo) non passa più dall'LLM.`},
    {t:'p',html:`<h3>CAAL da linea di comando</h3>
      <p>CAAL è uno script Node.js, <code>caal.js</code>, che si lancia dalla cartella del progetto (<code>/Code/app_workshop</code> nel container).</p>`},
    {t:'p',html:`<h3>1. Far partire una user story</h3><p>Prende la storia US-002 (summary degli ultimi commit) dal file delle user story <code>app_workshop/user_stories.md</code>, la scrive in <code>specs/user_story_002/US002.md</code> e lancia il workflow completo: decomposizione, feature Gherkin, codice, test, OpenAPI.</p>`},
    {t:'code',lang:'bash',code:`node caal.js start \\
  --user_stories_file ./user_stories.md \\
  --user_story_to_run 2`},
    {t:'p',html:`<h3>2. Far partire un task (feature o refactor)</h3><p>Una sola funzionalità o un refactor, senza user story. Il workflow è <code>task.plan</code> → <code>task.implement</code> → <code>task.regression</code> → <code>task.finish</code>.</p>`},
    {t:'code',lang:'bash',code:`node caal.js task \\
  --type refactor \\
  --description "Rendere il driver git (src/drivers/git.js) riutilizzabile anche per il summary dei commit, senza cambiare l'output di fileVolatility." \\
  --base-prompt prompts/REFACTOR_RULES.md`},
    {t:'p',html:`<h3>3. Far ripartire uno step</h3><p>Con una chiave riesegue proprio quello step e si ferma (anche a workflow completato, chiedendo conferma). Le chiavi le trovi in <code>status</code>.</p>`},
    {t:'code',lang:'bash',code:`# rifà il piano, per esempio dopo aver corretto TASK.md
node caal.js step task.plan

# rifà il codice di un singolo scenario di una user story
node caal.js step feature_1.scenario_2.impl_code

# poi riprende fino alla fine
node caal.js resume`},
    {t:'p',html:`<h3>4. Cambiare l'agente di uno step</h3><p>L'override vale solo per quello step e ha la precedenza sull'agente globale. Per esempio un modello più forte solo per il piano. Gli step di retry (<code>debug#k</code>) non lo ereditano.</p>`},
    {t:'code',lang:'bash',code:`node caal.js set-step-agent task.plan 'claude -p "$(cat "$WORKFLOW_PROMPT_FILE")" --model opus --output-format stream-json --verbose --dangerously-skip-permissions'

node caal.js list-step-agents          # agente globale e override per step
node caal.js unset-step-agent task.plan  # torna all'agente globale`},
    {t:'p',html:`<h3>5. Vedere lo stato del workflow</h3><p>Sola lettura, in qualunque momento, anche mentre il workflow gira in un altro terminale: step fatti, falliti, prossimo step, base prompt attivo.</p>`},
    {t:'code',lang:'bash',code:`node caal.js status`},
    {t:'quiz',id:'q1a',q:'Qual è il vantaggio principale di CAAL rispetto a un Ralph loop su una user story lunga?',
      opts:[
        {tx:'Usa un modello più potente',ok:false,why:'Il modello è lo stesso: lo decidi tu con <code>--agent</code>.'},
        {tx:'Lo stato del lavoro è gestito dal runner a step: puoi vedere dove si trova, fermarlo e riprendere da un punto preciso',ok:true,why:'Esatto. Esecuzione durevole (checkpoint e ripresa) e governance (stop, revisione, traccia) diventano parte del sistema.'},
        {tx:'Non serve più scrivere un prompt',ok:false,why:'Serve ancora: il base prompt. Cambia solo che il prompt specifico di ogni step lo compone l\'agente.'},
        {tx:'Non serve più la sandbox',ok:false,why:'No. L\'agente gira sempre con i permessi approvati: container, utente non root, zero credenziali di produzione.'}
      ]}
  ]
});

/* ---------- 3. Workflow e step ---------- */
MODULES.push({
  id:'m3', n:'03', title:'Workflow e step', min:20,
  blocks:[
    {t:'p',html:`<p>Un workflow CAAL è una <strong>lista di step</strong>. Ogni step ha una chiave (per esempio <code>task.plan</code>) e un tipo:</p>`},
    {t:'cards',cards:[
      {tag:'agentic',h:'Step agentico',p:'Lo fa l\'agente: scrivere il piano, il codice, le feature Gherkin, debuggare un test.'},
      {tag:'deterministic',h:'Step deterministico',p:'Lo fa il runner, senza LLM: lanciare i test, segnare una feature come fatta, chiudere il workflow.'},
      {tag:'spliced',h:'Step inserito',p:'Aggiunto al volo quando qualcosa fallisce: debug#k e poi run_test#k, fino a --max-retries.'}
    ]},
    {t:'p',html:`<h3>Workflow di un task (feature o refactor)</h3>`},
    {t:'code',lang:'text',code:`task.plan        (agente)  -> scrive specs/tasks/<slug>/plan.md, non tocca il codice
task.implement   (agente)  -> implementa seguendo TASK.md + plan.md
task.regression  (runner)  -> npm run test:tag '@done'  (se fallisce: debug#k + retry#k)
task.finish      (runner)  -> chiude il workflow`},
    {t:'p',html:`<h3>Workflow di una user story</h3><p>Più lungo, e si espande man mano: la decomposizione genera le feature, ogni feature genera i suoi scenari.</p>`},
    {t:'table',head:['Livello','Step','Tipo'],rows:[
      ['Storia','<code>story.complete_dev_parts</code> · <code>story.mark_in_progress</code> · <code>story.decompose</code> · <code>story.expand_features_tasks</code>','agentico / deterministico'],
      ['Per feature','<code>feature_&lt;n&gt;.gherkin</code> (max 3 scenari) · <code>feature_&lt;n&gt;.mark_done</code>','agentico / deterministico'],
      ['Per scenario','<code>impl_code</code> · <code>impl_stepdefs</code> · <code>run_test</code>','agentico · agentico · deterministico'],
      ['Se fallisce','<code>debug#&lt;k&gt;</code> · <code>run_test#&lt;k&gt;</code>','agentico · deterministico'],
      ['Chiusura','<code>story.openapi</code> · <code>story.mark_completed</code> · <code>story.finish</code>','agentico / deterministico']
    ]},
    {t:'agentloop'},
    {t:'callout',kind:'warn',title:'Perché i test li lancia il runner',html:`Se è l'agente a dire «i test passano», ti stai fidando della sua parola. Se è il runner a lanciare <code>npm run test:tag @done</code> e a leggere il codice di uscita, il risultato è un fatto. Tutto quello che si può fare <strong>senza LLM</strong> conviene farlo senza LLM.`},
    {t:'quiz',id:'q3a',q:'La regressione @done fallisce. Cosa fa CAAL?',
      opts:[
        {tx:'Ricomincia il workflow da capo',ok:false,why:'No: plan e implement sono già fatti e restano fatti. Si riparte solo da dove serve.'},
        {tx:'Inserisce uno step debug#1 (agente) e uno regression#1 (runner), e ripete fino a --max-retries',ok:true,why:'Esatto. Il debug ha un tetto: se dopo N tentativi non passa, si ferma invece di girare a vuoto.'},
        {tx:'Chiede all\'agente di modificare i test finché passano',ok:false,why:'È proprio quello da evitare. In un refactor l\'istruzione esplicita è: correggi il codice, mai i test.'},
        {tx:'Segna il task come completato con un warning',ok:false,why:'Un task con regressione rossa non è finito.'}
      ]}
  ]
});

/* ---------- 4. Base prompt e metaprompting ---------- */
MODULES.push({
  id:'m4', n:'04', title:'Base prompt e metaprompting', min:20,
  blocks:[
    {t:'p',html:`<p>CAAL <strong>non contiene un template fisso</strong> per ogni step. Invece manda all'agente un meta-prompt breve: <em>«leggi il base prompt, scrivi tu il prompt giusto per questo step, salvalo, poi eseguilo»</em>.</p>
      <p>Il <strong>base prompt</strong> è un file Markdown che fa da modello di riferimento. Non descrive il task: descrive <strong>come si lavora in questo progetto</strong>, cioè regole, riferimenti, vincoli, come si testa.</p>`},
    {t:'p',html:`<h3>La procedura dell'agente, a ogni step agentico</h3>
      <ol>
        <li>Legge il base prompt e i documenti che cita (riceve solo il <strong>percorso</strong>, non il contenuto).</li>
        <li>Scrive un prompt specifico per lo step, tenendo solo le parti che servono.</li>
        <li>Lo salva in <code>.workflow/prompts/&lt;key&gt;.composed.md</code>.</li>
        <li>Esegue lo step seguendo quel prompt.</li>
      </ol>`},
    {t:'table',head:['Quale base prompt viene usato','Priorità'],rows:[
      ['Il flag <code>--base-prompt &lt;file&gt;</code>','1'],
      ['La variabile d\'ambiente <code>WORKFLOW_BASE_PROMPT_FILE</code>','2'],
      ['Il default per tipo di workflow: <code>RALPH_PROMPT_NEW_USER_STORY.md</code> per una user story, <code>RALPH_PROMPT_TASK.md</code> per un task','3']
    ]},
    {t:'callout',kind:'',title:'Perché due default diversi',html:`Il prompt delle user story parla di Gherkin e di decomposizione in feature. Su un task singolo (una feature o un refactor) quelle istruzioni <strong>confonderebbero l'agente</strong>. Un base prompt deve contenere solo regole che valgono per quel tipo di lavoro.`},
    {t:'reveal',title:'prompts/REFACTOR_RULES.md',sub:'Un base prompt specializzato per i refactor. Nota cosa c\'è e cosa manca: nessun task, solo regole.',
      text:`You are working inside an existing codebase located in app_workshop/.

Reference files:
- Agent rules: \`AGENTS.md\`
- Architecture: \`LUMINOUS_ARCHITECTURE.md\`
- Things learned: \`learned.md\`
- Errors to avoid: \`error_memories.md\`

Refactor rules:
- Observable behavior must not change: CLI output (JSON keys and order), error format { "status": "ERROR", "message": "..." }, exit codes.
- The existing tests are the specification. If they fail, fix the code, never the tests.
- Keep each change small; prefer moving code over rewriting it.
- Do not rename CLI commands, --key=value flags or service input/output keys.
- Before starting, list in plan.md the tests that cover the code you will touch.

Tests:
- Regression: npm run test:tag @done (run by the workflow, not by you, during plan/implement)
- Debug failures with the skill .claude/skills/agentic-debug`},
    {t:'practices',title:'Perché il metaprompting',items:[
      {n:'01',h:'Un prompt per step, non uno per tutto',
        why:'Il prompt di task.plan e quello di debug#2 hanno bisogno di cose diverse. Mandare tutto a tutti riempie il contesto di regole inutili.',
        do:'L\'agente tiene dal base prompt solo le parti che servono allo step.',
        dont:'Incollare l\'intero base prompt in ogni chiamata.'},
      {n:'02',h:'I prompt composti restano su disco',
        why:'Puoi vedere esattamente cosa ha ricevuto l\'agente in ogni step, riusarlo, correggerlo e rilanciare.',
        do:'Apri <code>.workflow/prompts/&lt;key&gt;.composed.md</code> quando uno step fa qualcosa di strano.',
        dont:'Indovinare cosa «ha capito» l\'agente leggendo solo il diff.'},
      {n:'03',h:'Base prompt diversi per lavori diversi',
        why:'Un refactor e una feature hanno regole opposte su test e comportamento.',
        do:'<code>REFACTOR_RULES.md</code>, <code>FEATURE_RULES.md</code>, e <code>--base-prompt</code> per scegliere.',
        dont:'Un unico prompt con «se è un refactor fai X, se è una feature fai Y».'}
    ]},
    {t:'quiz',id:'q4a',q:'Cosa riceve l\'agente da CAAL all\'inizio di uno step agentico?',
      opts:[
        {tx:'Il contenuto completo del base prompt',ok:false,why:'No: riceve il percorso. È lui a leggerlo e a scegliere le parti utili.'},
        {tx:'Un prompt specifico scritto a mano per quello step',ok:false,why:'Non ci sono template fissi per step in caal.js.'},
        {tx:'Un meta-prompt con il percorso del base prompt e la procedura: leggi, componi, salva, esegui',ok:true,why:'Esatto. Il prompt specifico lo compone l\'agente e lo salva in <code>.workflow/prompts/</code>.'},
        {tx:'Solo il TASK.md',ok:false,why:'Il TASK.md dice cosa fare; il base prompt dice come. Servono entrambi.'}
      ]}
  ]
});

MODULES.push({
  id:'m5', n:'05', title:'Autonomo o human in the loop', min:15,
  blocks:[
    {t:'split2',a:{h:'Full autonomous',items:[
      ['Come','<code>node caal.js run</code> (o <code>task</code>/<code>start</code> senza flag).'],

    {t:'p',html:`<h3>I tre gate</h3>`},
    {t:'table',head:['Gate','Quando','Cosa puoi fare'],rows:[
      ['<strong>1 · Prima dello step</strong>','Prima di eseguire ogni step','<code>(1) execute</code> · <code>(2) skip</code> · <code>(3) mark as done</code> · <code>(4) stop</code>'],
      ['<strong>2 · Revisione del prompt</strong>','Solo step agentici, dopo che l\'agente ha composto il prompt','Aprire e <strong>modificare</strong> <code>.composed.md</code>, poi rispondere <code>y</code>: l\'esecuzione usa il file così come l\'hai lasciato.'],

node caal.js reset --yes        # cancella .workflow/ (non tocca specs/ né il codice)`},

MODULES.push({
  id:'m6', n:'06', title:'Laboratorio — Un task con CAAL', min:25,
  blocks:[
    {t:'p',html:`<p>Facciamo sviluppare all'agente <strong>una feature singola</strong>, senza user story: un <strong>export CSV dei file con più volatilità</strong>. L'app di <code>app_workshop</code> oggi calcola già la volatilità (US1, <code>node cli/run.js fileVolatility</code>) ma la restituisce solo in JSON: aggiungiamo l'uscita in CSV. Il comando <code>task</code> vuole due cose: <strong>cosa</strong> fare (<code>--description</code> e/o <code>--task_file</code>) e <strong>come</strong> lavorare (<code>--base-prompt</code>).</p>`},
    {t:'p',html:`<h3>1. La definizione del task</h3><p>Un file Markdown, per esempio <code>tasks/export_csv_volatilita.md</code>. CAAL lo copia in <code>specs/tasks/&lt;slug&gt;/TASK.md</code>; lo slug deriva dal primo titolo.</p>`},
    {t:'code',lang:'markdown',code:`# Export CSV dei file con più volatilità

Aggiungere al comando fileVolatility la possibilità di esportare
la lista dei file con più volatilità in formato CSV.

## Requisiti
- node cli/run.js fileVolatility --repoPath=<repo> --format=csv
- Senza --format (o con --format=json) l'output JSON resta identico a oggi
- Colonne, con riga di intestazione: path,changes
- Stesso ordinamento della vista JSON: modifiche decrescenti, a parità percorso alfabetico
- Funziona anche con --range (es. --range=HEAD~2..HEAD)
- I percorsi che contengono virgole o virgolette sono quotati secondo RFC 4180
- Se nell'intervallo non ci sono modifiche, il CSV contiene solo l'intestazione
- Gli errori restano quelli di oggi: { "status": "ERROR", "message": "..." } ed exit code diverso da 0
- Almeno 3 scenari BDD taggati @done in tests/features/gitAnalysis/

## Fuori scope
- Altri formati (xlsx, html)
- Cambiare come si calcola la volatilità
- Scrivere il CSV su file: va su stdout, il redirect lo fa chi lancia il comando`},
    {t:'p',html:`<h3>2. Lancio, con revisione umana</h3>`},
    {t:'code',lang:'bash',code:`cd /Code/app_workshop

node caal.js task \\
  --type feature \\
  --task_file tasks/export_csv_volatilita.md \\
  --base-prompt tasks/RALPH_PROMPT_TASK.md \\
  --human_in_the_loop true \\
  --agent 'pi -p "$(cat "$WORKFLOW_PROMPT_FILE")" --provider omlx --model Qwen3.8-27B-8bit --approve --mode json 2>&1 | tee pi-run-debug.log'`},
    {t:'p',html:`<h3>3. Ferma, guarda, riprendi</h3><p>Dopo <code>task.plan</code> scegli <code>(4) stop</code> al gate. Poi:</p>`},
    {t:'code',lang:'bash',code:`node caal.js status                 # task, piano, base prompt, prossimo step
cat specs/tasks/export-csv-dei-file-con-piu-volatilita/plan.md
# ...correggi plan.md se serve...
node caal.js resume

# a workflow finito, prova tu il risultato
node cli/run.js fileVolatility --repoPath=/Code --format=csv
node cli/run.js fileVolatility --repoPath=/Code --range=HEAD~5..HEAD --format=csv > volatility.csv`},
    {t:'p',html:`<h3>Dove trovare cosa</h3>`},
    {t:'table',head:['File','Contenuto'],rows:[
      ['<code>specs/tasks/&lt;slug&gt;/TASK.md</code>','La definizione del task'],
      ['<code>specs/tasks/&lt;slug&gt;/plan.md</code>','Il piano scritto dall\'agente'],
      ['<code>.workflow/prompts/&lt;key&gt;.md</code>','Il meta-prompt inviato all\'agente'],
      ['<code>.workflow/prompts/&lt;key&gt;.composed.md</code>','Il prompt specifico composto dall\'agente'],

/* ============================================================
   RENDERER
   ============================================================ */
const mounts = [];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderBlock(b, mid, i){
  const id = mid+'_'+i;
  switch(b.t){
    case 'p': return '<div class="prose">'+b.html+'</div>';
    case 'code': return '<pre><code>'+esc(b.code)+'</code></pre>';
    case 'callout':
      return '<div class="callout '+(b.kind||'')+'"><span class="ct">'+b.title+'</span><div>'+b.html+'</div></div>';
    case 'cards':
      return '<div class="grid c3">'+b.cards.map(c=>
        '<div class="card"><div class="tag">'+c.tag+'</div><h5>'+c.h+'</h5><p>'+c.p+'</p></div>').join('')+'</div>';
    case 'table':
    case 'tablewrap':
      return '<div class="tablewrap"><table><thead><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+
        '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    case 'compare':
      return '<h3>'+b.title+'</h3><div class="split">'+
        '<div class="pane bad"><div class="pane-h">'+b.bad.h+'</div><pre><code>'+esc(b.bad.code)+'</code></pre></div>'+
        '<div class="pane ok"><div class="pane-h">'+b.good.h+'</div><pre><code>'+esc(b.good.code)+'</code></pre></div></div>';
    case 'practices':
      return (b.title?'<h3>'+b.title+'</h3>':'')+b.items.map(it=>
        '<div class="bp"><div class="bp-h"><span class="bp-n">'+it.n+'</span><span>'+it.h+'</span></div>'+
        '<div class="bp-why"><strong>Perché:</strong> '+it.why+'</div>'+
        '<div class="bp-ex"><div class="do"><b>Fai così</b>'+it.do+'</div><div class="dont"><b>Non così</b>'+it.dont+'</div></div></div>').join('');
    case 'split2':
      return '<div class="split">'+[b.a,b.b].map(col=>
        '<div class="widget" style="margin:0"><div class="widget-t">'+col.h+'</div><div style="margin-top:10px">'+
        col.items.map(it=>'<div style="padding:8px 0;border-top:1px solid var(--line)"><strong style="font-size:13.5px">'+it[0]+
        '</strong><div style="font-size:13px;color:var(--muted)">'+it[1]+'</div></div>').join('')+'</div></div>').join('')+'</div>';
    case 'quiz':      mounts.push(()=>mountQuiz(id,b));      return '<div id="'+id+'"></div>';
    case 'exercise':  mounts.push(()=>mountExercise(id,b));  return '<div id="'+id+'"></div>';
    case 'checklist': mounts.push(()=>mountChecklist(id,b)); return '<div id="'+id+'"></div>';
    case 'agentloop': mounts.push(()=>mountAgentLoop(id));   return '<div id="'+id+'"></div>';
    case 'triage':    mounts.push(()=>mountTriage(id));      return '<div id="'+id+'"></div>';
    case 'promptkit': mounts.push(()=>mountPromptKit(id,b)); return '<div id="'+id+'"></div>';
    case 'reveal':    mounts.push(()=>mountReveal(id,b));    return '<div id="'+id+'"></div>';
    default: return '';
  }
}

function widgetShell(kind,title,sub,body){
  return '<div class="widget"><div class="widget-h"><span class="widget-k">'+kind+'</span><span class="widget-t">'+title+'</span></div>'+
    (sub?'<div class="widget-s">'+sub+'</div>':'')+body+'</div>';
}

/* ---------- quiz ---------- */
function mountQuiz(id, b){
  const el = document.getElementById(id);
  const marks = ['A','B','C','D','E'];
  const body = '<div id="'+id+'_opts">'+b.opts.map((o,k)=>
    '<button class="opt" data-k="'+k+'"><span class="mk">'+marks[k]+'</span>'+o.tx+
    '<div class="why">'+o.why+'</div></button>').join('')+'</div>'+
    '<div class="hint" id="'+id+'_fb" style="margin-top:8px"></div>';
  el.innerHTML = widgetShell('Quiz', b.q, '', body);
  const opts = el.querySelectorAll('.opt');
  const fb = document.getElementById(id+'_fb');
  function apply(k){
    opts.forEach((btn,j)=>{
      btn.disabled = true; btn.classList.add('shown');
      if(j===k) btn.classList.add(b.opts[j].ok?'sel-ok':'sel-bad');
      else if(b.opts[j].ok) btn.classList.add('reveal-ok');
    });
    fb.textContent = b.opts[k].ok ? '✓ Risposta corretta.' : '✗ Non corretta — la risposta giusta è evidenziata in verde.';
    fb.style.color = b.opts[k].ok ? 'var(--ok)' : 'var(--bad)';
  }
  opts.forEach(btn=>btn.addEventListener('click',()=>{
    const k = +btn.dataset.k; quizState[b.id]=k; saveAll(); apply(k); refreshStats();
  }));
  if(quizState[b.id]!==undefined) apply(quizState[b.id]);
}

function mountExercise(id, b){

  const body = '<textarea id="'+id+'_ta" rows="9" placeholder="'+esc(b.placeholder||'')+'"></textarea>'+
    '<div class="btnrow"><span class="saved" id="'+id+'_sv">salvato</span><span style="flex:1"></span>'+
    (b.solution?'<button class="btn" id="'+id+'_sol">Mostra nota del docente</button>':'')+'</div>'+
    (b.solution?'<div id="'+id+'_solbox" class="callout ok" style="display:none"><span class="ct"></span><div class="prose" style="font-size:14px">'+b.solution+'</div></div>':'');
  el.innerHTML = widgetShell('Esercizio', b.label, b.prompt, body);
  const ta = document.getElementById(id+'_ta');
  const sv = document.getElementById(id+'_sv');
  ta.value = answers[b.id] || '';
  let t;
  ta.addEventListener('input',()=>{
    answers[b.id]=ta.value; clearTimeout(t);
    t=setTimeout(()=>{ saveAll(); sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'),1200); refreshStats(); },400);
  });
  if(b.solution){
    const btn=document.getElementById(id+'_sol'), box=document.getElementById(id+'_solbox');
    btn.addEventListener('click',()=>{
      const open = box.style.display!=='none';
      box.style.display = open?'none':'block';
      btn.textContent = open?'Mostra nota del docente':'Nascondi nota';
    });
  }
}

/* ---------- checklist ---------- */
function mountChecklist(id, b){
  const el = document.getElementById(id);
  const saved = store.get('ck.'+b.id, []);
  const body = b.items.map((it,k)=>
    '<label class="chk'+(saved[k]?' on':'')+'" data-k="'+k+'"><input type="checkbox" '+(saved[k]?'checked':'')+
    '><span class="lb" style="font-weight:500">'+it+'</span></label>').join('')+
    '<div class="scoreline" style="margin-top:8px"><span id="'+id+'_c"></span><span></span></div>';
  el.innerHTML = widgetShell('Checklist', b.title, 'Le spunte si salvano nel browser e finiscono nell’export.', body);
  const rows = el.querySelectorAll('.chk');
  const cnt = document.getElementById(id+'_c');
  function upd(){
    let n=0; rows.forEach((r,k)=>{ const c=r.querySelector('input').checked; saved[k]=c; if(c)n++; r.classList.toggle('on',c); });
    cnt.textContent = n+'/'+b.items.length+' completati';
    store.set('ck.'+b.id, saved); refreshStats();
  }
  rows.forEach(r=>r.querySelector('input').addEventListener('change',upd));
  upd();
}

function mountAgentLoop(id){
  const el = document.getElementById(id);
  let i = 0, timer = null;
  const body =
    '<div class="loopgrid" id="'+id+'_g"></div>'+
    '<div class="preview" id="'+id+'_lg"></div>'+
    '<div class="btnrow">'+
      '<button class="btn primary" id="'+id+'_nx">Passo successivo</button>'+
      '<button class="btn" id="'+id+'_au">▶ Automatico</button>'+
      '<button class="btn" id="'+id+'_rs">Riavvia</button>'+
      '<span class="hint" id="'+id+'_c" style="margin-left:auto"></span>'+
    '</div>';
  el.innerHTML = widgetShell('Lab 3.1','Un task CAAL, step per step',
    'Un task che fallisce la regressione, viene fermato e ripreso. Guarda come il runner sa sempre dove si trova.', body);
  const g = document.getElementById(id+'_g'), lg = document.getElementById(id+'_lg');
  function draw(){
    g.innerHTML = LOOP.map((s,k)=>
      '<div class="lstep'+(k===i?' on':(k<i?' past':''))+'"><b>'+s.b+'</b>'+s.t+'<span>'+s.d+'</span></div>').join('');
    lg.textContent = LOOP.slice(0,i+1).map(s=>s.log).join('\n');
    lg.scrollTop = lg.scrollHeight;
    document.getElementById(id+'_c').textContent = 'passo '+(i+1)+' di '+LOOP.length;
  }
  function next(){ if(i<LOOP.length-1){ i++; draw(); } else stop(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; document.getElementById(id+'_au').textContent='▶ Automatico'; } }
  document.getElementById(id+'_nx').addEventListener('click',()=>{ stop(); next(); });
  document.getElementById(id+'_rs').addEventListener('click',()=>{ stop(); i=0; draw(); });
  document.getElementById(id+'_au').addEventListener('click',()=>{
    if(timer){ stop(); return; }
    if(i>=LOOP.length-1) i=0;
    document.getElementById(id+'_au').textContent='⏸ Pausa';
    timer = setInterval(next, 1600); draw();
  });
  draw();
}

function mountTriage(id){
  const el = document.getElementById(id);
  const saved = store.get('triage', {});
  const body = TRIAGE.map((it,k)=>
    '<div class="sorter-row" data-k="'+k+'"><span class="it">'+it.tx+'</span><span class="bs">'+
    ['c','p','x'].map(c=>'<button class="bbtn" data-c="'+c+'">'+TR_LB[c]+'</button>').join('')+
    '</span><span class="fb"></span></div>').join('')+
    '<div class="scoreline" style="margin-top:10px"><span id="'+id+'_s"></span><button class="btn" id="'+id+'_rs" style="padding:3px 10px;font-size:12px">Azzera</button></div>';
  el.innerHTML = widgetShell('Lab 2.1','CAAL o prompt singolo?',
    'Per ogni compito: serve un workflow CAAL, basta un prompt singolo (anche come Ralph), o non va affidato all\'agente?', body);
  const rows = el.querySelectorAll('.sorter-row');
  function paint(){
    let ok=0, tot=0;
    rows.forEach((r,k)=>{
      const ch = saved[k];
      r.querySelectorAll('.bbtn').forEach(b=>b.classList.toggle('on', b.dataset.c===ch));
      r.classList.remove('ok','bad','done');
      if(ch){ tot++; const good = ch===TRIAGE[k].a; if(good) ok++;
        r.classList.add('done', good?'ok':'bad');
        r.querySelector('.fb').textContent = (good?'✓ ':'✗ ')+TRIAGE[k].why;
      } else r.querySelector('.fb').textContent='';
    });
    document.getElementById(id+'_s').textContent = tot? ok+'/'+tot+' corrette ('+TRIAGE.length+' in tutto)' : 'nessuna risposta';

  rows.forEach(r=>r.querySelectorAll('.bbtn').forEach(b=>b.addEventListener('click',()=>{
    saved[r.dataset.k]=b.dataset.c; store.set('triage',saved); paint();
  })));
  document.getElementById(id+'_rs').addEventListener('click',()=>{
    Object.keys(saved).forEach(k=>delete saved[k]); store.set('triage',saved); paint();
  });
  paint();
}

    b.fields.map(f=>'<label class="fl">'+f.lb+'</label><textarea data-k="'+f.k+'" rows="'+f.rows+'" placeholder="'+esc(f.ph)+'"></textarea>').join('')+

  el.innerHTML = widgetShell('Compito', b.title, b.sub, body);
  const tas = el.querySelectorAll('textarea');
  const pv = document.getElementById(id+'_pv');
  let last='';
  function upd(save){
    const v = {};
    tas.forEach(ta=>{ v[ta.dataset.k]=ta.value.trim(); answers[b.id+'.'+ta.dataset.k]=ta.value; });
    last = b.build(v);
    pv.textContent = last;

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=MODULES.map((m,i)=>
    '<button class="navitem'+(i===current?' active':'')+'" data-i="'+i+'">'+
    '<span class="idx">'+m.n+'</span><span><span class="nt">'+m.title+'</span><span class="nm">'+m.min+' minuti</span></span>'+
    (done[m.id]?'<span class="tick">●</span>':'')+'</button>').join('');
  nav.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
}

function renderModule(){
  const m=MODULES[current];
  mounts.length=0;
  const main=document.getElementById('main');
  const isBreak = m.id==='brk';
  let html='';
  if(!isBreak){
    html+='<div class="eyebrow">Modulo '+m.n+' · '+m.min+' minuti</div><h1>'+m.title+'</h1>';
    html+='<div class="mod-meta"><span class="badge">'+(current+1)+' di '+MODULES.length+'</span>'+
      '<span class="badge" id="modTimer">⏱ --:--</span>'+
      '<label class="chk" style="margin:0;padding:6px 11px"><input type="checkbox" id="modDone" '+(done[m.id]?'checked':'')+'><span class="lb" style="font-weight:600;font-size:13px">Modulo completato</span></label></div>';
  }
  html+=m.blocks.map((b,i)=>renderBlock(b,m.id,i)).join('');
  html+='<div class="footnav">'+
    (current>0?'<button class="btn" id="prevBtn">← '+MODULES[current-1].title+'</button>':'<span></span>')+
    (current<MODULES.length-1?'<button class="btn primary" id="nextBtn">'+MODULES[current+1].title+' →</button>':'<span></span>')+
    '</div>';
  main.innerHTML=html;
  mounts.forEach(f=>f());
  const pb=document.getElementById('prevBtn'); if(pb) pb.addEventListener('click',()=>go(current-1));
  const nb=document.getElementById('nextBtn'); if(nb) nb.addEventListener('click',()=>{
    if(!isBreak && !done[m.id]){ done[m.id]=true; saveAll(); }
    go(current+1);
  });
  const md=document.getElementById('modDone');
  if(md) md.addEventListener('change',()=>{ if(md.checked) done[m.id]=true; else delete done[m.id]; saveAll(); renderNav(); refreshStats(); });
  window.scrollTo({top:0,behavior:'instant'});
  updModTimer();
}

function go(i){
  if(i<0||i>=MODULES.length) return;
  current=i; store.set('current',i); renderNav(); renderModule(); refreshStats();
}

/* ============================================================
   TIMER
   ============================================================ */
const TOTAL=MODULES.reduce((s,m)=>s+m.min,0)*60;
let elapsed=store.get('elapsed',0), running=false, tick=null;
let modStart=null;
function fmt(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function paintClock(){
  const c=document.getElementById('clock');
  c.textContent=fmt(elapsed)+' / '+fmt(TOTAL);
  c.style.color = elapsed>TOTAL?'var(--bad)': elapsed>TOTAL*0.9?'var(--warn)':'';
}
function updModTimer(){
  const e=document.getElementById('modTimer'); if(!e) return;
  const m=MODULES[current];
  const spent = modStart!==null? Math.floor((elapsed-modStart)) : 0;
  e.textContent='⏱ '+Math.floor(spent/60)+' / '+m.min+' min';
  e.style.color = spent/60>m.min?'var(--warn)':'';
}
function toggleTimer(){
  running=!running;
  const b=document.getElementById('timerBtn');
  b.textContent = running?'⏸ Pausa timer':'▶ Avvia timer';
  if(running){ if(modStart===null) modStart=elapsed;
    tick=setInterval(()=>{ elapsed++; store.set('elapsed',elapsed); paintClock(); updModTimer(); },1000); }
  else clearInterval(tick);
}

function allBlocks(t){ return MODULES.flatMap(m=>m.blocks.filter(b=>b.t===t).map(b=>({m:m,b:b}))); }

function refreshStats(){
  const quizzes = allBlocks('quiz');
  const aQ=Object.keys(quizState).length;
  const okQ=quizzes.filter(x=>quizState[x.b.id]!==undefined && x.b.opts[quizState[x.b.id]].ok).length;
  const exIds=allBlocks('exercise').map(x=>x.b.id);
  const aE=exIds.filter(k=>(answers[k]||'').trim().length>20).length;
  const kits=allBlocks('promptkit');
  const aK=kits.filter(x=>x.b.fields.some(f=>(answers[x.b.id+'.'+f.k]||'').trim().length>10)).length;
  const dM=Object.keys(done).length;
  const nM=MODULES.filter(m=>m.id!=='brk').length;
  document.getElementById('statsBox').innerHTML=
    'Moduli completati <strong>'+dM+'/'+nM+'</strong><br>'+
    'Quiz risposti <strong>'+aQ+'/'+quizzes.length+'</strong>'+(aQ?' · corretti <strong>'+okQ+'</strong>':'')+'<br>'+
    'Esercizi svolti <strong>'+aE+'/'+exIds.length+'</strong>'+
    (kits.length?'<br>Compiti composti <strong>'+aK+'/'+kits.length+'</strong>':'');
  const tot=nM+quizzes.length+exIds.length+kits.length;
  document.getElementById('pbar').style.width=((dM+aQ+aE+aK)/tot*100)+'%';
}

function doExport(){
  const L=[];
  const d=new Date();
  const stamp=d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  L.push('# CAAL e Skills agentic era — 3 ore e 30');
  L.push('');
  L.push('Esportato il '+stamp+'  ·  tempo d’aula registrato: '+fmt(elapsed));
  L.push('');
  L.push('## Risposte agli esercizi');
  allBlocks('exercise').forEach(x=>{
    const v=(answers[x.b.id]||'').trim();
    L.push(''); L.push('### '+x.m.n+' — '+x.b.label);
    L.push(''); L.push('> '+x.b.prompt);
    L.push(''); L.push(v||'_(non compilato)_');
  });
  if(allBlocks('promptkit').length){ L.push(''); L.push('## Compiti composti (da riusare)'); }
  allBlocks('promptkit').forEach(x=>{
    const v={}; let any=false;
    x.b.fields.forEach(f=>{ v[f.k]=(answers[x.b.id+'.'+f.k]||'').trim(); if(v[f.k]) any=true; });
    L.push(''); L.push('### '+x.m.n+' — '+x.b.title);
    L.push('');
    if(!any){ L.push('_(non compilato)_'); }
    else { L.push('```'); L.push(x.b.build(v)); L.push('```'); }
  });
  L.push(''); L.push('## Quiz');
  allBlocks('quiz').forEach(x=>{
    const k=quizState[x.b.id];
    L.push('- **'+x.b.q.replace(/<[^>]+>/g,'')+'**');
    L.push('  - Risposta data: '+(k===undefined?'_nessuna_':x.b.opts[k].tx+(x.b.opts[k].ok?' ✅':' ❌')));
    if(k!==undefined&&!x.b.opts[k].ok) L.push('  - Corretta: '+x.b.opts.find(o=>o.ok).tx);
  });
  L.push(''); L.push('## Checklist');
  allBlocks('checklist').forEach(x=>{
    const s=store.get('ck.'+x.b.id,[]);
    L.push(''); L.push('### '+x.m.n+' — '+x.b.title);
    x.b.items.forEach((it,i)=>L.push('- ['+(s[i]?'x':' ')+'] '+it));
  });
  const tr=store.get('triage',null);
  if(tr && Object.keys(tr).length){
    L.push(''); L.push('## Esercizio «CAAL o prompt singolo?»');
    let ok=0, tot=0;
    TRIAGE.forEach((it,k)=>{ if(tr[k]!==undefined){ tot++; if(tr[k]===it.a) ok++;
      L.push('- '+(tr[k]===it.a?'✅':'❌')+' '+it.tx+' → hai scelto **'+TR_LB[tr[k]]+'**'+(tr[k]===it.a?'':', corretta: **'+TR_LB[it.a]+'**')); } });
    L.push('');
    L.push('**'+ok+'/'+tot+' corrette.**');
  }
  const blob=new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='corso-caal-skills.md';
  a.click(); URL.revokeObjectURL(a.href);
}

  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});
if(!store.get('theme',null) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme','dark');
else document.documentElement.setAttribute('data-theme', store.get('theme','light'));

renderNav(); renderModule(); paintClock(); refreshStats();
</script>
</body>
